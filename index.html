<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary Presence Detector</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      font-family: monospace;
    }

    #container {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: black;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    video {
      display: none;
    }

    #binaryCanvas {
      z-index: 1;
      image-rendering: pixelated;
    }

    #detectCanvas {
      z-index: 2;
      pointer-events: none;
    }

    #status {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      color: #00aaff;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-shadow: 0 0 8px #00aaff;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 10px;
      border: 1px solid rgba(0, 170, 255, 0.5);
    }

    #startButton {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: black;
      color: #00aaff;
      border: 1px solid #00aaff;
      padding: 16px 24px;
      font-size: 16px;
      font-family: monospace;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,170,255,0.4);
    }

    #startButton:hover {
      background: #001622;
    }
  </style>
</head>

<body>
  <div id="container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="binaryCanvas"></canvas>
    <canvas id="detectCanvas"></canvas>
  </div>

  <div id="status">SYSTEM READY</div>
  <button id="startButton">START CAMERA</button>

  <script>
    const video = document.getElementById("video");
    const binaryCanvas = document.getElementById("binaryCanvas");
    const binaryCtx = binaryCanvas.getContext("2d", { willReadFrequently: true });

    const detectCanvas = document.getElementById("detectCanvas");
    const detectCtx = detectCanvas.getContext("2d");

    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    let model;
    let running = false;

    const binaryResolution = 120;
    const threshold = 115;

    function resizeCanvas() {
      binaryCanvas.width = window.innerWidth;
      binaryCanvas.height = window.innerHeight;
      detectCanvas.width = window.innerWidth;
      detectCanvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    async function start() {
      startButton.style.display = "none";
      statusEl.innerText = "LOADING MODEL...";

      model = await cocoSsd.load();

      statusEl.innerText = "ACCESSING CAMERA...";

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "environment",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;

      video.onloadedmetadata = () => {
        video.play();
        running = true;
        statusEl.innerText = "DETECTING PRESENCE";
        renderBinary();
        detectPeople();
      };
    }

    startButton.addEventListener("click", start);

    function renderBinary() {
      if (!running) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (vw && vh) {
        const smallW = binaryResolution;
        const smallH = Math.floor(binaryResolution * (vh / vw));

        const tempCanvas = document.createElement("canvas");
        const tempCtx = tempCanvas.getContext("2d", { willReadFrequently: true });

        tempCanvas.width = smallW;
        tempCanvas.height = smallH;

        tempCtx.drawImage(video, 0, 0, smallW, smallH);

        const imageData = tempCtx.getImageData(0, 0, smallW, smallH);
        const data = imageData.data;

        binaryCtx.clearRect(0, 0, binaryCanvas.width, binaryCanvas.height);
        binaryCtx.fillStyle = "black";
        binaryCtx.fillRect(0, 0, binaryCanvas.width, binaryCanvas.height);

        const cellW = binaryCanvas.width / smallW;
        const cellH = binaryCanvas.height / smallH;

        binaryCtx.font = `${Math.ceil(cellH * 1.2)}px monospace`;
        binaryCtx.textAlign = "center";
        binaryCtx.textBaseline = "middle";

        for (let y = 0; y < smallH; y++) {
          for (let x = 0; x < smallW; x++) {
            const i = (y * smallW + x) * 4;

            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            const brightness = (r + g + b) / 3;
            const bit = brightness > threshold ? "1" : "0";

            const alpha = brightness / 255;
            binaryCtx.fillStyle = bit === "1"
              ? `rgba(0, 255, 180, ${0.3 + alpha * 0.7})`
              : `rgba(0, 70, 255, ${0.15 + alpha * 0.45})`;

            const drawX = x * cellW + cellW / 2;
            const drawY = y * cellH + cellH / 2;

            binaryCtx.fillText(bit, drawX, drawY);
          }
        }
      }

      requestAnimationFrame(renderBinary);
    }

    async function detectPeople() {
      if (!running || !model) return;

      const predictions = await model.detect(video);

      detectCtx.clearRect(0, 0, detectCanvas.width, detectCanvas.height);

      const scaleX = detectCanvas.width / video.videoWidth;
      const scaleY = detectCanvas.height / video.videoHeight;

      let personCount = 0;

      predictions.forEach(pred => {
        if (pred.class === "person" && pred.score > 0.45) {
          personCount++;

          let [x, y, w, h] = pred.bbox;

          x *= scaleX;
          y *= scaleY;
          w *= scaleX;
          h *= scaleY;

          const mirroredX = detectCanvas.width - x - w;

          detectCtx.strokeStyle = "#008CFF";
          detectCtx.lineWidth = 4;
          detectCtx.shadowColor = "#008CFF";
          detectCtx.shadowBlur = 18;
          detectCtx.strokeRect(mirroredX, y, w, h);

          detectCtx.shadowBlur = 0;
          detectCtx.fillStyle = "rgba(0, 140, 255, 0.18)";
          detectCtx.fillRect(mirroredX, y, w, h);

          detectCtx.fillStyle = "#008CFF";
          detectCtx.font = "16px monospace";
          detectCtx.fillText(
            `PERSON ${(pred.score * 100).toFixed(1)}%`,
            mirroredX,
            Math.max(y - 8, 20)
          );
        }
      });

      statusEl.innerText = `BINARY VISION / PERSON: ${personCount}`;

      setTimeout(detectPeople, 120);
    }
  </script>
</body>
</html>
