<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;background:#000;}
canvas{position:absolute;width:100%;height:100%;}
</style>
</head>

<body>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let detector;
let tracks = [];
let nextID = 1;

async function init(){
  const stream = await navigator.mediaDevices.getUserMedia({
    video:{facingMode:"environment"}
  });
  video.srcObject = stream;

  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet
  );

  resize();
  loop();
}

function resize(){
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

window.onresize = resize;

function getBox(keypoints){
  let xs = keypoints.map(k=>k.x);
  let ys = keypoints.map(k=>k.y);

  let minX = Math.min(...xs);
  let maxX = Math.max(...xs);
  let minY = Math.min(...ys);
  let maxY = Math.max(...ys);

  return {
    x:minX,
    y:minY,
    w:maxX-minX,
    h:maxY-minY,
    cx:(minX+maxX)/2,
    cy:(minY+maxY)/2
  };
}

function trackPeople(boxes){
  let newTracks=[];

  boxes.forEach(b=>{
    let best=null, bestDist=9999;

    tracks.forEach(t=>{
      let d = Math.hypot(t.cx-b.cx, t.cy-b.cy);
      if(d<bestDist && d<100){
        best=t;
        bestDist=d;
      }
    });

    if(best){
      let motion = Math.hypot(b.cx-best.cx, b.cy-best.cy)/300;

      best.motion = best.motion*0.7 + motion*0.3;
      best.cx=b.cx; best.cy=b.cy;
      best.w=b.w; best.h=b.h;
      best.life=0;

      newTracks.push(best);
    }else{
      newTracks.push({
        id:nextID++,
        ...b,
        motion:0,
        life:0
      });
    }
  });

  tracks.forEach(t=>t.life++);
  tracks = [...newTracks, ...tracks.filter(t=>t.life<60)];
}

async function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const poses = await detector.estimatePoses(video);

  let boxes = poses.map(p=>getBox(p.keypoints));
  trackPeople(boxes);

  tracks.forEach(t=>{
    ctx.strokeStyle="#0047FF";
    ctx.lineWidth=2;
    ctx.strokeRect(t.cx-t.w/2, t.cy-t.h/2, t.w, t.h);

    ctx.fillStyle="#0047FF";
    ctx.fillText("ID "+t.id, t.cx-20, t.cy-20);
  });

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
