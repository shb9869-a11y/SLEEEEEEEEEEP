<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>인기척: YOLO Ripple Viewer</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <style>
    :root{
      --bg:#000;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --line:rgba(255,255,255,0.06);
      --panel:rgba(8,8,8,0.94);
      --blue:#0047FF;
      --blueSoft:rgba(0,71,255,0.18);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;}
    body{
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        #000;
      background-size:44px 44px,44px 44px,auto;
    }
    #app{position:relative;width:100vw;height:100vh;overflow:hidden;}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
    .topbar{
      position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);
      z-index:20;display:flex;justify-content:space-between;align-items:center;
    }
    .left,.right{display:flex;gap:8px;align-items:center;}
    .btn,.chip{
      min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);
      background:rgba(8,8,8,0.9);color:#fff;display:flex;align-items:center;justify-content:center;
      backdrop-filter:blur(8px);font-size:13px;
    }
    .btn{cursor:pointer}
    .menu{
      position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 62px);
      z-index:20;width:min(320px, calc(100vw - 20px));
      background:rgba(8,8,8,0.94);border:1px solid rgba(255,255,255,0.12);
      border-radius:16px;padding:14px;
      display:flex;flex-direction:column;gap:10px;
      backdrop-filter:blur(10px);
    }
    .row{display:flex;gap:8px;flex-wrap:wrap;}
    .smbtn{
      min-height:40px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);
      background:#151515;color:#fff;cursor:pointer;font-size:13px;font-weight:600;
    }
    .smbtn.active{background:#fff;color:#000;border-color:#fff;}
    .hint{
      position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;
      background:rgba(8,8,8,0.86);border:1px solid rgba(255,255,255,0.12);border-radius:16px;
      padding:12px 14px;font-size:12px;color:var(--muted);max-width:min(360px, calc(100vw - 20px));
      line-height:1.5;
    }
    .hint strong{color:#fff;}
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="left">
      <div id="menuBtn" class="btn">☰</div>
      <div id="modeChip" class="chip">관객 디텍팅</div>
    </div>
    <div class="right">
      <div id="fullscreenBtn" class="btn">⤢</div>
    </div>
  </div>

  <div id="menu" class="menu">
    <div class="row">
      <button id="modeDetectBtn" class="smbtn active">1. 디텍팅</button>
      <button id="modeRippleBtn" class="smbtn">2. 파동</button>
    </div>
    <div class="row">
      <button id="view2DBtn" class="smbtn active">2D Grid</button>
      <button id="view3DBtn" class="smbtn">3D Module</button>
    </div>
    <div class="row">
      <button id="toggleDualBtn" class="smbtn active">가로 동시 보기</button>
    </div>
    <div style="font-size:12px;color:#9a9a9a;line-height:1.5;">
      웹소켓 주소는 코드 안의 <code>WS_URL</code> 에서 바꿔.
      맥북 서버가 YOLO 추적 결과를 보내고, 이 화면은 그리기만 한다.
    </div>
  </div>

  <div class="hint">
    <strong>로직</strong><br/>
    YOLO + ByteTrack ID → 움직임 강도 계산 → 기준 넘으면 파동 발화 → 확산 + 감쇠
  </div>

  <canvas id="canvas"></canvas>
</div>

<script>
(() => {
  // 네 맥북 IP로 바꿔
  const WS_URL = "ws://192.168.0.10:8765";

  const state = {
    mode: "detect", // detect | ripple
    view: "2d",     // 2d | 3d
    dualLandscape: true,
    menuOpen: true,

    sourceW: 1280,
    sourceH: 720,
    tracks: [],

    gridW: 10,
    gridH: 10,
    grid: [],
    vel: [],

    motionThreshold: 0.012,
    damping: 0.968,
    pulseScale: 1.6,

    fps: 0,
    lastFrameTime: performance.now()
  };

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const ui = {
    menu: document.getElementById("menu"),
    menuBtn: document.getElementById("menuBtn"),
    fullscreenBtn: document.getElementById("fullscreenBtn"),
    modeChip: document.getElementById("modeChip"),
    modeDetectBtn: document.getElementById("modeDetectBtn"),
    modeRippleBtn: document.getElementById("modeRippleBtn"),
    view2DBtn: document.getElementById("view2DBtn"),
    view3DBtn: document.getElementById("view3DBtn"),
    toggleDualBtn: document.getElementById("toggleDualBtn")
  };

  function initField(){
    state.grid = Array.from({length: state.gridH}, () => Array(state.gridW).fill(0));
    state.vel = Array.from({length: state.gridH}, () => Array(state.gridW).fill(0));
  }

  function resize(){
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function isLandscape(){
    return window.innerWidth > window.innerHeight;
  }

  function clamp(v, a, b){
    return Math.max(a, Math.min(b, v));
  }

  function updateUI(){
    ui.menu.style.display = state.menuOpen ? "flex" : "none";
    ui.modeChip.textContent = state.mode === "detect" ? "관객 디텍팅" : "파동 시각화";
    ui.modeDetectBtn.classList.toggle("active", state.mode === "detect");
    ui.modeRippleBtn.classList.toggle("active", state.mode === "ripple");
    ui.view2DBtn.classList.toggle("active", state.view === "2d");
    ui.view3DBtn.classList.toggle("active", state.view === "3d");
    ui.toggleDualBtn.classList.toggle("active", state.dualLandscape);
  }

  function connectWS(){
    const ws = new WebSocket(WS_URL);

    ws.onmessage = (event) => {
      try{
        const data = JSON.parse(event.data);
        if(data.type !== "tracks") return;
        state.sourceW = data.width || 1280;
        state.sourceH = data.height || 720;
        state.tracks = Array.isArray(data.tracks) ? data.tracks : [];
      }catch(err){
        console.error(err);
      }
    };

    ws.onclose = () => {
      setTimeout(connectWS, 1200);
    };

    ws.onerror = () => {
      ws.close();
    };
  }

  function mapTrackToRect(track, rect){
    const x = (track.cx / state.sourceW) * rect.w;
    const y = (track.cy / state.sourceH) * rect.h;
    const w = (track.w / state.sourceW) * rect.w;
    const h = (track.h / state.sourceH) * rect.h;
    return {
      cx: rect.x + x,
      cy: rect.y + y,
      w,
      h
    };
  }

  function normalizeTrackToGrid(track){
    return {
      gx: (track.cx / state.sourceW) * (state.gridW - 1),
      gy: (track.cy / state.sourceH) * (state.gridH - 1)
    };
  }

  function injectRipples(){
    for(const t of state.tracks){
      if((t.motion || 0) < state.motionThreshold) continue;
      const p = normalizeTrackToGrid(t);
      const gx = Math.round(p.gx);
      const gy = Math.round(p.gy);
      if(gx < 0 || gx >= state.gridW || gy < 0 || gy >= state.gridH) continue;
      const pulse = clamp((t.motion - state.motionThreshold) / 0.05, 0, 1.5);
      state.vel[gy][gx] += 0.20 + pulse * state.pulseScale;
    }
  }

  function updateWave(){
    injectRipples();
    const next = Array.from({length: state.gridH}, () => Array(state.gridW).fill(0));
    for(let y=0;y<state.gridH;y++){
      for(let x=0;x<state.gridW;x++){
        const c = state.grid[y][x];
        const l = x>0 ? state.grid[y][x-1] : 0;
        const r = x<state.gridW-1 ? state.grid[y][x+1] : 0;
        const u = y>0 ? state.grid[y-1][x] : 0;
        const d = y<state.gridH-1 ? state.grid[y+1][x] : 0;
        const lap = (l+r+u+d - 4*c);
        state.vel[y][x] += lap * 0.22;
        state.vel[y][x] *= state.damping;
        next[y][x] = c + state.vel[y][x];
      }
    }
    state.grid = next;
  }

  function drawGridBackground(rect){
    ctx.save();
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    for(let x=0; x<=rect.w; x+=44){
      ctx.beginPath();
      ctx.moveTo(rect.x + x, rect.y);
      ctx.lineTo(rect.x + x, rect.y + rect.h);
      ctx.stroke();
    }
    for(let y=0; y<=rect.h; y+=44){
      ctx.beginPath();
      ctx.moveTo(rect.x, rect.y + y);
      ctx.lineTo(rect.x + rect.w, rect.y + y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDetect(rect){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.92)";
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
    drawGridBackground(rect);

    for(const t of state.tracks){
      const m = mapTrackToRect(t, rect);
      const x = m.cx - m.w/2;
      const y = m.cy - m.h/2;

      ctx.strokeStyle = "#0047FF";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, m.w, m.h);

      ctx.fillStyle = "rgba(0,71,255,0.16)";
      ctx.fillRect(x, y, m.w, m.h);

      const label = `ID ${t.id}`;
      ctx.font = "bold 14px sans-serif";
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(0,0,0,0.92)";
      ctx.fillRect(x, y - 24, tw + 16, 20);
      ctx.strokeStyle = "#0047FF";
      ctx.strokeRect(x, y - 24, tw + 16, 20);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, x + 8, y - 9);

      const motionBarW = Math.max(24, m.w);
      const motionNorm = clamp((t.motion || 0) / 0.05, 0, 1);
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(x, y + m.h + 8, motionBarW, 4);
      ctx.fillStyle = "#0047FF";
      ctx.fillRect(x, y + m.h + 8, motionBarW * motionNorm, 4);
    }

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("관객 디텍팅 / YOLO Track ID", rect.x + 18, rect.y + rect.h - 18);
    ctx.restore();
  }

  function waveGray(v){
    const t = clamp(Math.abs(v), 0, 2.0) / 2.0;
    const c = Math.floor(18 + t * 220);
    const a = 0.15 + t * 0.85;
    return `rgba(${c},${c},${c},${a})`;
  }

  function drawRipple2D(rect){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.94)";
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

    const leftPad = 44, topPad = 54, rightPad = 20, bottomPad = 24;
    const gw = rect.w - leftPad - rightPad;
    const gh = rect.h - topPad - bottomPad;
    const cellW = gw / state.gridW;
    const cellH = gh / state.gridH;

    for(let y=0;y<state.gridH;y++){
      for(let x=0;x<state.gridW;x++){
        const px = rect.x + leftPad + x * cellW;
        const py = rect.y + topPad + y * cellH;
        const v = state.grid[y][x];
        ctx.fillStyle = waveGray(v);
        ctx.fillRect(px + 4, py + 4, cellW - 8, cellH - 8);
        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.strokeRect(px + 4, py + 4, cellW - 8, cellH - 8);
      }
    }

    for(const t of state.tracks){
      const p = normalizeTrackToGrid(t);
      const px = rect.x + leftPad + (p.gx + 0.5) * cellW;
      const py = rect.y + topPad + (p.gy + 0.5) * cellH;
      const active = (t.motion || 0) >= state.motionThreshold;

      ctx.beginPath();
      ctx.arc(px, py, active ? 7 : 5, 0, Math.PI * 2);
      ctx.fillStyle = active ? "#0047FF" : "rgba(255,255,255,0.45)";
      ctx.fill();

      const label = `ID ${t.id}`;
      ctx.font = "bold 12px sans-serif";
      const tw = ctx.measureText(label).width;
      ctx.fillStyle = "rgba(0,0,0,0.92)";
      ctx.fillRect(px - tw/2 - 7, py - 28, tw + 14, 18);
      ctx.strokeStyle = active ? "#0047FF" : "rgba(255,255,255,0.25)";
      ctx.strokeRect(px - tw/2 - 7, py - 28, tw + 14, 18);
      ctx.fillStyle = "#fff";
      ctx.fillText(label, px - tw/2, py - 15);
    }

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("파동 / motion-triggered ripple", rect.x + 18, rect.y + 28);
    ctx.restore();
  }

  function drawRipple3D(rect){
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.94)";
    ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

    const centerX = rect.x + rect.w * 0.5;
    const startY = rect.y + rect.h * 0.22;
    const tileW = Math.min(42, rect.w / 18);
    const tileH = tileW * 0.55;
    const baseHeight = Math.min(18, rect.h / 30);

    for(let gy=0; gy<state.gridH; gy++){
      for(let gx=0; gx<state.gridW; gx++){
        const v = clamp(Math.abs(state.grid[gy][gx]), 0, 2.0);
        const h = baseHeight + v * 34;

        const sx = centerX + (gx - gy) * tileW * 0.5;
        const sy = startY + (gx + gy) * tileH * 0.5;

        const top = [
          [sx, sy - h],
          [sx + tileW*0.5, sy - tileH*0.5 - h],
          [sx, sy - tileH - h],
          [sx - tileW*0.5, sy - tileH*0.5 - h]
        ];
        const right = [
          [sx, sy - h],
          [sx + tileW*0.5, sy - tileH*0.5 - h],
          [sx + tileW*0.5, sy - tileH*0.5],
          [sx, sy]
        ];
        const left = [
          [sx, sy - h],
          [sx - tileW*0.5, sy - tileH*0.5 - h],
          [sx - tileW*0.5, sy - tileH*0.5],
          [sx, sy]
        ];

        const tg = Math.floor(40 + v * 90);
        const rg = Math.floor(24 + v * 54);
        const lg = Math.floor(14 + v * 36);

        ctx.beginPath();
        ctx.moveTo(top[0][0], top[0][1]); top.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
        ctx.fillStyle = `rgba(${tg},${tg},${tg},0.96)`; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(right[0][0], right[0][1]); right.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
        ctx.fillStyle = `rgba(${rg},${rg},${rg},0.92)`; ctx.fill();

        ctx.beginPath();
        ctx.moveTo(left[0][0], left[0][1]); left.slice(1).forEach(p => ctx.lineTo(p[0], p[1])); ctx.closePath();
        ctx.fillStyle = `rgba(${lg},${lg},${lg},0.94)`; ctx.fill();
      }
    }

    for(const t of state.tracks){
      const p = normalizeTrackToGrid(t);
      const sx = centerX + (p.gx - p.gy) * tileW * 0.5;
      const sy = startY + (p.gx + p.gy) * tileH * 0.5 - 98;
      const active = (t.motion || 0) >= state.motionThreshold;
      ctx.beginPath();
      ctx.arc(sx, sy, active ? 7 : 5, 0, Math.PI * 2);
      ctx.fillStyle = active ? "#0047FF" : "rgba(255,255,255,0.45)";
      ctx.fill();
    }

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("3D module ripple", rect.x + 18, rect.y + 28);
    ctx.restore();
  }

  function render(now){
    const dt = now - state.lastFrameTime;
    state.lastFrameTime = now;
    state.fps = 1000 / Math.max(1, dt);

    updateWave();

    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);

    if(state.mode === "detect"){
      drawDetect({x:0,y:0,w:canvas.clientWidth,h:canvas.clientHeight});
    } else {
      if(isLandscape() && state.dualLandscape){
        const leftW = Math.max(280, canvas.clientWidth * 0.34);
        drawDetect({x:0,y:0,w:leftW,h:canvas.clientHeight});
        const rr = {x:leftW,y:0,w:canvas.clientWidth-leftW,h:canvas.clientHeight};
        if(state.view === "2d") drawRipple2D(rr);
        else drawRipple3D(rr);

        ctx.strokeStyle = "rgba(255,255,255,0.08)";
        ctx.beginPath();
        ctx.moveTo(leftW, 0);
        ctx.lineTo(leftW, canvas.clientHeight);
        ctx.stroke();
      } else {
        const rr = {x:0,y:0,w:canvas.clientWidth,h:canvas.clientHeight};
        if(state.view === "2d") drawRipple2D(rr);
        else drawRipple3D(rr);
      }
    }

    requestAnimationFrame(render);
  }

  async function tryFullscreen(){
    try{
      if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
      }
    }catch(e){}
  }

  ui.menuBtn.onclick = () => { state.menuOpen = !state.menuOpen; updateUI(); };
  ui.fullscreenBtn.onclick = tryFullscreen;
  ui.modeDetectBtn.onclick = () => { state.mode = "detect"; updateUI(); };
  ui.modeRippleBtn.onclick = () => { state.mode = "ripple"; updateUI(); };
  ui.view2DBtn.onclick = () => { state.view = "2d"; updateUI(); };
  ui.view3DBtn.onclick = () => { state.view = "3d"; updateUI(); };
  ui.toggleDualBtn.onclick = () => { state.dualLandscape = !state.dualLandscape; updateUI(); };

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 150));

  initField();
  resize();
  updateUI();
  connectWS();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
