<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ink Breath — Live Drawing Animation</title>
  <style>
    :root {
      --paper: #f3ead8;
      --ink: #111111;
      --panel: rgba(247, 239, 223, 0.86);
      --line: rgba(30, 24, 18, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #191511;
      font-family: ui-serif, "Apple SD Gothic Neo", "Noto Serif KR", Georgia, serif;
      touch-action: none;
      color: #1b1712;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    .ui {
      position: fixed;
      left: 16px;
      top: 16px;
      width: min(340px, calc(100vw - 32px));
      padding: 14px 14px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.18);
      user-select: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .ui.hidden {
      transform: translateY(calc(-100% - 28px));
      opacity: 0.15;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.72;
    }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr 42px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2a2119;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.72;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(30, 24, 18, 0.2);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.7);
      color: #1b1712;
      padding: 9px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button:active { transform: translateY(1px); }

    .hint {
      position: fixed;
      right: 16px;
      bottom: 14px;
      max-width: min(520px, calc(100vw - 32px));
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(247, 239, 223, 0.72);
      border: 1px solid rgba(30, 24, 18, 0.14);
      backdrop-filter: blur(10px);
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.78;
      user-select: none;
    }

    @media (max-width: 680px) {
      .ui { left: 10px; top: 10px; width: calc(100vw - 20px); }
      .hint { left: 10px; right: 10px; bottom: 10px; }
      .buttons { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <section class="ui" id="ui">
    <h1>Ink Breath</h1>
    <p class="sub">라이브 드로잉을 먹선·번짐·입자 흐름으로 변환해 동양화풍 애니메이션으로 생성합니다.</p>

    <div class="row">
      <label for="brushSize">붓 크기</label>
      <input id="brushSize" type="range" min="4" max="70" value="24" />
      <span class="value" id="brushSizeVal">24</span>
    </div>

    <div class="row">
      <label for="inkPower">먹 농도</label>
      <input id="inkPower" type="range" min="0.1" max="1" step="0.01" value="0.72" />
      <span class="value" id="inkPowerVal">.72</span>
    </div>

    <div class="row">
      <label for="bleedPower">번짐</label>
      <input id="bleedPower" type="range" min="0" max="1" step="0.01" value="0.38" />
      <span class="value" id="bleedPowerVal">.38</span>
    </div>

    <div class="row">
      <label for="windPower">기류</label>
      <input id="windPower" type="range" min="0" max="2" step="0.01" value="0.64" />
      <span class="value" id="windPowerVal">.64</span>
    </div>

    <div class="row">
      <label for="lifePower">생명감</label>
      <input id="lifePower" type="range" min="0.2" max="3" step="0.01" value="1.3" />
      <span class="value" id="lifePowerVal">1.3</span>
    </div>

    <div class="buttons">
      <button id="clearBtn">비우기</button>
      <button id="autoBtn">자동 획</button>
      <button id="saveBtn">저장</button>
      <button id="hideBtn">UI 숨김</button>
    </div>
  </section>

  <div class="hint">마우스/손가락으로 그리면 먹선이 피어나고, 잠시 뒤 입자들이 숨 쉬듯 움직입니다. <b>H</b>: UI / <b>C</b>: 비우기 / <b>A</b>: 자동 획</div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });

    const ui = document.getElementById('ui');
    const controls = {
      brushSize: document.getElementById('brushSize'),
      inkPower: document.getElementById('inkPower'),
      bleedPower: document.getElementById('bleedPower'),
      windPower: document.getElementById('windPower'),
      lifePower: document.getElementById('lifePower'),
    };

    const values = {
      brushSize: document.getElementById('brushSizeVal'),
      inkPower: document.getElementById('inkPowerVal'),
      bleedPower: document.getElementById('bleedPowerVal'),
      windPower: document.getElementById('windPowerVal'),
      lifePower: document.getElementById('lifePowerVal'),
    };

    let W = 0;
    let H = 0;
    let DPR = Math.min(window.devicePixelRatio || 1, 2);
    let particles = [];
    let strokes = [];
    let pointer = { down: false, x: 0, y: 0, px: 0, py: 0, speed: 0 };
    let frame = 0;
    let autoMode = false;
    let autoT = 0;

    function val(name) {
      return parseFloat(controls[name].value);
    }

    function syncLabels() {
      values.brushSize.textContent = Math.round(val('brushSize'));
      values.inkPower.textContent = val('inkPower').toFixed(2).replace('0.', '.');
      values.bleedPower.textContent = val('bleedPower').toFixed(2).replace('0.', '.');
      values.windPower.textContent = val('windPower').toFixed(2).replace('0.', '.');
      values.lifePower.textContent = val('lifePower').toFixed(2);
    }

    Object.values(controls).forEach(input => input.addEventListener('input', syncLabels));
    syncLabels();

    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      W = Math.floor(window.innerWidth);
      H = Math.floor(window.innerHeight);
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      paintPaper();
    }

    function paintPaper() {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#f6ecd7');
      g.addColorStop(0.5, '#efe2c9');
      g.addColorStop(1, '#f8f0df');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      ctx.globalAlpha = 0.13;
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * W;
        const y = Math.random() * H;
        const l = 8 + Math.random() * 42;
        ctx.strokeStyle = Math.random() > 0.5 ? '#9f8c6c' : '#fff8e6';
        ctx.lineWidth = Math.random() * 0.55;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + l, y + Math.random() * 4 - 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function dist(a, b, c, d) {
      return Math.hypot(c - a, d - b);
    }

    function noiseLike(x, y, t) {
      return Math.sin(x * 0.007 + t * 0.013) + Math.cos(y * 0.009 - t * 0.011) + Math.sin((x + y) * 0.004 + t * 0.007);
    }

    function addInkParticle(x, y, power = 1, radius = val('brushSize')) {
      const angle = rand(0, Math.PI * 2);
      const spread = radius * rand(0.08, 0.86);
      const px = x + Math.cos(angle) * spread;
      const py = y + Math.sin(angle) * spread;
      const dark = rand(8, 34);
      const life = rand(180, 760) * val('lifePower');

      particles.push({
        x: px,
        y: py,
        ox: px,
        oy: py,
        vx: Math.cos(angle) * rand(0.02, 0.55) * val('bleedPower'),
        vy: Math.sin(angle) * rand(0.02, 0.55) * val('bleedPower') - rand(0, 0.12),
        r: rand(0.55, radius * 0.16) * power,
        a: rand(0.03, 0.22) * val('inkPower') * power,
        life,
        maxLife: life,
        dark,
        drift: rand(0.2, 1.8),
        kind: Math.random() > 0.82 ? 'fiber' : 'dot'
      });

      if (particles.length > 13000) particles.splice(0, particles.length - 13000);
    }

    function drawBrushSegment(x1, y1, x2, y2, pressure = 1) {
      const d = dist(x1, y1, x2, y2);
      const steps = Math.max(1, Math.ceil(d / 3));
      const brush = val('brushSize');
      const ink = val('inkPower');
      const bleed = val('bleedPower');

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const x = x1 + (x2 - x1) * t;
        const y = y1 + (y2 - y1) * t;
        const n = noiseLike(x, y, frame) * 0.5;
        const size = brush * pressure * rand(0.58, 1.18) * (1 + n * 0.08);

        ctx.globalAlpha = ink * rand(0.12, 0.38);
        ctx.fillStyle = '#080706';
        ctx.beginPath();
        ctx.ellipse(
          x + rand(-size * 0.12, size * 0.12),
          y + rand(-size * 0.12, size * 0.12),
          size * rand(0.18, 0.46),
          size * rand(0.08, 0.28),
          rand(0, Math.PI),
          0,
          Math.PI * 2
        );
        ctx.fill();

        const count = Math.floor(4 + brush * 0.26 + bleed * 16);
        for (let k = 0; k < count; k++) addInkParticle(x, y, pressure * rand(0.55, 1.2), brush);
      }

      ctx.globalAlpha = ink * 0.48;
      ctx.strokeStyle = '#050403';
      ctx.lineWidth = Math.max(1, brush * 0.26 * pressure);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      const mx = (x1 + x2) / 2 + rand(-brush * 0.15, brush * 0.15);
      const my = (y1 + y2) / 2 + rand(-brush * 0.15, brush * 0.15);
      ctx.quadraticCurveTo(mx, my, x2, y2);
      ctx.stroke();

      ctx.restore();

      strokes.push({ x1, y1, x2, y2, age: 0, width: brush * pressure, alpha: ink });
      if (strokes.length > 1200) strokes.shift();
    }

    function getPoint(e) {
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX, y: p.clientY };
    }

    function pointerDown(e) {
      const p = getPoint(e);
      pointer.down = true;
      pointer.x = pointer.px = p.x;
      pointer.y = pointer.py = p.y;
      pointer.speed = 0;
      autoMode = false;
      e.preventDefault();
    }

    function pointerMove(e) {
      const p = getPoint(e);
      if (!pointer.down) return;
      pointer.px = pointer.x;
      pointer.py = pointer.y;
      pointer.x = p.x;
      pointer.y = p.y;
      pointer.speed = dist(pointer.px, pointer.py, pointer.x, pointer.y);
      const pressure = Math.max(0.34, Math.min(1.3, 1.2 - pointer.speed / 80));
      drawBrushSegment(pointer.px, pointer.py, pointer.x, pointer.y, pressure);
      e.preventDefault();
    }

    function pointerUp() {
      pointer.down = false;
    }

    canvas.addEventListener('mousedown', pointerDown);
    canvas.addEventListener('mousemove', pointerMove);
    window.addEventListener('mouseup', pointerUp);
    canvas.addEventListener('touchstart', pointerDown, { passive: false });
    canvas.addEventListener('touchmove', pointerMove, { passive: false });
    window.addEventListener('touchend', pointerUp);

    function animateParticles() {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const lifeRatio = p.life / p.maxLife;
        const flow = noiseLike(p.x, p.y, frame * p.drift);
        const wind = val('windPower');

        p.vx += Math.cos(flow * Math.PI) * 0.006 * wind;
        p.vy += Math.sin(flow * Math.PI) * 0.004 * wind;
        p.vx *= 0.992;
        p.vy *= 0.992;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;

        const alpha = p.a * Math.pow(lifeRatio, 0.56);
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = `rgb(${p.dark}, ${p.dark - 2}, ${Math.max(0, p.dark - 8)})`;

        if (p.kind === 'fiber') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(flow);
          ctx.fillRect(-p.r * 0.15, -p.r * 0.5, p.r * 0.3, p.r * rand(1.5, 4.5));
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, p.r * (1 + (1 - lifeRatio) * val('bleedPower') * 2.8), p.r * rand(0.55, 1.4), flow, 0, Math.PI * 2);
          ctx.fill();
        }

        if (p.life <= 0 || p.x < -100 || p.y < -100 || p.x > W + 100 || p.y > H + 100) {
          particles.splice(i, 1);
        }
      }

      ctx.restore();
    }

    function breatheOldStrokes() {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      for (const s of strokes) {
        s.age++;
        if (s.age % 24 !== 0) continue;
        const x = s.x1 + (s.x2 - s.x1) * Math.random();
        const y = s.y1 + (s.y2 - s.y1) * Math.random();
        const count = Math.floor(val('bleedPower') * 8 + 1);
        for (let i = 0; i < count; i++) addInkParticle(x, y, rand(0.18, 0.52), s.width * rand(0.4, 1.1));
      }
      ctx.restore();
    }

    function paperFade() {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 0.018;
      ctx.fillStyle = '#f3ead8';
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function autoStroke() {
      autoT += 0.012;
      const cx = W * 0.5;
      const cy = H * 0.52;
      const scale = Math.min(W, H) * 0.32;
      const x = cx + Math.sin(autoT * 2.1) * scale * 0.8 + Math.sin(autoT * 5.2) * 40;
      const y = cy + Math.cos(autoT * 1.3) * scale * 0.55 + Math.sin(autoT * 3.4) * 80;
      const px = cx + Math.sin((autoT - 0.018) * 2.1) * scale * 0.8 + Math.sin((autoT - 0.018) * 5.2) * 40;
      const py = cy + Math.cos((autoT - 0.018) * 1.3) * scale * 0.55 + Math.sin((autoT - 0.018) * 3.4) * 80;
      drawBrushSegment(px, py, x, y, 0.55 + Math.sin(autoT * 4) * 0.24);
    }

    function loop() {
      frame++;
      paperFade();
      if (autoMode) autoStroke();
      breatheOldStrokes();
      animateParticles();
      requestAnimationFrame(loop);
    }

    document.getElementById('clearBtn').addEventListener('click', () => {
      particles = [];
      strokes = [];
      paintPaper();
    });

    document.getElementById('autoBtn').addEventListener('click', () => {
      autoMode = !autoMode;
      document.getElementById('autoBtn').textContent = autoMode ? '자동 중지' : '자동 획';
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `ink-breath-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
    });

    document.getElementById('hideBtn').addEventListener('click', () => {
      ui.classList.toggle('hidden');
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'h') ui.classList.toggle('hidden');
      if (key === 'c') {
        particles = [];
        strokes = [];
        paintPaper();
      }
      if (key === 'a') {
        autoMode = !autoMode;
        document.getElementById('autoBtn').textContent = autoMode ? '자동 중지' : '자동 획';
      }
    });

    window.addEventListener('resize', resize);
    resize();
    loop();
  </script>
</body>
</html>
