<!DOCTYPE html>
<html lang="ko">
<head>

<title>OBJECT → SOUND</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: #f5f5f5;

main {

    color: white;

#fileInput {

}

.control label {

}

@media(max-width:600px) {

        font-size: 60px;
    }

    button,

    }

}

</style>

<body>

<main>

<h1>
OBJECT<br>
→ SOUND
</h1>

<div class="subtitle">
The image becomes an ambient instrument.
</div>


<div class="controls">

<div class="buttons">

<div class="file-button">

SELECT VIDEO

<input

>

>
PLAY / GENERATE

<!-- =======================================================

<div class="mixer">

>

<span id="ambientValue">70%</span>
</label>

>

</label>

<input

>

></video>

></canvas>

</div>

<!-- =======================================================
     TELEMETRY
======================================================= -->

<div class="telemetry">

<div>
OBJECTS
<strong id="objectCount">0</strong>
</div>

MOTION
<strong id="motionMeter">0.00</strong>
</div>

AMBIENCE
<strong id="ambienceMeter">0.00</strong>
</div>

DETECTION
<strong id="fpsMeter">0 Hz</strong>
</div>

</div>

AI MODEL: LOADING
</div>

<script>

/* ==========================================================
   DOM
========================================================== */

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const fileInput =
document.getElementById("fileInput");

const playButton =
document.getElementById("playButton");

const stopButton =
document.getElementById("stopButton");

const stage =
document.getElementById("stage");


const statusElement =
document.getElementById("status");

const filenameElement =
document.getElementById("filename");

const objectsDisplay =
document.getElementById("objects");

const modelState =
document.getElementById("modelState");


const videoVolume =
document.getElementById("videoVolume");

const generatedVolume =
document.getElementById("generatedVolume");

const ambientAmount =
document.getElementById("ambientAmount");

const textureAmount =
document.getElementById("textureAmount");

const motionResponse =
document.getElementById("motionResponse");


const videoValue =
document.getElementById("videoValue");

const generatedValue =
document.getElementById("generatedValue");

const ambientValue =
document.getElementById("ambientValue");

const textureValue =
document.getElementById("textureValue");

const motionValue =
document.getElementById("motionValue");


const objectCount =
document.getElementById("objectCount");

const motionMeter =
document.getElementById("motionMeter");

const ambienceMeter =
document.getElementById("ambienceMeter");

const fpsMeter =
document.getElementById("fpsMeter");


/* ==========================================================
   STATE
========================================================== */

let model = null;

let modelReady = false;

let videoReady = false;

let running = false;

let objectURL = null;

let detectionBusy = false;

let previousObjects = {};

let lastDetectionTime = 0;

let detectionCounter = 0;

let detectionFPSStart =
performance.now();


/*
    기존 200ms → 70ms

    최대 약 14 detection/sec.

    실제 속도는 기기 GPU 성능에 따라 달라진다.
*/

const DETECTION_INTERVAL = 70;


/* ==========================================================
   AUDIO STATE
========================================================== */

let audioContext = null;

let masterGain = null;

let ambientGain = null;

let textureGain = null;

let ambientFilter = null;

let ambientPanner = null;

let noiseFilter = null;

let noiseSource = null;

let droneOscillators = [];

let delay = null;

let delayFeedback = null;

let compressor = null;


/* ==========================================================
   SCALE
========================================================== */

/*
   D / A 기반.

   드론이 D를 중심으로 유지되고
   움직임이 harmonic colour를 바꾼다.
*/

const ROOT = 73.42; // D2

const SCALE = [
    0,
    3,
    5,
    7,
    10,
    12,
    15,
    17,
    19,
    22,
    24
];


/* ==========================================================
   UI
========================================================== */

function percent(value) {

    return Math.round(
        value * 100
    ) + "%";

}


videoVolume.oninput = () => {

    video.volume =
        Number(
            videoVolume.value
        );

    videoValue.textContent =
        percent(
            videoVolume.value
        );

};


generatedVolume.oninput = () => {

    generatedValue.textContent =
        percent(
            generatedVolume.value
        );

    if(masterGain) {

        masterGain.gain.setTargetAtTime(

            Number(
                generatedVolume.value
            ),

            audioContext.currentTime,

            .05

        );

    }

};


ambientAmount.oninput = () => {

    ambientValue.textContent =
        percent(
            ambientAmount.value
        );

};


textureAmount.oninput = () => {

    textureValue.textContent =
        percent(
            textureAmount.value
        );

};


motionResponse.oninput = () => {

    motionValue.textContent =

        Math.round(
            motionResponse.value *
            100
        )

        +

        "%";

};


/* ==========================================================
   AI
========================================================== */

async function loadModel() {

    try {

        await tf.setBackend(
            "webgl"
        );

        await tf.ready();


        model =
            await cocoSsd.load({
                base:
                "lite_mobilenet_v2"
            });


        modelReady = true;


        modelState.textContent =
            "AI MODEL: READY";


        statusElement.textContent =
            "AI ready. Select video.";


        updatePlayButton();


    }

    catch(error) {

        console.error(error);


        modelState.textContent =
            "AI MODEL: ERROR";


        statusElement.textContent =
            "AI model failed to load.";

    }

}


loadModel();


/* ==========================================================
   VIDEO
========================================================== */

fileInput.addEventListener(
"change",
event => {

    const file =
        event.target.files[0];


    if(!file) return;


    if(objectURL) {

        URL.revokeObjectURL(
            objectURL
        );

    }


    objectURL =
        URL.createObjectURL(
            file
        );


    filenameElement.textContent =
        file.name;


    stage.style.display =
        "block";


    videoReady = false;


    video.src =
        objectURL;


    video.load();


    statusElement.textContent =
        "Loading video...";


    video.onloadedmetadata =
    () => {

        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        videoReady = true;


        video.volume =
            Number(
                videoVolume.value
            );


        statusElement.textContent =
            modelReady
            ?
            "Ready."
            :
            "Waiting for AI...";


        updatePlayButton();

    };

});


function updatePlayButton() {

    playButton.disabled =
        !(modelReady && videoReady);

}


/* ==========================================================
   AUDIO ENGINE
========================================================== */

function createAudioEngine() {

    if(audioContext) return;


    const AC =
        window.AudioContext ||
        window.webkitAudioContext;


    audioContext =
        new AC();


    /* MASTER */

    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        Number(
            generatedVolume.value
        );


    /* COMPRESSOR */

    compressor =
        audioContext.createDynamicsCompressor();


    compressor.threshold.value =
        -18;

    compressor.knee.value =
        12;

    compressor.ratio.value =
        5;

    compressor.attack.value =
        .01;

    compressor.release.value =
        .4;


    /* DELAY */

    delay =
        audioContext.createDelay(
            3
        );


    delay.delayTime.value =
        .42;


    delayFeedback =
        audioContext.createGain();


    delayFeedback.gain.value =
        .32;


    delay.connect(
        delayFeedback
    );


    delayFeedback.connect(
        delay
    );


    delay.connect(
        compressor
    );


    masterGain.connect(
        compressor
    );


    masterGain.connect(
        delay
    );


    compressor.connect(
        audioContext.destination
    );


    createDrone();

    createNoiseTexture();

}


/* ==========================================================
   AMBIENT DRONE
========================================================== */

function createDrone() {

    ambientGain =
        audioContext.createGain();


    ambientGain.gain.value =
        0;


    ambientFilter =
        audioContext.createBiquadFilter();


    ambientFilter.type =
        "lowpass";


    ambientFilter.frequency.value =
        650;


    ambientFilter.Q.value =
        1.5;


    ambientPanner =
        audioContext.createStereoPanner();


    /*
       D2 / A2 / D3 / F3

       약간씩 detune해서
       완전히 고정된 synth tone처럼
       들리지 않게 한다.
    */

    const frequencies = [

        ROOT,

        ROOT * 1.5,

        ROOT * 2,

        ROOT * 2.378

    ];


    frequencies.forEach(
    (frequency,index) => {

        const oscillator =
            audioContext
            .createOscillator();


        oscillator.type =
            index < 2
            ?
            "sine"
            :
            "triangle";


        oscillator.frequency.value =
            frequency;


        oscillator.detune.value =
            (
                Math.random() *
                8
            )
            -
            4;


        const gain =
            audioContext
            .createGain();


        gain.gain.value =
            index === 0
            ?
            .45
            :
            .12;


        oscillator.connect(
            gain
        );


        gain.connect(
            ambientFilter
        );


        oscillator.start();


        droneOscillators.push({
            oscillator,
            gain
        });

    });


    ambientFilter.connect(
        ambientPanner
    );


    ambientPanner.connect(
        ambientGain
    );


    ambientGain.connect(
        masterGain
    );

}


/* ==========================================================
   ELECTRONIC TEXTURE
========================================================== */

function createNoiseTexture() {

    const length =
        audioContext.sampleRate *
        2;


    const buffer =
        audioContext.createBuffer(

            1,
            length,
            audioContext.sampleRate

        );


    const data =
        buffer.getChannelData(0);


    /*
       완전한 white noise보다
       듬성듬성한 digital texture.
    */

    for(
        let i = 0;
        i < length;
        i++
    ) {

        if(
            Math.random() >
            .91
        ) {

            data[i] =
                (
                    Math.random() *
                    2 -
                    1
                );

        }

        else {

            data[i] =
                0;

        }

    }


    noiseSource =
        audioContext
        .createBufferSource();


    noiseSource.buffer =
        buffer;


    noiseSource.loop =
        true;


    noiseFilter =
        audioContext
        .createBiquadFilter();


    noiseFilter.type =
        "bandpass";


    noiseFilter.frequency.value =
        2400;


    noiseFilter.Q.value =
        5;


    textureGain =
        audioContext
        .createGain();


    textureGain.gain.value =
        0;


    noiseSource.connect(
        noiseFilter
    );


    noiseFilter.connect(
        textureGain
    );


    textureGain.connect(
        masterGain
    );


    textureGain.connect(
        delay
    );


    noiseSource.start();

}


/* ==========================================================
   TING
========================================================== */

function createTing(
    position,
    energy
) {

    if(!audioContext) return;


    const now =
        audioContext.currentTime;


    /*
       화면 위치에 따라
       pentatonic harmonic 선택.
    */

    const index =

        Math.floor(

            position *
            SCALE.length

        )

        %

        SCALE.length;


    const semitone =
        SCALE[index];


    const frequency =

        ROOT *
        4 *
        Math.pow(
            2,
            semitone / 12
        );


    const oscillator =
        audioContext
        .createOscillator();


    oscillator.type =
        "sine";


    oscillator.frequency.value =
        frequency;


    const overtone =
        audioContext
        .createOscillator();


    overtone.type =
        "sine";


    overtone.frequency.value =
        frequency *
        2.01;


    const gain =
        audioContext
        .createGain();


    const pan =
        audioContext
        .createStereoPanner();


    pan.pan.value =
        position * 2 - 1;


    const volume =

        .015 +

        Math.min(
            .06,
            energy * .08
        );


    gain.gain.setValueAtTime(

        volume,
        now

    );


    gain.gain.exponentialRampToValueAtTime(

        .0001,

        now +
        1.8

    );


    oscillator.connect(
        gain
    );


    overtone.connect(
        gain
    );


    gain.connect(
        pan
    );


    pan.connect(
        masterGain
    );


    pan.connect(
        delay
    );


    oscillator.start(now);

    overtone.start(now);


    oscillator.stop(
        now + 2
    );

    overtone.stop(
        now + 2
    );

}


/* ==========================================================
   GLITCH
========================================================== */

function createGlitch(
    position,
    energy
) {

    if(!audioContext) return;


    const now =
        audioContext.currentTime;


    const oscillator =
        audioContext
        .createOscillator();


    oscillator.type =
        "square";


    oscillator.frequency.value =

        180 +

        Math.random() *
        1500;


    const filter =
        audioContext
        .createBiquadFilter();


    filter.type =
        "bandpass";


    filter.frequency.value =

        800 +

        Math.random() *
        5000;


    filter.Q.value =
        8;


    const gain =
        audioContext
        .createGain();


    gain.gain.setValueAtTime(

        Math.min(
            .025,
            .004 +
            energy * .03
        ),

        now

    );


    gain.gain.exponentialRampToValueAtTime(

        .0001,

        now +
        .05 +
        Math.random() *
        .12

    );


    const panner =
        audioContext
        .createStereoPanner();


    panner.pan.value =
        position * 2 - 1;


    oscillator.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        panner
    );


    panner.connect(
        masterGain
    );


    oscillator.start(now);


    oscillator.stop(
        now + .2
    );

}


/* ==========================================================
   OBJECT ANALYSIS
========================================================== */

function analyseObjects(
    predictions
) {

    let totalMotion =
        0;


    let averageX =
        0;


    let totalArea =
        0;


    let strongestMotion =
        0;


    let strongestX =
        .5;


    const newObjects =
        {};


    predictions.forEach(
    (prediction,index) => {

        const [
            x,
            y,
            width,
            height
        ] =
        prediction.bbox;


        const centerX =
            x +
            width / 2;


        const centerY =
            y +
            height / 2;


        const nx =
            centerX /
            video.videoWidth;


        const ny =
            centerY /
            video.videoHeight;


        const area =

            (
                width *
                height
            )

            /

            (
                video.videoWidth *
                video.videoHeight
            );


        const key =

            prediction.class
            +
            "_"
            +
            index;


        let motion =
            0;


        if(
            previousObjects[key]
        ) {

            const old =
                previousObjects[key];


            const dx =
                centerX -
                old.x;


            const dy =
                centerY -
                old.y;


            motion =

                Math.sqrt(
                    dx * dx +
                    dy * dy
                )

                /

                Math.max(
                    video.videoWidth,
                    video.videoHeight
                );

        }


        motion *=

            Number(
                motionResponse.value
            );


        motion =
            Math.min(
                1,
                motion * 12
            );


        newObjects[key] = {

            x: centerX,
            y: centerY

        };


        totalMotion +=
            motion;


        averageX +=
            nx;


        totalArea +=
            area;


        if(
            motion >
            strongestMotion
        ) {

            strongestMotion =
                motion;


            strongestX =
                nx;

        }

    });


    previousObjects =
        newObjects;


    const count =
        Math.max(
            1,
            predictions.length
        );


    const avgMotion =
        totalMotion /
        count;


    const avgX =
        predictions.length
        ?
        averageX /
        predictions.length
        :
        .5;


    return {

        motion:
            avgMotion,

        strongestMotion,

        strongestX,

        averageX:
            avgX,

        area:
            totalArea,

        count:
            predictions.length

    };

}


/* ==========================================================
   UPDATE AMBIENT MUSIC
========================================================== */

function updateAmbient(
    analysis
) {

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    const ambient =
        Number(
            ambientAmount.value
        );


    const texture =
        Number(
            textureAmount.value
        );


    /*
       기본 drone은 항상 존재.
       객체가 많아지면 약간 커짐.
    */

    const droneLevel =

        .055 *

        ambient *

        (
            .65 +
            Math.min(
                .7,
                analysis.count *
                .08
            )
        );


    ambientGain.gain
        .setTargetAtTime(

            droneLevel,

            now,

            .35

        );


    /*
       움직임 → filter opening.
    */

    const cutoff =

        350 +

        analysis.motion *
        6000 +

        analysis.area *
        1500;


    ambientFilter.frequency
        .setTargetAtTime(

            cutoff,

            now,

            .12

        );


    /*
       객체 평균 위치에 따라
       ambient 공간 위치도 이동.
    */

    ambientPanner.pan
        .setTargetAtTime(

            analysis.averageX *
            1.4 -
            .7,

            now,

            .25

        );


    /*
       움직임 → digital noise.
    */

    const noiseLevel =

        texture *

        (
            .001 +

            analysis.motion *
            .035
        );


    textureGain.gain
        .setTargetAtTime(

            noiseLevel,

            now,

            .05

        );


    /*
       움직임에 따라
       noise 중심 주파수 변화.
    */

    noiseFilter.frequency
        .setTargetAtTime(

            1200 +

            analysis.motion *
            6000,

            now,

            .08

        );


    /*
       Drone harmonic도 아주 미세하게 흔들림.
    */

    droneOscillators.forEach(
    (voice,index) => {

        const detune =

            (
                analysis.motion *
                12
            )

            *

            (
                index % 2
                ?
                1
                :
                -1
            );


        voice.oscillator.detune
            .setTargetAtTime(

                detune,

                now,

                .3

            );

    });


    /*
       큰 움직임 → TING

       매번 발생하면 시끄러우므로
       확률적으로 발생.
    */

    if(
        analysis.strongestMotion >
        .22
        &&
        Math.random() <
        .30
    ) {

        createTing(

            analysis.strongestX,

            analysis.strongestMotion

        );

    }


    /*
       조금 더 강한 움직임 →
       digital glitch.
    */

    if(
        analysis.strongestMotion >
        .38
        &&
        Math.random() <
        .22
    ) {

        createGlitch(

            analysis.strongestX,

            analysis.strongestMotion

        );

    }


    motionMeter.textContent =

        analysis.motion
        .toFixed(2);


    ambienceMeter.textContent =

        cutoff
        .toFixed(0)
        +
        "Hz";

}


/* ==========================================================
   DRAW BOXES
========================================================== */

function drawPredictions(
    predictions
) {

    ctx.clearRect(

        0,
        0,

        canvas.width,
        canvas.height

    );


    ctx.lineWidth =
        Math.max(
            2,
            canvas.width /
            550
        );


    const fontSize =
        Math.max(
            12,
            canvas.width /
            70
        );


    ctx.font =
        fontSize +
        "px monospace";


    predictions.forEach(
    prediction => {

        const [
            x,
            y,
            width,
            height
        ] =
        prediction.bbox;


        /*
           BOX
        */

        ctx.strokeStyle =
            "rgba(255,255,255,.95)";


        ctx.strokeRect(

            x,
            y,
            width,
            height

        );


        /*
           작은 중심점
        */

        ctx.fillStyle =
            "white";


        ctx.beginPath();


        ctx.arc(

            x +
            width / 2,

            y +
            height / 2,

            3,

            0,

            Math.PI * 2

        );


        ctx.fill();


        /*
           LABEL
        */

        const label =

            prediction.class
            +
            " "
            +
            Math.round(
                prediction.score *
                100
            )
            +
            "%";


        const textWidth =
            ctx.measureText(
                label
            ).width;


        const labelHeight =
            fontSize +
            8;


        const labelY =
            Math.max(
                labelHeight,
                y
            );


        ctx.fillStyle =
            "rgba(0,0,0,.75)";


        ctx.fillRect(

            x,

            labelY -
            labelHeight,

            textWidth +
            10,

            labelHeight

        );


        ctx.fillStyle =
            "white";


        ctx.fillText(

            label,

            x + 5,

            labelY - 5

        );

    });

}


/* ==========================================================
   DETECTION LOOP
========================================================== */

async function detectionLoop(
    timestamp
) {

    if(!running)
        return;


    if(
        video.paused ||
        video.ended
    )
        return;


    if(

        !detectionBusy

        &&

        timestamp -
        lastDetectionTime

        >=

        DETECTION_INTERVAL

    ) {

        detectionBusy =
            true;


        lastDetectionTime =
            timestamp;


        try {

            let predictions =

                await model.detect(
                    video
                );


            predictions =

                predictions

                .filter(
                    prediction =>
                    prediction.score >
                    .38
                )

                .sort(
                    (a,b) =>

                    (
                        b.bbox[2] *
                        b.bbox[3]
                    )

                    -

                    (
                        a.bbox[2] *
                        a.bbox[3]
                    )
                )

                .slice(
                    0,
                    8
                );


            drawPredictions(
                predictions
            );


            const analysis =
                analyseObjects(
                    predictions
                );


            updateAmbient(
                analysis
            );


            objectCount.textContent =
                predictions.length;


            objectsDisplay.textContent =

                predictions.length

                ?

                predictions
                .map(
                    p =>

                    p.class
                    +
                    " "
                    +
                    Math.round(
                        p.score *
                        100
                    )
                    +
                    "%"

                )
                .join(
                    " · "
                )

                :

                "NO OBJECTS";


            /*
               실제 Detection Hz 표시.
            */

            detectionCounter++;


            const now =
                performance.now();


            if(
                now -
                detectionFPSStart
                >
                1000
            ) {

                fpsMeter.textContent =

                    detectionCounter
                    +
                    " Hz";


                detectionCounter =
                    0;


                detectionFPSStart =
                    now;

            }

        }

        catch(error) {

            console.error(
                error
            );

        }


        detectionBusy =
            false;

    }


    requestAnimationFrame(
        detectionLoop
    );

}


/* ==========================================================
   PLAY
========================================================== */

playButton.addEventListener(
"click",
async () => {

    if(
        !modelReady ||
        !videoReady
    )
        return;


    createAudioEngine();


    if(
        audioContext.state
        ===
        "suspended"
    ) {

        await audioContext.resume();

    }


    video.volume =
        Number(
            videoVolume.value
        );


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    previousObjects =
        {};


    lastDetectionTime =
        0;


    detectionCounter =
        0;


    detectionFPSStart =
        performance.now();


    video.currentTime =
        0;


    try {

        await video.play();

    }

    catch(error) {

        console.error(error);

        statusElement.textContent =
            "Playback failed.";

        return;

    }


    running =
        true;


    playButton.disabled =
        true;


    stopButton.disabled =
        false;


    statusElement.textContent =
        "LISTENING TO THE IMAGE";


    requestAnimationFrame(
        detectionLoop
    );

});


/* ==========================================================
   STOP
========================================================== */

function stopEverything() {

    running =
        false;


    video.pause();


    if(
        audioContext
        &&
        ambientGain
    ) {

        ambientGain.gain
        .setTargetAtTime(

            0,

            audioContext.currentTime,

            .15

        );


        textureGain.gain
        .setTargetAtTime(

            0,

            audioContext.currentTime,

            .1

        );

    }


    stopButton.disabled =
        true;


    updatePlayButton();


    statusElement.textContent =
        "Stopped.";

}


stopButton.onclick =
    stopEverything;


/* ==========================================================
   VIDEO END
========================================================== */

video.addEventListener(
"ended",
() => {

    running =
        false;


    if(
        audioContext
        &&
        ambientGain
    ) {

        ambientGain.gain
        .setTargetAtTime(

            0,

            audioContext.currentTime,

            .3

        );


        textureGain.gain
        .setTargetAtTime(

            0,

            audioContext.currentTime,

            .2

        );

    }


    stopButton.disabled =
        true;


    updatePlayButton();


    statusElement.textContent =
        "Finished.";

});


/* ==========================================================
   CLEANUP
========================================================== */

window.addEventListener(
"beforeunload",
() => {

    if(objectURL) {

        URL.revokeObjectURL(
            objectURL
        );

    }

});

</script>
