<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VDO Screen PUSH — CULTUREHUB</title>
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Courier New,monospace;overflow:hidden}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px}
  button{border:1px solid #fff;background:transparent;color:#fff;padding:.7em 1.1em;text-transform:uppercase;cursor:pointer}
  .small{opacity:.8;font-size:12px;line-height:1.5;max-width:900px;word-break:break-all}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
  .topbar{position:fixed;left:12px;top:12px;right:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;pointer-events:none}
  .pill{pointer-events:none;border:1px solid rgba(255,255,255,.6);padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.35);font-size:12px;opacity:.95}
  .danger{border-color:rgba(255,80,80,.8)}
</style>
</head>
<body>

<div class="topbar">
  <div class="pill" id="statusPill">READY</div>
  <div class="pill danger" id="roomPill">PUSH: CULTUREHUB</div>
</div>

<div class="wrap" id="ui">
  <div style="font-size:18px;letter-spacing:.08em;font-weight:700">SCREEN STREAM (PUSH)</div>

  <button id="startBtn">START SCREEN SHARE</button>
  <button id="stopBtn" style="display:none">STOP</button>

  <div class="small" id="info">
    이 페이지는 <b>화면 공유</b>를 VDO.Ninja로 송출합니다.<br>
    송출 키: <b>CULTUREHUB</b><br><br>
    <b>받는 쪽(view) 주소</b><br>
    https://vdo.ninja/?view=CULTUREHUB
  </div>

  <div class="small" style="opacity:.65">
    ⚠️ iOS Safari는 화면공유(getDisplayMedia)가 제한될 수 있어요.<br>
    맥/윈도 크롬(또는 엣지)에서 테스트하는 걸 추천.
  </div>
</div>

<video id="preview" autoplay muted playsinline></video>

<script>
(() => {
  // ✅ 여기만 바꾸면 송출 키 바뀜
  const ROOM_ID = "CULTUREHUB";

  // VDO.Ninja PUSH URL (screen capture를 우리가 붙여서 "push"로 송출)
  const VDO_PUSH = `https://vdo.ninja/?push=${encodeURIComponent(ROOM_ID)}&clean&autostart&noaudio&codec=vp8`;

  const ui = document.getElementById('ui');
  const preview = document.getElementById('preview');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const statusPill = document.getElementById('statusPill');

  let screenStream = null;
  let vdoFrame = null;

  function setStatus(txt){
    statusPill.textContent = txt;
  }

  async function start(){
    try{
      setStatus("REQUESTING SCREEN…");
      // 화면 공유 스트림
      screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 30, max: 30 } },
        audio: false
      });

      // 로컬 미리보기
      preview.srcObject = screenStream;
      preview.style.display = 'block';
      ui.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      setStatus("STREAMING…");

      // VDO.Ninja iFrame 생성 (우리 화면 스트림을 VDO로 푸시)
      vdoFrame = document.createElement('iframe');
      vdoFrame.allow = "autoplay; microphone; camera; display-capture; fullscreen";
      vdoFrame.referrerPolicy = "no-referrer";
      vdoFrame.style.position = "fixed";
      vdoFrame.style.inset = "0";
      vdoFrame.style.width = "1px";
      vdoFrame.style.height = "1px";
      vdoFrame.style.opacity = "0.001";
      vdoFrame.style.pointerEvents = "none";
      vdoFrame.src = VDO_PUSH;
      document.body.appendChild(vdoFrame);

      // 트랙 종료 시 자동 stop
      const [track] = screenStream.getVideoTracks();
      if(track){
        track.onended = () => stop();
      }

      // VDO iframe 로딩 후: postMessage로 화면 스트림을 전달 시도
      // (VDO.Ninja는 iframe 내부에서 getUserMedia를 쓰는데, 여기서는 "가시적인" 화면 공유를 유지하면서
      //  안정적으로 같은 키로 송출되는지만 확인하는 목적이 큼)
      //
      // 만약 이 방식이 환경에 따라 제한되면, 아래 "더 확실한 방식"을 써야 해:
      // → 그냥 브라우저에서 VDO_PUSH 주소를 직접 열고(한 페이지), 거기서 화면 공유 선택하는 방식.
      //
      // 여기서는 최소 구성으로: VDO 프레임은 백그라운드로 유지, 화면 공유는 이 페이지가 유지.
    }catch(e){
      console.error(e);
      setStatus("FAILED");
      alert("화면 공유 시작 실패: 브라우저/권한을 확인해줘.\n(특히 iOS Safari는 화면 공유가 제한될 수 있어)");
    }
