<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBJECT → SOUND</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>

<!-- COCO SSD Object Detection -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
}

main {
    width: min(1100px, 94vw);
    margin: 0 auto;
    padding: 60px 0 100px;
}

h1 {
    font-size: clamp(42px, 8vw, 100px);
    line-height: 0.9;
    margin: 0 0 18px;
    letter-spacing: -0.06em;
}

.subtitle {
    color: #888;
    margin-bottom: 45px;
}

.panel {
    border-top: 1px solid #333;
    padding-top: 24px;
}

.upload {
    display: inline-block;
    border: 1px solid #777;
    padding: 13px 20px;
    cursor: pointer;
    margin-right: 8px;
}

.upload:hover,
button:hover {
    background: white;
    color: black;
}

input[type=file] {
    display: none;
}

button {
    border: 1px solid #777;
    background: transparent;
    color: white;
    padding: 13px 20px;
    cursor: pointer;
    font-size: 14px;
}

button:disabled {
    opacity: .3;
    cursor: default;
}

#status {
    margin: 20px 0;
    color: #999;
    min-height: 24px;
}

.stage {
    position: relative;
    width: 100%;
    background: #111;
    display: none;
}

video {
    display: block;
    width: 100%;
    height: auto;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.info {
    margin-top: 20px;
    display: flex;
    gap: 30px;
    color: #777;
    font-size: 12px;
}

#objects {
    margin-top: 20px;
    font-family: monospace;
    color: #aaa;
    min-height: 50px;
}
</style>
</head>

<body>

<main>

    <h1>OBJECT<br>→ SOUND</h1>

    <div class="subtitle">
        Objects in the image become sound.
    </div>

    <div class="panel">

        <label class="upload">
            SELECT VIDEO
            <input
                id="fileInput"
                type="file"
                accept="video/*"
            >
        </label>

        <button id="playButton" disabled>
            PLAY / GENERATE
        </button>

        <button id="stopButton" disabled>
            STOP
        </button>

        <div id="status">
            Loading object detection model...
        </div>

        <div class="stage" id="stage">

            <video
                id="video"
                playsinline
                crossorigin="anonymous"
            ></video>

            <canvas id="canvas"></canvas>

        </div>

        <div id="objects"></div>

        <div class="info">
            <span>X → PAN</span>
            <span>Y → PITCH</span>
            <span>SIZE → VOLUME</span>
            <span>MOTION → TIMBRE</span>
        </div>

    </div>

</main>

<script>

/* ==========================================================
   ELEMENTS
========================================================== */

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const fileInput = document.getElementById("fileInput");

const playButton =
    document.getElementById("playButton");

const stopButton =
    document.getElementById("stopButton");

const status =
    document.getElementById("status");

const stage =
    document.getElementById("stage");

const objectsDisplay =
    document.getElementById("objects");


/* ==========================================================
   GLOBAL
========================================================== */

let model = null;

let audioContext = null;

let masterGain = null;
let delay = null;
let delayFeedback = null;

let running = false;

let previousObjects = {};

let lastDetection = 0;

const DETECTION_INTERVAL = 180;


/* ==========================================================
   MUSICAL SCALE
   D minor pentatonic-ish
========================================================== */

const SCALE = [

    38, 41, 43, 45, 48,
    50, 53, 55, 57, 60,
    62, 65, 67, 69, 72,
    74, 77, 79

];


function midiToFrequency(midi) {

    return 440 *
        Math.pow(
            2,
            (midi - 69) / 12
        );

}


/* ==========================================================
   LOAD MODEL
========================================================== */

async function loadModel() {

    try {

        status.textContent =
            "Loading object detection model...";

        model = await cocoSsd.load({
            base: "lite_mobilenet_v2"
        });

        status.textContent =
            "Ready. Select a video.";

    }

    catch (error) {

        console.error(error);

        status.textContent =
            "Model loading failed.";

    }

}

loadModel();


/* ==========================================================
   VIDEO UPLOAD
========================================================== */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];

        if (!file)
            return;

        const url =
            URL.createObjectURL(file);

        video.src = url;

        video.load();

        stage.style.display =
            "block";

        playButton.disabled =
            false;

        status.textContent =
            file.name;

    }
);


/* ==========================================================
   AUDIO ENGINE
========================================================== */

function createAudioEngine() {

    if (audioContext)
        return;

    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    /* MASTER */

    masterGain =
        audioContext.createGain();

    masterGain.gain.value =
        0.45;


    /* DELAY */

    delay =
        audioContext.createDelay(2);

    delay.delayTime.value =
        0.32;


    delayFeedback =
        audioContext.createGain();

    delayFeedback.gain.value =
        0.27;


    delay.connect(
        delayFeedback
    );

    delayFeedback.connect(
        delay
    );


    masterGain.connect(
        audioContext.destination
    );

    masterGain.connect(
        delay
    );

    delay.connect(
        audioContext.destination
    );

}


/* ==========================================================
   PLAY NOTE
========================================================== */

function playNote({

    frequency,
    volume,
    pan,
    movement,
    duration

}) {

    if (!audioContext)
        return;


    const now =
        audioContext.currentTime;


    /* OSC 1 */

    const osc1 =
        audioContext.createOscillator();

    osc1.type =
        "sine";

    osc1.frequency.value =
        frequency;


    /* OSC 2 */

    const osc2 =
        audioContext.createOscillator();

    osc2.type =
        "triangle";

    osc2.frequency.value =
        frequency * 1.5;


    /* FILTER */

    const filter =
        audioContext.createBiquadFilter();

    filter.type =
        "lowpass";

    filter.frequency.value =
        700 +
        movement * 9000;


    /* GAIN */

    const gain =
        audioContext.createGain();

    gain.gain.setValueAtTime(
        0,
        now
    );

    gain.gain.linearRampToValueAtTime(
        volume,
        now + 0.04
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + duration
    );


    /* PAN */

    const panner =
        audioContext.createStereoPanner();

    panner.pan.value =
        Math.max(
            -1,
            Math.min(1, pan)
        );


    /* CONNECTION */

    osc1.connect(filter);
    osc2.connect(filter);

    filter.connect(gain);

    gain.connect(panner);

    panner.connect(
        masterGain
    );


    /* START */

    osc1.start(now);
    osc2.start(now);

    osc1.stop(
        now + duration + 0.1
    );

    osc2.stop(
        now + duration + 0.1
    );

}


/* ==========================================================
   CLASS HASH

   Different object classes receive slightly different
   musical offsets.
========================================================== */

function classHash(name) {

    let hash = 0;

    for (
        let i = 0;
        i < name.length;
        i++
    ) {

        hash +=
            name.charCodeAt(i);

    }

    return hash;

}


/* ==========================================================
   SOUND FROM OBJECT
========================================================== */

function objectToSound(
    prediction,
    index
) {

    const [
        x,
        y,
        width,
        height
    ] = prediction.bbox;


    const cx =
        x + width / 2;

    const cy =
        y + height / 2;


    const xNorm =
        cx / video.videoWidth;

    const yNorm =
        cy / video.videoHeight;


    const area =
        (
            width *
            height
        )
        /
        (
            video.videoWidth *
            video.videoHeight
        );


    /* -----------------------------------------
       POSITION → PITCH
    ----------------------------------------- */

    let scaleIndex =
        Math.floor(
            (1 - yNorm) *
            (SCALE.length - 1)
        );

    scaleIndex =
        Math.max(
            0,
            Math.min(
                SCALE.length - 1,
                scaleIndex
            )
        );


    let midi =
        SCALE[scaleIndex];


    /* object class variation */

    midi +=
        classHash(
            prediction.class
        ) % 5;


    const frequency =
        midiToFrequency(midi);


    /* -----------------------------------------
       X → STEREO PAN
    ----------------------------------------- */

    const pan =
        xNorm * 2 - 1;


    /* -----------------------------------------
       SIZE → VOLUME
    ----------------------------------------- */

    const volume =
        Math.min(
            0.16,
            0.025 +
            area * 0.5
        );


    /* -----------------------------------------
       MOTION
    ----------------------------------------- */

    const key =
        prediction.class +
        "_" +
        index;


    let movement = 0;


    if (previousObjects[key]) {

        const previous =
            previousObjects[key];

        const dx =
            cx - previous.x;

        const dy =
            cy - previous.y;

        movement =
            Math.sqrt(
                dx * dx +
                dy * dy
            )
            /
            Math.max(
                video.videoWidth,
                video.videoHeight
            );

    }


    previousObjects[key] = {
        x: cx,
        y: cy
    };


    movement =
        Math.min(
            1,
            movement * 15
        );


    /* -----------------------------------------
       NOTE LENGTH
    ----------------------------------------- */

    const duration =
        0.35 +
        Math.min(
            1.8,
            area * 6
        );


    playNote({

        frequency,
        volume,
        pan,
        movement,
        duration

    });

}


/* ==========================================================
   DRAW DETECTIONS
========================================================== */

function drawPredictions(
    predictions
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.lineWidth = 2;

    ctx.font =
        "14px monospace";


    predictions.forEach(
        prediction => {

            const [
                x,
                y,
                width,
                height
            ] = prediction.bbox;


            /* BOX */

            ctx.strokeStyle =
                "rgba(255,255,255,.9)";

            ctx.strokeRect(
                x,
                y,
                width,
                height
            );


            /* LABEL */

            const label =
                prediction.class +
                " " +
                prediction.score
                    .toFixed(2);


            const metrics =
                ctx.measureText(label);


            ctx.fillStyle =
                "rgba(0,0,0,.75)";

            ctx.fillRect(
                x,
                Math.max(
                    0,
                    y - 22
                ),
                metrics.width + 10,
                22
            );


            ctx.fillStyle =
                "white";

            ctx.fillText(
                label,
                x + 5,
                Math.max(
                    15,
                    y - 6
                )
            );

        }
    );

}


/* ==========================================================
   DETECTION LOOP
========================================================== */

async function detectionLoop(
    timestamp
) {

    if (!running)
        return;


    if (
        video.paused ||
        video.ended
    ) {

        running = false;

        return;

    }


    if (
        timestamp -
        lastDetection
        >
        DETECTION_INTERVAL
    ) {

        lastDetection =
            timestamp;


        try {

            let predictions =
                await model.detect(
                    video
                );


            predictions =
                predictions
                    .filter(
                        p =>
                            p.score >
                            0.45
                    )
                    .sort(
                        (a, b) => {

                            const areaA =
                                a.bbox[2] *
                                a.bbox[3];

                            const areaB =
                                b.bbox[2] *
                                b.bbox[3];

                            return (
                                areaB -
                                areaA
                            );

                        }
                    )
                    .slice(
                        0,
                        6
                    );


            drawPredictions(
                predictions
            );


            objectsDisplay.innerHTML =
                predictions.length
                ?
                predictions
                    .map(
                        p =>
                            p.class
                            +
                            " "
                            +
                            Math.round(
                                p.score *
                                100
                            )
                            +
                            "%"
                    )
                    .join(
                        " · "
                    )
                :
                "No objects";


            predictions.forEach(
                (
                    prediction,
                    index
                ) => {

                    objectToSound(
                        prediction,
                        index
                    );

                }
            );


        }

        catch (error) {

            console.error(
                error
            );

        }

    }


    requestAnimationFrame(
        detectionLoop
    );

}


/* ==========================================================
   START
========================================================== */

playButton.addEventListener(
    "click",
    async () => {

        if (!model) {

            status.textContent =
                "Model is still loading.";

            return;

        }


        createAudioEngine();


        if (
            audioContext.state
            ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        previousObjects = {};

        lastDetection = 0;


        video.currentTime = 0;


        await video.play();


        running = true;


        playButton.disabled =
            true;

        stopButton.disabled =
            false;


        status.textContent =
            "Detecting objects → generating sound";


        requestAnimationFrame(
            detectionLoop
        );

    }
);


/* ==========================================================
   STOP
========================================================== */

function stopEverything() {

    running = false;

    video.pause();


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    playButton.disabled =
        false;

    stopButton.disabled =
        true;


    status.textContent =
        "Stopped.";

}


stopButton.addEventListener(
    "click",
    stopEverything
);


video.addEventListener(
    "ended",
    () => {

        running = false;

        playButton.disabled =
            false;

        stopButton.disabled =
            true;

        status.textContent =
            "Finished.";

    }
);

</script>

</body>
</html>
