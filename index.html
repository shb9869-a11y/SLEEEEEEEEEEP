<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>인기척 - 움직임을 진동 주파수로</title>

  <meta name="theme-color" content="#000000" />
  <style>
    :root{
      --bg:#000;
      --panel:rgba(10,10,10,0.92);
      --panelBorder:rgba(255,255,255,0.12);
      --text:#f3f3f3;
      --muted:#aaaaaa;
      --blue:#173BFF;
      --blueLine:rgba(23,59,255,0.98);
      --blueFill:rgba(23,59,255,0.14);
    }

    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body{
      margin:0; width:100%; height:100%; overflow:hidden;
      background:#000; color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Segoe UI",sans-serif;
    }
    body{
      background:
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255,255,255,0.03) 1px, transparent 1px),
        #000;
      background-size:44px 44px, 44px 44px, auto;
    }

    #app{ position:relative; width:100vw; height:100vh; overflow:hidden; }
    video{ display:none; }
    canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }

    .topbar{
      position:absolute; top:calc(env(safe-area-inset-top, 0px) + 10px); left:10px; right:10px;
      z-index:50; display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .group{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

    .btn,.chip{
      min-height:44px; border-radius:12px; border:1px solid var(--panelBorder);
      background:rgba(8,8,8,0.92); color:#fff; backdrop-filter:blur(10px);
    }
    .btn{
      padding:0 14px; cursor:pointer; font-size:14px; font-weight:600;
    }
    .btn.active{
      background:#fff; color:#000; border-color:#fff;
    }
    .chip{
      display:flex; align-items:center; padding:0 12px; font-size:13px;
    }

    .panel{
      position:absolute; left:10px; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
      z-index:40; width:min(420px, calc(100vw - 20px));
      border:1px solid var(--panelBorder); border-radius:16px;
      background:var(--panel); backdrop-filter:blur(12px); padding:14px;
    }

    .title{ font-size:18px; font-weight:700; margin-bottom:6px; }
    .desc{ font-size:12px; color:var(--muted); line-height:1.5; margin-bottom:12px; }

    .row{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .row:last-child{ margin-bottom:0; }

    .sliderWrap{
      display:grid; grid-template-columns:86px 1fr 56px; gap:10px;
      align-items:center; margin-bottom:10px; font-size:12px; color:var(--muted);
    }
    .sliderWrap:last-child{ margin-bottom:0; }

    input[type="range"]{
      width:100%; appearance:none; height:6px; border-radius:999px; background:#2a2a2a; outline:none;
    }
    input[type="range"]::-webkit-slider-thumb{
      appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:none;
    }

    .status{
      position:absolute; right:10px; bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
      z-index:40; width:min(420px, calc(100vw - 20px));
      border:1px solid var(--panelBorder); border-radius:16px;
      background:rgba(8,8,8,0.86); backdrop-filter:blur(10px);
      padding:12px 14px; font-size:12px; line-height:1.55; color:var(--muted);
    }
    .status strong{ color:#fff; }

    @media (max-width: 900px){
      .status{ display:none; }
    }
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="group">
      <div id="modeChip" class="chip">움직임 → 진동 주파수</div>
    </div>
    <div class="group">
      <button id="cameraBtn" class="btn">카메라 시작</button>
      <button id="audioBtn" class="btn">오디오 시작</button>
      <button id="mockBtn" class="btn">Mock</button>
      <button id="resetBtn" class="btn">리셋</button>
      <button id="fsBtn" class="btn">전체화면</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>
  <video id="video" playsinline autoplay muted></video>

  <div class="panel">
    <div class="title">인기척: 움직임을 진동 주파수로</div>
    <div class="desc">
      사람의 움직임이 커질수록 출력 주파수가 올라갑니다.
      현재 버전은 전체 사람의 움직임을 하나의 대표값으로 모아, 하나의 소리로 출력합니다.
    </div>

    <div class="sliderWrap">
      <span>신뢰도</span>
      <input id="thresholdRange" type="range" min="0.30" max="0.85" step="0.01" value="0.46">
      <span id="thresholdVal">0.46</span>
    </div>

    <div class="sliderWrap">
      <span>움직임문턱</span>
      <input id="motionRange" type="range" min="0.002" max="0.08" step="0.001" value="0.018">
      <span id="motionVal">0.018</span>
    </div>

    <div class="sliderWrap">
      <span>트래킹</span>
      <input id="smoothRange" type="range" min="0.08" max="0.45" step="0.01" value="0.18">
      <span id="smoothVal">0.18</span>
    </div>

    <div class="sliderWrap">
      <span>최저 Hz</span>
      <input id="minFreqRange" type="range" min="20" max="120" step="1" value="40">
      <span id="minFreqVal">40</span>
    </div>

    <div class="sliderWrap">
      <span>최고 Hz</span>
      <input id="maxFreqRange" type="range" min="80" max="400" step="1" value="180">
      <span id="maxFreqVal">180</span>
    </div>

    <div class="sliderWrap">
      <span>볼륨</span>
      <input id="gainRange" type="range" min="0" max="0.4" step="0.005" value="0.08">
      <span id="gainVal">0.08</span>
    </div>

    <div class="sliderWrap">
      <span>오디오반응</span>
      <input id="audioSmoothRange" type="range" min="0.02" max="0.35" step="0.01" value="0.12">
      <span id="audioSmoothVal">0.12</span>
    </div>
  </div>

  <div class="status">
    <strong>시스템 정보</strong><br>
    <span id="statusText">로딩중...</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script>
(() => {
  const BLUE = "#173BFF";
  const BLUE_LINE = "rgba(23,59,255,0.98)";
  const BLUE_FILL = "rgba(23,59,255,0.14)";

  const state = {
    model: null,
    modelReady: false,
    detecting: false,

    cameraOn: false,
    usingMock: true,

    detectThreshold: 0.46,
    motionThreshold: 0.018,
    trackingSmoothness: 0.18,

    minFreq: 40,
    maxFreq: 180,
    gain: 0.08,
    audioSmooth: 0.12,

    currentFreq: 40,
    targetFreq: 40,
    currentMotionEnergy: 0,

    tracks: [],
    nextTrackId: 1,
    detections: [],
    mockPeople: [],

    lastDetectRun: 0,
    detectIntervalMs: 140,

    lastFrameTime: performance.now(),
    fps: 0,

    audioCtx: null,
    oscillator: null,
    gainNode: null,
    audioStarted: false
  };

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d", { alpha: false });
  const video = document.getElementById("video");

  const ui = {
    cameraBtn: document.getElementById("cameraBtn"),
    audioBtn: document.getElementById("audioBtn"),
    mockBtn: document.getElementById("mockBtn"),
    resetBtn: document.getElementById("resetBtn"),
    fsBtn: document.getElementById("fsBtn"),
    modeChip: document.getElementById("modeChip"),
    statusText: document.getElementById("statusText"),

    thresholdRange: document.getElementById("thresholdRange"),
    motionRange: document.getElementById("motionRange"),
    smoothRange: document.getElementById("smoothRange"),
    minFreqRange: document.getElementById("minFreqRange"),
    maxFreqRange: document.getElementById("maxFreqRange"),
    gainRange: document.getElementById("gainRange"),
    audioSmoothRange: document.getElementById("audioSmoothRange"),

    thresholdVal: document.getElementById("thresholdVal"),
    motionVal: document.getElementById("motionVal"),
    smoothVal: document.getElementById("smoothVal"),
    minFreqVal: document.getElementById("minFreqVal"),
    maxFreqVal: document.getElementById("maxFreqVal"),
    gainVal: document.getElementById("gainVal"),
    audioSmoothVal: document.getElementById("audioSmoothVal")
  };

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function resizeCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.floor(window.innerWidth);
    const h = Math.floor(window.innerHeight);
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function updateUI() {
    ui.cameraBtn.textContent = state.cameraOn ? "카메라 끄기" : "카메라 시작";
    ui.audioBtn.textContent = state.audioStarted ? "오디오 켜짐" : "오디오 시작";
    ui.audioBtn.classList.toggle("active", state.audioStarted);

    ui.thresholdVal.textContent = state.detectThreshold.toFixed(2);
    ui.motionVal.textContent = state.motionThreshold.toFixed(3);
    ui.smoothVal.textContent = state.trackingSmoothness.toFixed(2);
    ui.minFreqVal.textContent = Math.round(state.minFreq);
    ui.maxFreqVal.textContent = Math.round(state.maxFreq);
    ui.gainVal.textContent = state.gain.toFixed(3);
    ui.audioSmoothVal.textContent = state.audioSmooth.toFixed(2);

    const confirmed = state.tracks.filter(t => t.confirmed);
    const moving = confirmed.filter(t => (t.motion || 0) >= state.motionThreshold).length;

    ui.statusText.textContent =
      `모델 ${state.modelReady ? "준비" : "로딩중"} / ` +
      `카메라 ${state.cameraOn ? "켜짐" : "꺼짐"} / ` +
      `오디오 ${state.audioStarted ? "켜짐" : "꺼짐"} / ` +
      `사람 ${confirmed.length}명 / ` +
      `움직임 사람 ${moving}명 / ` +
      `대표 움직임 ${state.currentMotionEnergy.toFixed(3)} / ` +
      `출력 ${state.currentFreq.toFixed(1)} Hz / ` +
      `FPS ${Math.round(state.fps)}`;
  }

  function resetAll() {
    state.tracks.length = 0;
    state.nextTrackId = 1;
    state.detections.length = 0;
    state.mockPeople.length = 0;
    state.currentMotionEnergy = 0;
    state.targetFreq = state.minFreq;
    state.currentFreq = state.minFreq;
    if (state.usingMock) addMockPeople();
  }

  function addMockPeople() {
    state.mockPeople.length = 0;
    const count = Math.floor(rand(2, 5));
    for (let i = 0; i < count; i++) {
      state.mockPeople.push({
        x: rand(0.18, 0.82),
        y: rand(0.22, 0.78),
        w: rand(0.08, 0.12),
        h: rand(0.20, 0.28),
        vx: rand(-0.0035, 0.0035),
        vy: rand(-0.003, 0.003),
        twitch: rand(0.8, 1.5)
      });
    }
  }

  function updateMockPeople() {
    const W = canvas.clientWidth || window.innerWidth;
    const H = canvas.clientHeight || window.innerHeight;
    state.detections.length = 0;

    for (const p of state.mockPeople) {
      p.x += p.vx;
      p.y += p.vy;

      if (Math.random() < 0.05 * p.twitch) {
        p.x += rand(-0.01, 0.01);
        p.y += rand(-0.01, 0.01);
      }

      if (p.x < 0.10 || p.x > 0.90) p.vx *= -1;
      if (p.y < 0.14 || p.y > 0.86) p.vy *= -1;

      state.detections.push({
        bbox: [
          (p.x - p.w / 2) * W,
          (p.y - p.h / 2) * H,
          p.w * W,
          p.h * H
        ],
        class: "person",
        score: 0.99
      });
    }
  }

  function centroidOfDet(det) {
    const [x, y, w, h] = det.bbox;
    return { x: x + w / 2, y: y + h / 2, w, h };
  }

  function distance(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function isLikelyHumanBox(det, frameW, frameH) {
    const [x, y, w, h] = det.bbox;
    if (w <= 0 || h <= 0) return false;

    const area = w * h;
    const aspect = h / Math.max(1, w);

    if (area < frameW * frameH * 0.006) return false;
    if (aspect < 0.8) return false;
    if (aspect > 4.8) return false;
    if (w > frameW * 0.92) return false;
    if (h > frameH * 0.98) return false;

    return true;
  }

  function updateTracks(detections) {
    const centroids = detections.map(centroidOfDet);
    const unmatchedDet = new Set(centroids.map((_, i) => i));
    const unmatchedTracks = new Set(state.tracks.map((_, i) => i));
    const pairs = [];
    const maxDist = Math.min(canvas.clientWidth, canvas.clientHeight) * 0.14;

    for (let ti = 0; ti < state.tracks.length; ti++) {
      for (let di = 0; di < centroids.length; di++) {
        pairs.push({ ti, di, dist: distance(state.tracks[ti], centroids[di]) });
      }
    }
    pairs.sort((a, b) => a.dist - b.dist);

    for (const p of pairs) {
      if (!unmatchedTracks.has(p.ti) || !unmatchedDet.has(p.di)) continue;
      if (p.dist > maxDist) continue;

      const t = state.tracks[p.ti];
      const c = centroids[p.di];

      const prevX = t.x;
      const prevY = t.y;

      t.x = c.x;
      t.y = c.y;
      t.w = c.w;
      t.h = c.h;
      t.missed = 0;
      t.seenCount = (t.seenCount || 0) + 1;
      if (t.seenCount >= 2) t.confirmed = true;

      const motionPx = Math.sqrt((t.x - prevX) ** 2 + (t.y - prevY) ** 2);
      const norm = motionPx / Math.max(1, Math.min(canvas.clientWidth, canvas.clientHeight));
      t.motion = t.motion ? (t.motion * 0.65 + norm * 0.35) : norm;

      unmatchedTracks.delete(p.ti);
      unmatchedDet.delete(p.di);
    }

    for (const di of unmatchedDet) {
      const c = centroids[di];
      state.tracks.push({
        id: state.nextTrackId++,
        x: c.x, y: c.y, w: c.w, h: c.h,
        displayX: c.x, displayY: c.y, displayW: c.w, displayH: c.h,
        missed: 0,
        seenCount: 1,
        confirmed: false,
        motion: 0
      });
    }

    for (const ti of [...unmatchedTracks].reverse()) {
      const t = state.tracks[ti];
      t.missed += 1;
      t.motion *= 0.85;
    }

    state.tracks = state.tracks.filter(t => t.missed < 15);
  }

  function smoothTracks() {
    const s = state.trackingSmoothness;
    for (const t of state.tracks) {
      t.displayX = lerp(t.displayX ?? t.x, t.x, s);
      t.displayY = lerp(t.displayY ?? t.y, t.y, s);
      t.displayW = lerp(t.displayW ?? t.w, t.w, s);
      t.displayH = lerp(t.displayH ?? t.h, t.h, s);
    }
  }

  async function loadModel() {
    try {
      state.model = await cocoSsd.load({ base: "lite_mobilenet_v2" });
      state.modelReady = true;
      updateUI();
    } catch (err) {
      console.error(err);
      alert("모델 로딩 실패");
    }
  }

  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 960 },
          height: { ideal: 540 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      state.cameraOn = true;
      state.usingMock = false;
      updateUI();
    } catch (err) {
      console.error(err);
      alert("카메라 접근 실패. Mock 모드로 전환합니다.");
      stopCamera();
      state.usingMock = true;
      addMockPeople();
      updateUI();
    }
  }

  function stopCamera() {
    const stream = video.srcObject;
    if (stream) stream.getTracks().forEach(track => track.stop());
    video.srcObject = null;
    state.cameraOn = false;
  }

  async function runDetection(now) {
    if (state.detecting) return;
    if (now - state.lastDetectRun < state.detectIntervalMs) return;
    state.lastDetectRun = now;

    if (state.cameraOn && state.modelReady && video.readyState >= 2) {
      state.detecting = true;
      try {
        const preds = await state.model.detect(video);
        const vw = video.videoWidth || 1280;
        const vh = video.videoHeight || 720;

        state.detections = preds.filter(p => {
          if (p.class !== "person") return false;
          if (p.score < state.detectThreshold) return false;
          if (!isLikelyHumanBox(p, vw, vh)) return false;
          return true;
        });
      } catch (err) {
        console.error(err);
        state.detections = [];
      } finally {
        state.detecting = false;
      }
    } else if (state.usingMock) {
      updateMockPeople();
    } else {
      state.detections = [];
    }

    updateTracks(state.detections);
  }

  function computeMotionEnergy() {
    const confirmed = state.tracks.filter(t => t.confirmed);
    if (!confirmed.length) {
      state.currentMotionEnergy = lerp(state.currentMotionEnergy, 0, 0.08);
      return;
    }

    let sum = 0;
    let count = 0;

    for (const t of confirmed) {
      const m = t.motion || 0;
      const active = Math.max(0, m - state.motionThreshold);
      sum += active;
      count++;
    }

    const avg = count ? (sum / count) : 0;
    state.currentMotionEnergy = lerp(state.currentMotionEnergy, avg, 0.18);
  }

  function updateAudioTarget() {
    const normalized = clamp(state.currentMotionEnergy / 0.05, 0, 1);
    state.targetFreq = state.minFreq + (state.maxFreq - state.minFreq) * normalized;
    state.currentFreq = lerp(state.currentFreq, state.targetFreq, state.audioSmooth);

    if (state.audioStarted && state.oscillator && state.gainNode && state.audioCtx) {
      const now = state.audioCtx.currentTime;
      state.oscillator.frequency.cancelScheduledValues(now);
      state.oscillator.frequency.linearRampToValueAtTime(state.currentFreq, now + 0.06);

      const targetGain = normalized > 0.01 ? state.gain : 0.0;
      state.gainNode.gain.cancelScheduledValues(now);
      state.gainNode.gain.linearRampToValueAtTime(targetGain, now + 0.08);
    }
  }

  async function startAudio() {
    try {
      if (!state.audioCtx) {
        state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (state.audioCtx.state === "suspended") {
        await state.audioCtx.resume();
      }

      if (!state.oscillator) {
        state.oscillator = state.audioCtx.createOscillator();
        state.gainNode = state.audioCtx.createGain();

        state.oscillator.type = "sine";
        state.oscillator.frequency.value = state.currentFreq;
        state.gainNode.gain.value = 0.0;

        state.oscillator.connect(state.gainNode);
        state.gainNode.connect(state.audioCtx.destination);
        state.oscillator.start();
      }

      state.audioStarted = true;
      updateUI();
    } catch (err) {
      console.error(err);
      alert("오디오 시작 실패");
    }
  }

  function drawBackgroundGrid(W, H) {
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.lineWidth = 1;
    const gap = 44;

    for (let x = 0; x <= W; x += gap) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y <= H; y += gap) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawContainVideoRect(targetW, targetH) {
    const vw = state.cameraOn ? (video.videoWidth || 1280) : 1280;
    const vh = state.cameraOn ? (video.videoHeight || 720) : 720;
    const scale = Math.min(targetW / vw, targetH / vh);
    const dw = vw * scale;
    const dh = vh * scale;
    const dx = (targetW - dw) / 2;
    const dy = (targetH - dh) / 2;
    return { dx, dy, dw, dh, vw, vh };
  }

  function mapVideoBBoxToCanvas(x, y, w, h, targetW, targetH) {
    const r = drawContainVideoRect(targetW, targetH);
    return {
      x: r.dx + (x / r.vw) * r.dw,
      y: r.dy + (y / r.vh) * r.dh,
      w: (w / r.vw) * r.dw,
      h: (h / r.vh) * r.dh
    };
  }

  function drawScene() {
    const W = canvas.clientWidth;
    const H = canvas.clientHeight;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = "rgba(0,0,0,0.96)";
    ctx.fillRect(0, 0, W, H);
    drawBackgroundGrid(W, H);

    if (state.cameraOn && video.readyState >= 2) {
      const r = drawContainVideoRect(W, H);
      ctx.drawImage(video, r.dx, r.dy, r.dw, r.dh);
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.strokeRect(r.dx, r.dy, r.dw, r.dh);
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.05)";
      ctx.fillRect(20, 20, W - 40, H - 40);
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.font = "14px sans-serif";
      ctx.fillText("카메라가 꺼져 있어 Mock 사람 데이터로 시뮬레이션 중입니다.", 32, 44);
    }

    for (const track of state.tracks) {
      if (!track.confirmed) continue;

      let x = track.displayX - track.displayW / 2;
      let y = track.displayY - track.displayH / 2;
      let w = track.displayW;
      let h = track.displayH;

      if (state.cameraOn) {
        const m = mapVideoBBoxToCanvas(x, y, w, h, W, H);
        x = m.x; y = m.y; w = m.w; h = m.h;
      }

      ctx.strokeStyle = BLUE_LINE;
      ctx.lineWidth = 2.6;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = BLUE_FILL;
      ctx.fillRect(x, y, w, h);

      const label = `PERSON ${track.id}`;
      ctx.font = "bold 14px sans-serif";
      const tw = ctx.measureText(label).width;

      ctx.fillStyle = "rgba(8,12,30,0.90)";
      ctx.fillRect(x, y - 24, tw + 16, 20);
      ctx.strokeStyle = BLUE_LINE;
      ctx.lineWidth = 1.6;
      ctx.strokeRect(x, y - 24, tw + 16, 20);

      ctx.fillStyle = BLUE;
      ctx.fillText(label, x + 8, y - 9);

      const cx = x + w / 2;
      const cy = y + h / 2;

      ctx.beginPath();
      ctx.arc(cx, cy, 4.2, 0, Math.PI * 2);
      ctx.fillStyle = BLUE;
      ctx.fill();

      const motionNorm = clamp((track.motion || 0) / 0.05, 0, 1);
      const barW = Math.max(24, w);
      const bx = x;
      const by = y + h + 8;

      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(bx, by, barW, 4);
      ctx.fillStyle = BLUE;
      ctx.fillRect(bx, by, barW * motionNorm, 4);
    }

    const meterW = Math.min(420, W - 40);
    const meterX = 20;
    const meterY = H - 90;
    const energyNorm = clamp(state.currentMotionEnergy / 0.05, 0, 1);

    ctx.fillStyle = "rgba(0,0,0,0.72)";
    ctx.fillRect(meterX, meterY, meterW, 52);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.strokeRect(meterX, meterY, meterW, 52);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(`MOTION ${state.currentMotionEnergy.toFixed(3)}  →  FREQ ${state.currentFreq.toFixed(1)} Hz`, meterX + 12, meterY + 18);

    ctx.fillStyle = "rgba(255,255,255,0.10)";
    ctx.fillRect(meterX + 12, meterY + 28, meterW - 24, 10);
    ctx.fillStyle = BLUE;
    ctx.fillRect(meterX + 12, meterY + 28, (meterW - 24) * energyNorm, 10);
  }

  async function tryFullscreen() {
    try {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen();
      }
    } catch (err) {
      console.log(err);
    }
  }

  function bindEvents() {
    ui.cameraBtn.addEventListener("click", async () => {
      if (state.cameraOn) {
        stopCamera();
        state.usingMock = true;
        addMockPeople();
      } else {
        await startCamera();
      }
      updateUI();
    });

    ui.audioBtn.addEventListener("click", startAudio);

    ui.mockBtn.addEventListener("click", () => {
      stopCamera();
      state.usingMock = true;
      resetAll();
      addMockPeople();
      updateUI();
    });

    ui.resetBtn.addEventListener("click", () => {
      resetAll();
      updateUI();
    });

    ui.fsBtn.addEventListener("click", tryFullscreen);

    ui.thresholdRange.addEventListener("input", e => {
      state.detectThreshold = parseFloat(e.target.value);
      updateUI();
    });

    ui.motionRange.addEventListener("input", e => {
      state.motionThreshold = parseFloat(e.target.value);
      updateUI();
    });

    ui.smoothRange.addEventListener("input", e => {
      state.trackingSmoothness = parseFloat(e.target.value);
      updateUI();
    });

    ui.minFreqRange.addEventListener("input", e => {
      state.minFreq = parseFloat(e.target.value);
      if (state.maxFreq < state.minFreq) state.maxFreq = state.minFreq;
      ui.maxFreqRange.value = state.maxFreq;
      updateUI();
    });

    ui.maxFreqRange.addEventListener("input", e => {
      state.maxFreq = parseFloat(e.target.value);
      if (state.minFreq > state.maxFreq) state.minFreq = state.maxFreq;
      ui.minFreqRange.value = state.minFreq;
      updateUI();
    });

    ui.gainRange.addEventListener("input", e => {
      state.gain = parseFloat(e.target.value);
      updateUI();
    });

    ui.audioSmoothRange.addEventListener("input", e => {
      state.audioSmooth = parseFloat(e.target.value);
      updateUI();
    });

    window.addEventListener("resize", resizeCanvas);
  }

  async function animate(now) {
    const dt = now - state.lastFrameTime;
    state.lastFrameTime = now;
    state.fps = 1000 / Math.max(1, dt);

    await runDetection(now);
    smoothTracks();
    computeMotionEnergy();
    updateAudioTarget();
    drawScene();
    updateUI();

    requestAnimationFrame(animate);
  }

  function boot() {
    resizeCanvas();
    addMockPeople();
    bindEvents();
    updateUI();
    loadModel();
    requestAnimationFrame(animate);
  }

  boot();
})();
</script>
</body>
</html>
