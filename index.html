<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ink Body World — Body Tracking Drawing Avatar</title>
  <style>
    :root {
      --paper: rgba(245, 235, 215, 0.92);
      --ink: #12100d;
      --line: rgba(35, 29, 22, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080807;
      color: var(--ink);
      font-family: ui-serif, "Apple SD Gothic Neo", "Noto Serif KR", Georgia, serif;
      touch-action: none;
    }

    #webcam {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 180px;
      height: 135px;
      object-fit: cover;
      transform: scaleX(-1);
      border: 1px solid rgba(245,235,215,.28);
      border-radius: 14px;
      z-index: 12;
      opacity: .62;
      background: #000;
    }

    #pose2d {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 180px;
      height: 135px;
      z-index: 13;
      pointer-events: none;
      transform: scaleX(-1);
      opacity: .95;
    }

    .ui {
      position: fixed;
      left: 12px;
      top: 12px;
      width: min(390px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--paper);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 56px rgba(0,0,0,.28);
      z-index: 10;
      transition: transform .25s ease, opacity .25s ease;
    }

    .ui.hidden {
      transform: translateY(calc(-100% - 24px));
      opacity: .13;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 20px;
      letter-spacing: -0.04em;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.5;
      opacity: .74;
    }

    .row {
      display: grid;
      grid-template-columns: 94px 1fr 44px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 12px;
    }

    input, select {
      width: 100%;
      border: 1px solid rgba(30,24,18,.18);
      border-radius: 11px;
      background: rgba(255,252,244,.72);
      color: var(--ink);
      padding: 8px 9px;
      font: inherit;
      font-size: 12px;
      outline: none;
    }

    input[type="range"] { padding: 0; accent-color: #1c1712; }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(30,24,18,.2);
      border-radius: 12px;
      background: rgba(255,252,244,.74);
      color: var(--ink);
      padding: 9px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button.primary { background: rgba(28,23,18,.92); color: #f9eedb; }
    button:active { transform: translateY(1px); }

    .status {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 13px;
      background: rgba(255,255,255,.44);
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(720px, calc(100vw - 28px));
      padding: 10px 12px;
      border-radius: 15px;
      background: rgba(245,235,215,.78);
      border: 1px solid rgba(30,24,18,.14);
      backdrop-filter: blur(10px);
      z-index: 10;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 760px) {
      .ui { left: 8px; top: 8px; width: calc(100vw - 16px); max-height: 56vh; }
      #webcam, #pose2d { width: 132px; height: 99px; right: 8px; bottom: 72px; }
      .hint { left: 8px; right: 8px; bottom: 8px; transform: none; width: auto; text-align: left; }
      .buttons { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <!--
    Ink Body World
    - GitHub Pages에 index.html로 업로드 가능
    - HTTPS 필요: 카메라 권한 때문
    - 카메라 앞 전신이 보일수록 트래킹이 잘 됩니다.
    - 몸 좌우 기울임/팔 방향: 이동 방향
    - 무릎/발목 움직임: 걷기 판정
    - 오른손을 들고 흔들면 공간에 먹선 생성
  -->

  <video id="webcam" playsinline muted autoplay></video>
  <canvas id="pose2d"></canvas>

  <section class="ui" id="ui">
    <h1>Ink Body World</h1>
    <p class="sub">카메라 바디트래킹으로 내 캐릭터가 3D 월드를 걸어다니고, 손을 흔들면 공간에 그림이 남는 테스트.</p>

    <div class="row">
      <label for="avatarName">캐릭터명</label>
      <input id="avatarName" placeholder="예: HeeBeom" />
      <span></span>
    </div>

    <div class="row">
      <label for="moveSpeed">이동 속도</label>
      <input id="moveSpeed" type="range" min="0.01" max="0.22" step="0.005" value="0.075" />
      <span id="moveSpeedVal">.075</span>
    </div>

    <div class="row">
      <label for="brushSize">붓 크기</label>
      <input id="brushSize" type="range" min="0.02" max="0.26" step="0.005" value="0.085" />
      <span id="brushSizeVal">.085</span>
    </div>

    <div class="row">
      <label for="inkLife">먹선 수명</label>
      <input id="inkLife" type="range" min="4" max="90" step="1" value="36" />
      <span id="inkLifeVal">36</span>
    </div>

    <div class="row">
      <label for="worldMode">월드</label>
      <select id="worldMode">
        <option value="ink_mountain">수묵 산수</option>
        <option value="grid_dream">게임 격자</option>
        <option value="void_table">빈 식탁</option>
      </select>
      <span>WORLD</span>
    </div>

    <div class="buttons">
      <button id="startBtn" class="primary">카메라 시작</button>
      <button id="resetBtn">위치 리셋</button>
      <button id="clearInkBtn">먹선 삭제</button>
      <button id="autoWalkBtn">자동 걷기</button>
      <button id="hideBtn">UI 숨김</button>
      <button id="shotBtn">캡처</button>
    </div>

    <div class="status" id="status">카메라 시작을 누르세요. 전신이 보이면 좋고, 최소 상반신+양손이 보이면 손 흔들기 드로잉은 가능합니다.</div>
  </section>

  <div class="hint">몸을 좌우/앞뒤로 기울이면 방향이 정해지고, 다리를 움직이면 걷습니다. 오른손을 어깨보다 높게 들고 흔들면 먹선이 생성됩니다.</div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const $ = (id) => document.getElementById(id);
    const video = $('webcam');
    const poseCanvas = $('pose2d');
    const poseCtx = poseCanvas.getContext('2d');
    const ui = $('ui');
    const statusEl = $('status');

    const controls = {
      moveSpeed: $('moveSpeed'),
      brushSize: $('brushSize'),
      inkLife: $('inkLife'),
      worldMode: $('worldMode')
    };

    const labels = {
      moveSpeed: $('moveSpeedVal'),
      brushSize: $('brushSizeVal'),
      inkLife: $('inkLifeVal')
    };

    const val = (name) => parseFloat(controls[name].value);
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    function syncLabels() {
      labels.moveSpeed.textContent = val('moveSpeed').toFixed(3).replace('0.', '.');
      labels.brushSize.textContent = val('brushSize').toFixed(3).replace('0.', '.');
      labels.inkLife.textContent = String(Math.round(val('inkLife')));
    }
    Object.values(controls).forEach(el => el.addEventListener('input', syncLabels));
    syncLabels();

    let scene, camera, renderer, orbit;
    let avatar, bodyParts = {}, nameSprite;
    let inkGroup, worldGroup;
    let pose;
    let latestLandmarks = null;
    let tracking = false;
    let autoWalk = false;
    let clock = new THREE.Clock();
    let avatarVelocity = new THREE.Vector3();
    let moveDir = new THREE.Vector3(0, 0, -1);
    let isWalking = false;
    let isDrawing = false;
    let lastHandWorld = null;
    let inkObjects = [];
    let handHistory = [];
    let walkPhase = 0;
    let smoothed = {
      leanX: 0,
      leanY: 0,
      legMotion: 0,
      handWave: 0,
      rightHandUp: 0
    };

    initThree();
    buildWorld();
    buildAvatar();
    animate();

    function setStatus(msg) { statusEl.textContent = msg; }

    function initThree() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xf1e5d0, 0.035);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 120);
      camera.position.set(0, 3.2, 7.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0xf1e5d0, 1);
      document.body.appendChild(renderer.domElement);

      orbit = new OrbitControls(camera, renderer.domElement);
      orbit.enableDamping = true;
      orbit.target.set(0, 1.1, 0);

      const hemi = new THREE.HemisphereLight(0xfff4df, 0x1c1814, 2.1);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffecd0, 2.3);
      sun.position.set(4, 8, 3);
      scene.add(sun);

      inkGroup = new THREE.Group();
      scene.add(inkGroup);

      window.addEventListener('resize', onResize);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      poseCanvas.width = 180;
      poseCanvas.height = 135;
    }
    onResize();

    function buildWorld() {
      if (worldGroup) scene.remove(worldGroup);
      worldGroup = new THREE.Group();
      scene.add(worldGroup);

      const mode = controls.worldMode.value;
      renderer.setClearColor(mode === 'grid_dream' ? 0x080b12 : 0xf1e5d0, 1);
      scene.fog.color.set(mode === 'grid_dream' ? 0x080b12 : 0xf1e5d0);

      const floorMat = new THREE.MeshStandardMaterial({
        color: mode === 'grid_dream' ? 0x101725 : 0xe7d8bd,
        roughness: 0.85,
        metalness: 0.02
      });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 120, 80, 80), floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      worldGroup.add(floor);

      if (mode === 'ink_mountain') buildInkMountainWorld();
      if (mode === 'grid_dream') buildGridDreamWorld();
      if (mode === 'void_table') buildVoidTableWorld();
    }

    function buildInkMountainWorld() {
      addGridLines(0x2a2118, 0.14, 3.0);
      for (let i = 0; i < 38; i++) {
        const geo = new THREE.ConeGeometry(rand(0.8, 2.8), rand(2.8, 9.2), 5 + Math.floor(Math.random() * 4));
        const mat = new THREE.MeshStandardMaterial({
          color: new THREE.Color(rand(0.13, 0.34), rand(0.12, 0.25), rand(0.09, 0.18)),
          roughness: 1,
          transparent: true,
          opa
