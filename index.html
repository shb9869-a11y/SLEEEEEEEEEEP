<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Blue Box + Yellow Skeleton Tracker</title>
  <style>
    :root{
      --panel-w: 340px;
      --blue-rgb: 0, 56, 168;
      --blue-solid: rgb(0, 56, 168);
      --yellow: #ffd400;
      --bg: #05070b;
      --panel: rgba(10, 14, 22, 0.92);
      --line: rgba(255,255,255,0.09);
      --text: #f3f7ff;
      --muted: #b8c3d7;
      --accent: #4da3ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr var(--panel-w);
      background: #000;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      filter: grayscale(1) contrast(1.08) brightness(0.92);
      background: #000;
    }

    #overlay {
      pointer-events: none;
    }

    #topBar {
      position: absolute;
      top: 18px;
      left: 18px;
      z-index: 20;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .glassBtn {
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(10,14,22,0.72);
      color: #fff;
      padding: 11px 14px;
      border-radius: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .glassBtn:hover {
      background: rgba(20,28,42,0.86);
    }

    .statusChip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(10,14,22,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    #sidePanel {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--panel);
      border-left: 1px solid var(--line);
      overflow: auto;
      padding: 18px 16px 24px;
      backdrop-filter: blur(14px);
    }

    #sidePanel h1 {
      margin: 2px 0 14px;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .group {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      background: rgba(255,255,255,0.02);
    }

    .groupTitle {
      font-size: 13px;
      color: var(--accent);
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    label {
      font-size: 13px;
      color: var(--text);
      font-weight: 600;
      line-height: 1.35;
    }

    .value {
      font-size: 12px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      min-width: 54px;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }

    .toggleRow {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .toggleRow:last-child {
      margin-bottom: 0;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      display: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      cursor: pointer;
      background: rgba(255,255,255,0.16);
      border-radius: 999px;
      transition: 0.2s ease;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: 0.2s ease;
    }

    .switch input:checked + .slider {
      background: rgba(77,163,255,0.9);
    }

    .switch input:checked + .slider::before {
      transform: translateX(22px);
    }

    #detections {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    #detections li {
      padding: 10px 11px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      line-height: 1.35;
      color: #e6efff;
    }

    .mini {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .fullWidthBtn {
      width: 100%;
      margin-top: 10px;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 800;
    }

    @media (max-width: 980px) {
      :root { --panel-w: 300px; }
    }

    @media (max-width: 820px) {
      #app {
        grid-template-columns: 1fr;
      }

      #sidePanel {
        position: absolute;
        right: 0;
        top: 0;
        width: min(86vw, 340px);
        transform: translateX(0);
        z-index: 40;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>

      <div id="topBar">
        <button class="glassBtn" id="startBtn">시작</button>
        <button class="glassBtn" id="switchCamBtn">카메라 전환</button>
        <button class="glassBtn" id="togglePanelBtn">메뉴 열기/닫기</button>
        <div class="statusChip" id="status">대기 중</div>
      </div>
    </div>

    <aside id="sidePanel">
      <h1>Tracking Control</h1>

      <div class="group">
        <div class="groupTitle">View</div>

        <div class="toggleRow">
          <label for="showBoxes">파란 박스 표시</label>
          <label class="switch">
            <input id="showBoxes" type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggleRow">
          <label for="showSkeleton">노란 스켈레톤 표시</label>
          <label class="switch">
            <input id="showSkeleton" type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggleRow">
          <label for="personOnly">person만 보기</label>
          <label class="switch">
            <input id="personOnly" type="checkbox" />
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <div class="group">
        <div class="groupTitle">Detection</div>

        <div class="row">
          <div style="width:100%">
            <label for="objThreshold">물체 confidence</label>
            <input id="objThreshold" type="range" min="0.1" max="0.95" step="0.01" value="0.45" />
          </div>
          <div class="value" id="objThresholdVal">0.45</div>
        </div>

        <div class="row">
          <div style="width:100%">
            <label for="poseThreshold">포즈 confidence</label>
            <input id="poseThreshold" type="range" min="0.1" max="0.95" step="0.01" value="0.45" />
          </div>
          <div class="value" id="poseThresholdVal">0.45</div>
        </div>

        <div class="row">
          <div style="width:100%">
            <label for="maxResults">최대 검출 수</label>
            <input id="maxResults" type="range" min="1" max="20" step="1" value="8" />
          </div>
          <div class="value" id="maxResultsVal">8</div>
        </div>
      </div>

      <div class="group">
        <div class="groupTitle">Style</div>

        <div class="row">
          <div style="width:100%">
            <label for="boxAlpha">박스 채움 강도</label>
            <input id="boxAlpha" type="range" min="0.15" max="1" step="0.01" value="0.78" />
          </div>
          <div class="value" id="boxAlphaVal">0.78</div>
        </div>

        <div class="row">
          <div style="width:100%">
            <label for="labelFont">라벨 폰트 크기</label>
            <input id="labelFont" type="range" min="12" max="32" step="1" value="18" />
          </div>
          <div class="value" id="labelFontVal">18</div>
        </div>

        <div class="row">
          <div style="width:100%">
            <label for="skeletonWidth">스켈레톤 두께</label>
            <input id="skeletonWidth" type="range" min="1" max="8" step="1" value="4" />
          </div>
          <div class="value" id="skeletonWidthVal">4</div>
        </div>
      </div>

      <div class="group">
        <div class="groupTitle">Info</div>
        <div class="mini" id="cameraInfo">카메라: 아직 없음</div>
        <div class="mini" id="fpsInfo" style="margin-top:8px;">FPS: -</div>
        <button id="restartBtn" class="glassBtn fullWidthBtn">모델/카메라 다시 시작</button>
      </div>

      <div class="group">
        <div class="groupTitle">Detections</div>
        <ul id="detections"></ul>
      </div>
    </aside>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      ObjectDetector,
      PoseLandmarker
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/vision_bundle.mjs";

    const video = document.getElementById("video");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");

    const statusEl = document.getElementById("status");
    const cameraInfoEl = document.getElementById("cameraInfo");
    const fpsInfoEl = document.getElementById("fpsInfo");
    const detectionsEl = document.getElementById("detections");

    const startBtn = document.getElementById("startBtn");
    const switchCamBtn = document.getElementById("switchCamBtn");
    const restartBtn = document.getElementById("restartBtn");
    const togglePanelBtn = document.getElementById("togglePanelBtn");
    const sidePanel = document.getElementById("sidePanel");

    const ui = {
      showBoxes: document.getElementById("showBoxes"),
      showSkeleton: document.getElementById("showSkeleton"),
      personOnly: document.getElementById("personOnly"),
      objThreshold: document.getElementById("objThreshold"),
      poseThreshold: document.getElementById("poseThreshold"),
      maxResults: document.getElementById("maxResults"),
      boxAlpha: document.getElementById("boxAlpha"),
      labelFont: document.getElementById("labelFont"),
      skeletonWidth: document.getElementById("skeletonWidth"),

      objThresholdVal: document.getElementById("objThresholdVal"),
      poseThresholdVal: document.getElementById("poseThresholdVal"),
      maxResultsVal: document.getElementById("maxResultsVal"),
      boxAlphaVal: document.getElementById("boxAlphaVal"),
      labelFontVal: document.getElementById("labelFontVal"),
      skeletonWidthVal: document.getElementById("skeletonWidthVal")
    };

    let stream = null;
    let objectDetector = null;
    let poseLandmarker = null;
    let running = false;
    let rafId = null;
    let devices = [];
    let currentDeviceIndex = 0;
    let facingMode = "user";
    let lastVideoTime = -1;
    let lastFpsUpdate = performance.now();
    let frameCounter = 0;

    const OBJECT_MODEL =
      "https://storage.googleapis.com/mediapipe-tasks/object_detector/efficientdet_lite0_uint8.tflite";

    const POSE_MODEL =
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task";

    const POSE_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,7],
      [0,4],[4,5],[5,6],[6,8],
      [9,10],
      [11,12],
      [11,13],[13,15],
      [12,14],[14,16],
      [15,17],[15,19],[15,21],
      [16,18],[16,20],[16,22],
      [11,23],[12,24],
      [23,24],
      [23,25],[25,27],[27,29],[29,31],
      [24,26],[26,28],[28,30],[30,32]
    ];

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function syncUiValues() {
      ui.objThresholdVal.textContent = Number(ui.objThreshold.value).toFixed(2);
      ui.poseThresholdVal.textContent = Number(ui.poseThreshold.value).toFixed(2);
      ui.maxResultsVal.textContent = ui.maxResults.value;
      ui.boxAlphaVal.textContent = Number(ui.boxAlpha.value).toFixed(2);
      ui.labelFontVal.textContent = ui.labelFont.value;
      ui.skeletonWidthVal.textContent = ui.skeletonWidth.value;
    }

    Object.values(ui).forEach(el => {
      if (el instanceof HTMLElement && "addEventListener" in el) {
        el.addEventListener("input", syncUiValues);
      }
    });
    syncUiValues();

    function resizeCanvas() {
      const rect = video.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);

    async function listCameras() {
      const all = await navigator.mediaDevices.enumerateDevices();
      devices = all.filter(d => d.kind === "videoinput");
      if (!devices.length) {
        throw new Error("사용 가능한 카메라가 없음");
      }
    }

    async function startCamera({useDeviceId = true} = {}) {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      await listCameras();

      const constraints = {
        audio: false,
        video: useDeviceId && devices[currentDeviceIndex]
          ? {
              deviceId: { exact: devices[currentDeviceIndex].deviceId },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          : {
              facingMode: { ideal: facingMode },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
      };

      stream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = stream;

      await new Promise(resolve => {
        video.onloadedmetadata = async () => {
          await video.play();
          resolve();
        };
      });

      resizeCanvas();

      const activeTrack = stream.getVideoTracks()[0];
      const label = activeTrack?.label || devices[currentDeviceIndex]?.label || "알 수 없음";
      cameraInfoEl.textContent = `카메라: ${label}`;
    }

    async function createModels() {
      setStatus("모델 로딩 중");
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.32/wasm"
      );

      objectDetector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: OBJECT_MODEL,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        scoreThreshold: Number(ui.objThreshold.value),
        maxResults: Number(ui.maxResults.value)
      });

      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: POSE_MODEL,
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 4,
        minPoseDetectionConfidence: Number(ui.poseThreshold.value),
        minPosePresenceConfidence: Number(ui.poseThreshold.value),
        minTrackingConfidence: Number(ui.poseThreshold.value)
      });

      setStatus("준비 완료");
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function drawFilledBox(x, y, w, h, label, score) {
      if (!ui.showBoxes.checked) return;

      const alpha = Number(ui.boxAlpha.value);
      const fontSize = Number(ui.labelFont.value);
      const text = `${label} ${(score * 100).toFixed(0)}%`;

      ctx.save();
      ctx.fillStyle = `rgba(${getComputedStyle(document.documentElement).getPropertyValue('--blue-rgb')}, ${alpha})`;
      ctx.strokeStyle = "rgba(255,255,255,0.12)";
      ctx.lineWidth = 1.2;
      ctx.fillRect(x, y, w, h);
      ctx.strokeRect(x, y, w, h);

      ctx.font = `800 ${fontSize}px Inter, Arial, sans-serif`;
      const padX = 10;
      const padY = 8;
      const textW = ctx.measureText(text).width;
      const tagW = textW + padX * 2;
      const tagH = fontSize + padY * 2;
      const tagY = Math.max(0, y - tagH - 6);

      ctx.fillStyle = "rgba(0, 56, 168, 0.98)";
      ctx.fillRect(x, tagY, tagW, tagH);

      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "top";
      ctx.fillText(text, x + padX, tagY + padY - 1);
      ctx.restore();
    }

    function drawSkeleton(landmarks) {
      if (!ui.showSkeleton.checked || !landmarks?.length) return;

      const lineW = Number(ui.skeletonWidth.value);
      const poseConf = Number(ui.poseThreshold.value);
      const rect = video.getBoundingClientRect();
      const vw = rect.width;
      const vh = rect.height;

      ctx.save();
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--yellow').trim();
      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--yellow').trim();
      ctx.lineWidth = lineW;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (const [a, b] of POSE_CONNECTIONS) {
        const p1 = landmarks[a];
        const p2 = landmarks[b];
        if (!p1 || !p2) continue;

        const p1ok = (p1.visibility ?? p1.presence ?? 1) >= poseConf;
        const p2ok = (p2.visibility ?? p2.presence ?? 1) >= poseConf;
        if (!p1ok || !p2ok) continue;

        ctx.beginPath();
        ctx.moveTo(p1.x * vw, p1.y * vh);
        ctx.lineTo(p2.x * vw, p2.y * vh);
        ctx.stroke();
      }

      for (const p of landmarks) {
        const ok = (p.visibility ?? p.presence ?? 1) >= poseConf;
        if (!ok) continue;
        ctx.beginPath();
        ctx.arc(p.x * vw, p.y * vh, Math.max(2.5, lineW * 0.85), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function bboxToCssRect(bbox) {
      const rect = video.getBoundingClientRect();
      const vw = rect.width;
      const vh = rect.height;

      return {
        x: bbox.originX * (vw / video.videoWidth),
        y: bbox.originY * (vh / video.videoHeight),
        w: bbox.width * (vw / video.videoWidth),
        h: bbox.height * (vh / video.videoHeight)
      };
    }

    function poseInsideBox(landmarks, box) {
      if (!landmarks?.length) return false;
      let inside = 0;
      let total = 0;

      const rect = video.getBoundingClientRect();
      const vw = rect.width;
      const vh = rect.height;

      for (const p of landmarks) {
        const ok = (p.visibility ?? p.presence ?? 1) >= Number(ui.poseThreshold.value);
        if (!ok) continue;
        total++;
        const x = p.x * vw;
        const y = p.y * vh;
        if (
          x >= box.x - 20 &&
          x <= box.x + box.w + 20 &&
          y >= box.y - 20 &&
          y <= box.y + box.h + 20
        ) {
          inside++;
        }
      }
      if (!total) return false;
      return inside / total > 0.28;
    }

    function updateDetectionList(rows) {
      detectionsEl.innerHTML = "";
      if (!rows.length) {
        const li = document.createElement("li");
        li.textContent = "현재 검출 없음";
        detectionsEl.appendChild(li);
        return;
      }

      rows.slice(0, 12).forEach(r => {
        const li = document.createElement("li");
        li.innerHTML = `<strong>${r.name}</strong><br>score ${r.score}% · x ${r.x} · y ${r.y} · w ${r.w} · h ${r.h}`;
        detectionsEl.appendChild(li);
      });
    }

    async function renderLoop() {
      if (!running) return;
      rafId = requestAnimationFrame(renderLoop);

      if (!video.videoWidth || !video.videoHeight) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!objectDetector || !poseLandmarker) return;

      objectDetector.setOptions({
        scoreThreshold: Number(ui.objThreshold.value),
        maxResults: Number(ui.maxResults.value)
      });

      poseLandmarker.setOptions({
        minPoseDetectionConfidence: Number(ui.poseThreshold.value),
        minPosePresenceConfidence: Number(ui.poseThreshold.value),
        minTrackingConfidence: Number(ui.poseThreshold.value)
      });

      const now = performance.now();
      const objectResult = objectDetector.detectForVideo(video, now);
      const poseResult = poseLandmarker.detectForVideo(video, now);

      let detections = objectResult?.detections ?? [];
      detections = detections.filter(d => {
        const cat = d.categories?.[0];
        if (!cat) return false;
        if (ui.personOnly.checked) return cat.categoryName === "person";
        return true;
      });

      const listRows = [];

      for (const det of detections) {
        const cat = det.categories?.[0];
        const name = cat?.categoryName || "unknown";
        const score = cat?.score ?? 0;
        const box = bboxToCssRect(det.boundingBox);

        drawFilledBox(box.x, box.y, box.w, box.h, name, score);

        listRows.push({
          name,
          score: (score * 100).toFixed(0),
          x: Math.round(box.x),
          y: Math.round(box.y),
          w: Math.round(box.w),
          h: Math.round(box.h)
        });
      }

      const poses = poseResult?.landmarks ?? [];
      const personBoxes = detections
        .filter(d => d.categories?.[0]?.categoryName === "person")
        .map(d => bboxToCssRect(d.boundingBox));

      if (ui.showSkeleton.checked) {
        if (personBoxes.length) {
          for (const box of personBoxes) {
            const matched = poses.find(landmarks => poseInsideBox(landmarks, box));
            if (matched) drawSkeleton(matched);
          }
        } else if (!ui.personOnly.checked) {
          for (const landmarks of poses) {
            drawSkeleton(landmarks);
          }
        }
      }

      updateDetectionList(listRows);

      frameCounter++;
      const elapsed = now - lastFpsUpdate;
      if (elapsed >= 1000) {
        const fps = (frameCounter * 1000 / elapsed).toFixed(1);
        fpsInfoEl.textContent = `FPS: ${fps}`;
        frameCounter = 0;
        lastFpsUpdate = now;
      }
    }

    async function startAll() {
      try {
        setStatus("카메라 시작 중");
        await startCamera({ useDeviceId: false });
        setStatus("모델 생성 중");
        await createModels();
        running = true;
        lastVideoTime = -1;
        renderLoop();
      } catch (err) {
        console.error(err);
        setStatus(`오류: ${err.message}`);
      }
    }

    async function restartAll() {
      running = false;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      objectDetector = null;
      poseLandmarker = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      await startAll();
    }

    async function switchCamera() {
      try {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);

        await listCameras();

        if (devices.length > 1) {
          currentDeviceIndex = (currentDeviceIndex + 1) % devices.length;
          await startCamera({ useDeviceId: true });
        } else {
          facingMode = facingMode === "user" ? "environment" : "user";
          await startCamera({ useDeviceId: false });
        }

        running = true;
        lastVideoTime = -1;
        renderLoop();
      } catch (err) {
        console.error(err);
        setStatus(`카메라 전환 실패: ${err.message}`);
      }
    }

    startBtn.addEventListener("click", startAll);
    switchCamBtn.addEventListener("click", switchCamera);
    restartBtn.addEventListener("click", restartAll);

    togglePanelBtn.addEventListener("click", () => {
      const isHidden = sidePanel.style.display === "none";
      sidePanel.style.display = isHidden ? "block" : "none";
    });

    navigator.mediaDevices?.addEventListener?.("devicechange", async () => {
      try {
        await listCameras();
      } catch (_) {}
    });

    syncUiValues();
  </script>
</body>
</html>
