<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
document.getElementById("video");

const fileInput =
document.getElementById("fileInput");

const playButton =
document.getElementById("playButton");

const stopButton =
document.getElementById("stopButton");

const stage =
document.getElementById("stage");


const visualCanvas =
document.getElementById("visualCanvas");

const visualCtx =
visualCanvas.getContext("2d");


const analysisCanvas =
document.getElementById("analysisCanvas");

const analysisCtx =
analysisCanvas.getContext("2d");


const statusElement =
document.getElementById("status");

const filenameElement =
document.getElementById("filename");

const objectsElement =
document.getElementById("objects");

const modelState =
document.getElementById("modelState");


const objectMeter =
document.getElementById("objectMeter");

const motionMeter =
document.getElementById("motionMeter");

const detectionMeter =
document.getElementById("detectionMeter");

const eventMeter =
document.getElementById("eventMeter");



/* =========================================================
   SLIDERS
========================================================= */

const sliders = {

videoVolume:
document.getElementById("videoVolume"),

master:
document.getElementById("masterVolume"),

reverb:
document.getElementById("reverbAmount"),

ambient:
document.getElementById("ambientLevel"),

tone:
document.getElementById("ambientTone"),

drift:
document.getElementById("ambientDrift"),

radio:
document.getElementById("radioLevel"),

radioFrequency:
document.getElementById("radioFrequency"),

radioStatic:
document.getElementById("radioStatic"),

glitch:
document.getElementById("glitchLevel"),

glitchDensity:
document.getElementById("glitchDensity"),

piano:
document.getElementById("pianoLevel"),

softness:
document.getElementById("pianoSoftness"),

response:
document.getElementById("responseAmount"),

color:
document.getElementById("colorAmount")

};



/* =========================================================
   VALUE LABELS
========================================================= */

function setupSlider(
    slider,
    labelID,
    multiplier = 100
) {

    const label =
    document.getElementById(
        labelID
    );


    const update = () => {

        label.textContent =

        Math.round(
            Number(
                slider.value
            )
            *
            multiplier
        )

        +

        "%";

    };


    slider.addEventListener(
        "input",
        update
    );


    update();

}


setupSlider(
    sliders.videoVolume,
    "videoVolumeValue"
);

setupSlider(
    sliders.master,
    "masterValue"
);

setupSlider(
    sliders.reverb,
    "reverbValue"
);

setupSlider(
    sliders.ambient,
    "ambientValue"
);

setupSlider(
    sliders.tone,
    "toneValue"
);

setupSlider(
    sliders.drift,
    "driftValue"
);

setupSlider(
    sliders.radio,
    "radioValue"
);

setupSlider(
    sliders.radioFrequency,
    "radioFreqValue"
);

setupSlider(
    sliders.radioStatic,
    "staticValue"
);

setupSlider(
    sliders.glitch,
    "glitchValue"
);

setupSlider(
    sliders.glitchDensity,
    "densityValue"
);

setupSlider(
    sliders.piano,
    "pianoValue"
);

setupSlider(
    sliders.softness,
    "softnessValue"
);

setupSlider(
    sliders.response,
    "responseValue"
);

setupSlider(
    sliders.color,
    "colorValue"
);



/* =========================================================
   STATE
========================================================= */

let model = null;

let modelReady = false;

let videoReady = false;

let running = false;

let objectURL = null;


let predictions = [];

let previousObjects = [];

let detectionBusy = false;

let lastDetection = 0;


/*
   빠른 detection.
*/

const DETECTION_INTERVAL = 45;


let detectionCount = 0;

let detectionStart =
performance.now();



/* =========================================================
   VIDEO AUDIO

   원본 영상 소리는 이 video element에서만 나온다.
   GENERATED SOUND와 완전히 별개다.
========================================================= */

function updateVideoAudio() {

    const volume =
    Number(
        sliders.videoVolume.value
    );


    /*
       0이면 강제 mute.
    */

    if(volume <= .001) {

        video.volume = 0;

        video.muted = true;

    }

    else {

        video.muted = false;

        video.volume = volume;

    }

}


sliders.videoVolume.addEventListener(
    "input",
    updateVideoAudio
);



/* =========================================================
   AUDIO ENGINE
========================================================= */

let AC = null;

let masterGain = null;

let dryGain = null;

let reverbGain = null;

let delay = null;

let delayFeedback = null;

let compressor = null;


let ambientGain = null;

let ambientFilter = null;

let ambientVoices = [];


let radioGain = null;

let radioFilter = null;

let radioNoise = null;

let radioOscillator = null;


let lastGlitch = 0;

let lastKey = 0;

let lastObjectHit = 0;


const ROOT =
73.416;


/* =========================================================
   CREATE AUDIO
========================================================= */

function createAudioEngine() {

    if(AC)
        return;


    const AudioContextClass =

    window.AudioContext ||

    window.webkitAudioContext;


    AC =
    new AudioContextClass();



    /* MASTER */

    masterGain =
    AC.createGain();


    masterGain.gain.value =
    Number(
        sliders.master.value
    );



    /* DRY */

    dryGain =
    AC.createGain();


    dryGain.gain.value =
    .75;



    /* DELAY / SPACE */

    delay =
    AC.createDelay(4);


    delay.delayTime.value =
    .67;


    delayFeedback =
    AC.createGain();


    delayFeedback.gain.value =
    .34;


    reverbGain =
    AC.createGain();


    reverbGain.gain.value =
    Number(
        sliders.reverb.value
    )
    *
    .45;


    delay.connect(
        delayFeedback
    );


    delayFeedback.connect(
        delay
    );


    delay.connect(
        reverbGain
    );



    /* COMPRESS */

    compressor =
    AC.createDynamicsCompressor();


    compressor.threshold.value =
    -18;

    compressor.knee.value =
    12;

    compressor.ratio.value =
    5;

    compressor.attack.value =
    .02;

    compressor.release.value =
    .8;



    dryGain.connect(
        compressor
    );


    reverbGain.connect(
        compressor
    );


    compressor.connect(
        masterGain
    );


    masterGain.connect(
        AC.destination
    );


    createAmbient();

    createRadio();

}



/* =========================================================
   MASTER CONTROLS
========================================================= */

sliders.master.addEventListener(
    "input",
    () => {

        if(!AC)
            return;


        masterGain.gain
        .setTargetAtTime(

            Number(
                sliders.master.value
            ),

            AC.currentTime,

            .05

        );

    }
);


sliders.reverb.addEventListener(
    "input",
    () => {

        if(!AC)
            return;


        reverbGain.gain
        .setTargetAtTime(

            Number(
                sliders.reverb.value
            )
            *
            .5,

            AC.currentTime,

            .1

        );

    }
);



/* =========================================================
   AMBIENT FIELD
========================================================= */

function createAmbient() {

    ambientGain =
    AC.createGain();


    ambientGain.gain.value =
    0;


    ambientFilter =
    AC.createBiquadFilter();


    ambientFilter.type =
    "lowpass";


    ambientFilter.frequency.value =
    500;


    ambientFilter.Q.value =
    .7;



    /*
       불완전한 harmonic cluster.

       피아노 코드가 아니라
       흐릿한 전자적 장.
    */

    const voices = [

        {
            ratio: .5,
            type: "sine",
            gain: .45,
            detune: -8
        },

        {
            ratio: 1,
            type: "sawtooth",
            gain: .09,
            detune: -13
        },

        {
            ratio: 1.498,
            type: "triangle",
            gain: .08,
            detune: 9
        },

        {
            ratio: 2.01,
            type: "sawtooth",
            gain: .035,
            detune: -17
        },

        {
            ratio: 2.37,
            type: "triangle",
            gain: .025,
            detune: 15
        }

    ];


    voices.forEach(
        voice => {

            const osc =
            AC.createOscillator();


            osc.type =
            voice.type;


            osc.frequency.value =

            ROOT *

            voice.ratio;


            osc.detune.value =
            voice.detune;


            const gain =
            AC.createGain();


            gain.gain.value =
            voice.gain;


            osc.connect(
                gain
            );


            gain.connect(
                ambientFilter
            );


            osc.start();


            ambientVoices.push({

                osc,

                gain,

                baseDetune:
                voice.detune

            });

        }
    );


    ambientFilter.connect(
        ambientGain
    );


    ambientGain.connect(
        dryGain
    );


    ambientGain.connect(
        delay
    );

}



/* =========================================================
   RADIO TEXTURE
========================================================= */

function createRadio() {

    /*
       NOISE BUFFER
    */

    const length =
    AC.sampleRate *
    4;


    const buffer =
    AC.createBuffer(

        1,

        length,

        AC.sampleRate

    );


    const data =
    buffer.getChannelData(0);


    let brown =
    0;


    for(
        let i = 0;
        i < length;
        i++
    ) {

        const white =

        Math.random() *
        2 -
        1;


        brown =

        brown *
        .965

        +

        white *
        .035;


        let sample =
        brown *
        2.2;


        /*
           라디오 crack.
        */

        if(
            Math.random()
            <
            .0018
        ) {

            sample +=

            (
                Math.random() *
                2 -
                1
            )

            *

            2;

        }


        data[i] =
        sample;

    }


    radioNoise =
    AC.createBufferSource();


    radioNoise.buffer =
    buffer;


    radioNoise.loop =
    true;



    /*
       약한 carrier tone.

       tuning frequency 같은
       느낌을 더한다.
    */

    radioOscillator =
    AC.createOscillator();


    radioOscillator.type =
    "sine";


    radioOscillator.frequency.value =
    1100;



    const oscGain =
    AC.createGain();


    oscGain.gain.value =
    .007;



    radioFilter =
    AC.createBiquadFilter();


    radioFilter.type =
    "bandpass";


    radioFilter.frequency.value =
    1700;


    radioFilter.Q.value =
    4;



    radioGain =
    AC.createGain();


    radioGain.gain.value =
    0;



    radioNoise.connect(
        radioFilter
    );


    radioOscillator.connect(
        oscGain
    );


    oscGain.connect(
        radioFilter
    );


    radioFilter.connect(
        radioGain
    );


    radioGain.connect(
        dryGain
    );


    radioGain.connect(
        delay
    );


    radioNoise.start();

    radioOscillator.start();

}



/* =========================================================
   SOFT KEY

   피아노 샘플을 쓰는 게 아니라
   맑지만 눌린 전자 건반.

   Attack을 죽이고
   lowpass + 긴 decay.
========================================================= */

function softKey(
    x,
    y,
    strength
) {

    if(!AC)
        return;


    const now =
    AC.currentTime;


    if(
        now -
        lastKey
        <
        .22
    )
        return;


    lastKey =
    now;



    /*
       D minor / suspended 느낌.
    */

    const intervals = [

        0,
        3,
        5,
        7,
        10,
        12,
        15,
        19

    ];


    const index =

    Math.floor(

        (1 - y)

        *

        intervals.length

    );


    const interval =

    intervals[

        Math.max(

            0,

            Math.min(

                intervals.length - 1,

                index

            )

        )

    ];


    const frequency =

    ROOT *
    2 *

    Math.pow(

        2,

        interval / 12

    );


    const osc =
    AC.createOscillator();


    osc.type =
    "sine";


    osc.frequency.value =
    frequency;



    /*
       아주 작은 상음.
    */

    const harmonic =
    AC.createOscillator();


    harmonic.type =
    "triangle";


    harmonic.frequency.value =
    frequency *
    2.003;



    const harmonicGain =
    AC.createGain();


    harmonicGain.gain.value =
    .13;



    const filter =
    AC.createBiquadFilter();


    filter.type =
    "lowpass";


    const softness =
    Number(
        sliders.softness.value
    );


    filter.frequency.value =

    700 +

    (
        1 -
        softness
    )

    *

    4000;



    const gain =
    AC.createGain();


    const level =

    Number(
        sliders.piano.value
    )

    *

    (
        .025 +
        strength *
        .055
    );


    /*
       딱! 하는 attack을 없앰.
    */

    gain.gain
    .setValueAtTime(

        .0001,

        now

    );


    gain.gain
    .exponentialRampToValueAtTime(

        Math.max(
            .001,
            level
        ),

        now +
        .025 +
        softness *
        .12

    );


    gain.gain
    .exponentialRampToValueAtTime(

        .0001,

        now +
        1.4 +
        softness *
        2.5

    );



    const pan =
    AC.createStereoPanner();


    pan.pan.value =
    x *
    2 -
    1;



    osc.connect(
        filter
    );


    harmonic.connect(
        harmonicGain
    );


    harmonicGain.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        pan
    );


    pan.connect(
        dryGain
    );


    pan.connect(
        delay
    );


    osc.start(now);

    harmonic.start(now);


    osc.stop(
        now +
        5
    );


    harmonic.stop(
        now +
        5
    );


    eventMeter.textContent =
    "KEY";

}



/* =========================================================
   GLITCH
========================================================= */

function glitch(
    x,
    strength
) {

    if(!AC)
        return;


    const now =
    AC.currentTime;


    if(
        now -
        lastGlitch
        <
        .055
    )
        return;


    lastGlitch =
    now;


    const density =
    Number(
        sliders.glitchDensity.value
    );


    if(
        Math.random()
        >
        density
    )
        return;



    const osc =
    AC.createOscillator();


    osc.type =

    Math.random() > .5

    ?

    "square"

    :

    "sawtooth";


    osc.frequency.value =

    120 +

    Math.random() *
    4500;



    const filter =
    AC.createBiquadFilter();


    filter.type =
    "bandpass";


    filter.frequency.value =

    500 +

    Math.random() *
    7000;


    filter.Q.value =

    5 +

    Math.random() *
    15;



    const gain =
    AC.createGain();


    const level =

    Number(
        sliders.glitch.value
    )

    *

    (
        .006 +
        strength *
        .04
    );


    gain.gain.setValueAtTime(

        Math.max(
            .0001,
            level
        ),

        now

    );


    gain.gain
    .exponentialRampToValueAtTime(

        .0001,

        now +

        .015 +

        Math.random() *
        .12

    );



    const pan =
    AC.createStereoPanner();


    pan.pan.value =
    x *
    2 -
    1;


    osc.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        pan
    );


    pan.connect(
        dryGain
    );


    osc.start(now);


    osc.stop(
        now +
        .2
    );


    eventMeter.textContent =
    "GLITCH";

}



/* =========================================================
   OBJECT IMPACT

   새 객체가 등장할 때의
   "툭".
========================================================= */

function objectImpact(
    x,
    strength
) {

    if(!AC)
        return;


    const now =
    AC.currentTime;


    if(
        now -
        lastObjectHit
        <
        .12
    )
        return;


    lastObjectHit =
    now;


    const osc =
    AC.createOscillator();


    osc.type =
    "triangle";


    osc.frequency
    .setValueAtTime(

        190 +

        x *
        160,

        now

    );


    osc.frequency
    .exponentialRampToValueAtTime(

        55 +

        x *
        30,

        now +
        .12

    );


    const gain =
    AC.createGain();


    gain.gain
    .setValueAtTime(

        .015 +

        strength *
        .035,

        now

    );


    gain.gain
    .exponentialRampToValueAtTime(

        .0001,

        now +
        .25

    );


    const pan =
    AC.createStereoPanner();


    pan.pan.value =
    x *
    2 -
    1;


    osc.connect(
        gain
    );


    gain.connect(
        pan
    );


    pan.connect(
        dryGain
    );


    pan.connect(
        delay
    );


    osc.start(now);


    osc.stop(
        now +
        .3
    );


    eventMeter.textContent =
    "OBJECT";

}

fileInput.addEventListener(

        );

        stage.style.display =
        "block";


        videoReady =
        false;


        statusElement.textContent =
        "LOADING VIDEO";


        video.onloadedmetadata =
        () => {

            visualCanvas.width =
            video.videoWidth;


            visualCanvas.height =
            video.videoHeight;



            /*
               Detection resolution.

               512로 낮춰
               속도를 우선한다.
            */

            const width =

            Math.min(

                512,

                video.videoWidth

            );


            const ratio =

            video.videoHeight /

            video.videoWidth;


            analysisCanvas.width =
            width;


            analysisCanvas.height =

            Math.round(

                width *
                ratio

            );


            videoReady =
            true;


            updateVideoAudio();


            statusElement.textContent =
            "READY";


            updatePlayButton();

        };

    }
);

/* =========================================================
   TRACKING
========================================================= */

function analyseObjects(
    detections
) {

    const current =

    detections.map(
        detection => {

            const [
                x,
                y,
                w,
                h
            ] =
            detection.bbox;


            return {

                className:
                detection.class,

                x:
                (
                    x +
                    w / 2
                )
                /
                analysisCanvas.width,

                y:
                (
                    y +
                    h / 2
                )
                /
                analysisCanvas.height,

                area:
                (
                    w *
                    h
                )
                /
                (
                    analysisCanvas.width *
                    analysisCanvas.height
                ),

                motion: 0,

                isNew: false

            };

        }
    );


    const used =
    new Set();


    current.forEach(
        object => {

            let closest =
            -1;


            let closestDistance =
            Infinity;


            previousObjects.forEach(
                (old, index) => {

                    if(
                        used.has(index)
                    )
                        return;


                    if(
                        old.className
                        !==
                        object.className
                    )
                        return;


                    const dx =
                    old.x -
                    object.x;


                    const dy =
                    old.y -
                    object.y;


                    const distance =

                    Math.sqrt(

                        dx * dx +

                        dy * dy

                    );


                    if(
                        distance <
                        closestDistance
                    ) {

                        closestDistance =
                        distance;

                        closest =
                        index;

                    }

                }
            );


            if(
                closest >= 0 &&
                closestDistance < .25
            ) {

                used.add(
                    closest
                );


                object.motion =

                Math.min(

                    1,

                    closestDistance

                    *

                    8

                    *

                    Number(
                        sliders.response.value
                    )

                );

            }

            else {

                object.isNew =
                true;

            }

        }
    );


    let totalMotion =
    0;


    let totalX =
    0;


    current.forEach(
        object => {

            totalMotion +=
            object.motion;


            totalX +=
            object.x;



            /*
               NEW OBJECT
            */

            if(object.isNew) {

                objectImpact(

                    object.x,

                    Math.min(
                        1,
                        object.area *
                        5
                    )

                );


                /*
                   새 객체가 들어왔을 때
                   가끔 soft key.
                */

                if(
                    Math.random()
                    <
                    .45
                ) {

                    softKey(

                        object.x,

                        object.y,

                        .4

                    );

                }

            }



            /*
               움직임.
            */

            if(
                object.motion >
                .055
            ) {

                glitch(

                    object.x,

                    object.motion

                );

            }



            /*
               중간 이상 움직임에서
               아주 가끔 맑은 음.
            */

            if(
                object.motion >
                .17

                &&

                Math.random()
                <
                .12
            ) {

                softKey(

                    object.x,

                    object.y,

                    object.motion

                );

            }

        }
    );


    const averageMotion =

    totalMotion /

    Math.max(
        1,
        current.length
    );


    const averageX =

    current.length

    ?

    totalX /
    current.length

    :

    .5;


    previousObjects =
    current;


    return {

        count:
        current.length,

        motion:
        averageMotion,

        x:
        averageX

    };

}



/* =========================================================
   CONTINUOUS SOUND
========================================================= */

function updateContinuousSound(
    analysis
) {

    if(!AC)
        return;


    const now =
    AC.currentTime;



    /* AMBIENT */

    const ambientLevel =

    Number(
        sliders.ambient.value
    );


    ambientGain.gain
    .setTargetAtTime(

        .055 *

        ambientLevel *

        (
            .8 +

            Math.min(
                .4,
                analysis.count *
                .04
            )
        ),

        now,

        1.2

    );



    /*
       TONE knob.
    */

    const tone =
    Number(
        sliders.tone.value
    );


    const baseCutoff =

    180 +

    Math.pow(
        tone,
        2
    )

    *

    4200;


    /*
       움직임이 생기면
       장이 살짝 열림.
    */

    ambientFilter.frequency
    .setTargetAtTime(

        baseCutoff

        +

        analysis.motion *
        2600,

        now,

        .7

    );



    /*
       DRIFT
    */

    const drift =
    Number(
        sliders.drift.value
    );


    ambientVoices.forEach(
        (voice,index) => {

            const movement =

            Math.sin(

                performance.now() /
                (
                    2400 +
                    index *
                    600
                )

            )

            *

            drift *

            14;


            voice.osc.detune
            .setTargetAtTime(

                voice.baseDetune

                +

                movement

                +

                analysis.motion *
                8 *
                (
                    index % 2
                    ?
                    1
                    :
                    -1
                ),

                now,

                .5

            );

        }
    );



    /* RADIO */

    const radio =
    Number(
        sliders.radio.value
    );


    const staticAmount =
    Number(
        sliders.radioStatic.value
    );


    radioGain.gain
    .setTargetAtTime(

        radio *

        (
            .006

            +

            staticAmount *
            .025

            +

            analysis.motion *
            .018
        ),

        now,

        .15

    );



    const radioFrequency =

    Number(
        sliders.radioFrequency.value
    );


    const frequency =

    350 +

    Math.pow(
        radioFrequency,
        2
    )

    *

    6500;


    /*
       움직임이 radio tuning을
       미세하게 흔듦.
    */

    radioFilter.frequency
    .setTargetAtTime(

        frequency

        +

        analysis.motion *
        1800,

        now,

        .2

    );


    radioOscillator.frequency
    .setTargetAtTime(

        600

        +

        radioFrequency *
        1800

        +

        analysis.motion *
        300,

        now,

        .25

    );


    objectMeter.textContent =
    analysis.count;


    motionMeter.textContent =
    analysis.motion.toFixed(2);

}



/* =========================================================
   DETECTION
========================================================= */

async function detectionLoop(
    timestamp
) {

    if(!running)
        return;


    if(
        video.paused ||
        video.ended
    )
        return;


    if(
        !detectionBusy

        &&

        timestamp -
        lastDetection

        >=

        DETECTION_INTERVAL
    ) {

        detectionBusy =
        true;


        lastDetection =
        timestamp;


        try {

            analysisCtx.drawImage(

                video,

                0,
                0,

                analysisCanvas.width,

                analysisCanvas.height

            );


            let result =

            await model.detect(

                analysisCanvas,

                12,

                .30

            );


            result =

            result

            .filter(
                object =>
                object.score >= .30
            )

            .sort(
                (a,b) =>

                (
                    b.bbox[2] *
                    b.bbox[3]
                )

                -

                (
                    a.bbox[2] *
                    a.bbox[3]
                )
            )

            .slice(
                0,
                12
            );


            predictions =
            result;


            const analysis =

            analyseObjects(
                result
            );


            updateContinuousSound(
                analysis
            );


            objectsElement.textContent =

            result.length

            ?

            result
            .map(
                item =>

                item.class

                +

                " "

                +

                Math.round(
                    item.score *
                    100
                )

                +

                "%"

            )
            .join(
                " · "
            )

            :

            "NO OBJECTS";


            detectionCount++;


            const now =
            performance.now();


            if(
                now -
                detectionStart
                >
                1000
            ) {

                detectionMeter.textContent =

                (

                    detectionCount /

                    (
                        (
                            now -
                            detectionStart
                        )
                        /
                        1000
                    )

                ).toFixed(1)

                +

                " Hz";


                detectionCount =
                0;


                detectionStart =
                now;

            }

        }

        catch(error) {

            console.error(error);

        }


        detectionBusy =
        false;

    }


    requestAnimationFrame(
        detectionLoop
    );

}



/* =========================================================
   VIDEO RENDER

   핵심:

   1. 전체 영상 흑백
   2. detection box 내부만 원본 컬러
   3. 컬러 부분 saturation 증가
   4. box border
========================================================= */

function renderVideo() {

    if(!running)
        return;


    if(
        video.paused ||
        video.ended
    )
        return;


    const W =
    visualCanvas.width;


    const H =
    visualCanvas.height;



    /*
       --------------------------------
       BACKGROUND = BLACK & WHITE
       --------------------------------
    */

    visualCtx.save();


    visualCtx.filter =

    "grayscale(100%) contrast(110%)";


    visualCtx.drawImage(

        video,

        0,
        0,

        W,
        H

    );


    visualCtx.restore();



    /*
       analysis 좌표 →
       원본 영상 좌표
    */

    const scaleX =

    W /
    analysisCanvas.width;


    const scaleY =

    H /
    analysisCanvas.height;


    const saturation =

    Number(
        sliders.color.value
    );



    predictions.forEach(
        object => {

            const [
                x,
                y,
                width,
                height
            ] =
            object.bbox;



            /*
               실제 출력 Canvas 좌표.
            */

            const dx =
            x *
            scaleX;


            const dy =
            y *
            scaleY;


            const dw =
            width *
            scaleX;


            const dh =
            height *
            scaleY;



            /*
               원본 VIDEO 좌표.

               이것이 이전 버전에서
               중요한 부분.
            */

            const sx =

            x /

            analysisCanvas.width

            *

            video.videoWidth;


            const sy =

            y /

            analysisCanvas.height

            *

            video.videoHeight;


            const sw =

            width /

            analysisCanvas.width

            *

            video.videoWidth;


            const sh =

            height /

            analysisCanvas.height

            *

            video.videoHeight;



            /*
               --------------------------------
               DETECTED AREA = COLOR
               --------------------------------
            */

            visualCtx.save();


            visualCtx.beginPath();


            visualCtx.rect(

                dx,
                dy,
                dw,
                dh

            );


            visualCtx.clip();


            /*
               높은 채도.
            */

            visualCtx.filter =

            `saturate(${saturation}) contrast(115%)`;


            visualCtx.drawImage(

                video,

                sx,
                sy,
                sw,
                sh,

                dx,
                dy,
                dw,
                dh

            );


            visualCtx.restore();



            /*
               --------------------------------
               BOX
               --------------------------------
            */

            visualCtx.strokeStyle =
            "rgba(255,255,255,.95)";


            visualCtx.lineWidth =

            Math.max(

                1.5,

                W /
                800

            );


            visualCtx.strokeRect(

                dx,
                dy,
                dw,
                dh

            );



            /*
               corner marks
            */

            const corner =

            Math.min(

                18,

                dw *
                .12,

                dh *
                .12

            );


            visualCtx.lineWidth =

            Math.max(

                2,

                W /
                600

            );


            /*
               TOP LEFT
            */

            visualCtx.beginPath();

            visualCtx.moveTo(
                dx,
                dy + corner
            );

            visualCtx.lineTo(
                dx,
                dy
            );

            visualCtx.lineTo(
                dx + corner,
                dy
            );

            visualCtx.stroke();



            /*
               LABEL
            */

            const fontSize =

            Math.max(

                11,

                W /
                90

            );


            visualCtx.font =

            `${fontSize}px monospace`;


            const label =

            object.class

            +

            " "

            +

            Math.round(
                object.score *
                100
            )

            +

            "%";


            const textWidth =

            visualCtx
            .measureText(
                label
            )
            .width;


            visualCtx.fillStyle =
            "rgba(0,0,0,.85)";


            const labelY =

            Math.max(

                fontSize + 8,

                dy

            );


            visualCtx.fillRect(

                dx,

                labelY -
                fontSize -
                8,

                textWidth +
                12,

                fontSize +
                8

            );


            visualCtx.fillStyle =
            "white";


            visualCtx.fillText(

                label,

                dx + 6,

                labelY - 5

            );

        }
    );


    requestAnimationFrame(
        renderVideo
    );

}



/* =========================================================
   PLAY
========================================================= */

playButton.addEventListener(
    "click",
    async () => {

        if(
            !videoReady ||
            !modelReady
        )
            return;


        createAudioEngine();


        if(
            AC.state
            ===
            "suspended"
        ) {

            await AC.resume();

        }


        updateVideoAudio();


        video.currentTime =
        0;


        predictions =
        [];


        previousObjects =
        [];


        detectionCount =
        0;


        detectionStart =
        performance.now();


        lastDetection =
        0;


        try {

            await video.play();

        }

        catch(error) {

            console.error(error);

            statusElement.textContent =
            "PLAYBACK ERROR";

            return;

        }


        running =
        true;


        playButton.disabled =
        true;


        stopButton.disabled =
        false;


        statusElement.textContent =
        "GENERATING";


        /*
           Ambient fade in.
        */

        ambientGain.gain
        .setTargetAtTime(

            .04 *

            Number(
                sliders.ambient.value
            ),

            AC.currentTime,

            1.5

        );


        requestAnimationFrame(
            renderVideo
        );


        requestAnimationFrame(
            detectionLoop
        );

    }
);



/* =========================================================
   STOP
========================================================= */

function stopEverything() {

    running =
    false;


    video.pause();


    if(AC) {

        ambientGain.gain
        .setTargetAtTime(

            0,

            AC.currentTime,

            .2

        );


        radioGain.gain
        .setTargetAtTime(

            0,

            AC.currentTime,

            .1

        );

    }


    stopButton.disabled =
    true;


    updatePlayButton();


    statusElement.textContent =
    "STOPPED";

}


stopButton.addEventListener(
    "click",
    stopEverything
);



/* =========================================================
   END
========================================================= */

video.addEventListener(
    "ended",
    () => {

        running =
        false;


        if(AC) {

            ambientGain.gain
            .setTargetAtTime(

                0,

                AC.currentTime,

                1

            );


            radioGain.gain
            .setTargetAtTime(

                0,

                AC.currentTime,

                .5

            );

        }


        stopButton.disabled =
        true;


        updatePlayButton();


        statusElement.textContent =
        "FINISHED";

    }
);



/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(objectURL) {

            URL.revokeObjectURL(
                objectURL
            );

        }

    }
);
