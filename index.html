<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ink Breath AR — Spatial Live Drawing</title>
  <style>
    :root {
      --paper: #f3ead8;
      --ink: #111111;
      --panel: rgba(247, 239, 223, 0.86);
      --line: rgba(30, 24, 18, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080705;
      font-family: ui-serif, "Apple SD Gothic Neo", "Noto Serif KR", Georgia, serif;
      touch-action: none;
      color: #1b1712;
    }

    #fallbackVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
      pointer-events: none;
      background: #000;
    }

    #cameraFx {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      opacity: 0;
      z-index: 1;
      pointer-events: none;
      background: #000;
      transition: opacity 0.3s ease;
    }

    body.fallback-on #cameraFx { opacity: 1; }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }

    .ui {
      position: fixed;
      left: 14px;
      top: 14px;
      width: min(360px, calc(100vw - 28px));
      padding: 14px 14px 12px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.2);
      user-select: none;
      z-index: 10;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .ui.hidden {
      transform: translateY(calc(-100% - 28px));
      opacity: 0.12;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: -0.03em;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      opacity: 0.74;
    }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr 44px;
      gap: 8px;
      align-items: center;
      margin: 8px 0;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #2a2119;
    }

    .value {
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: 0.72;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(30, 24, 18, 0.2);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.72);
      color: #1b1712;
      padding: 9px 8px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    button.primary {
      background: rgba(29, 23, 17, 0.9);
      color: #f9eedb;
    }

    button:active { transform: translateY(1px); }

    .status {
      margin-top: 9px;
      padding: 8px 9px;
      border-radius: 12px;
      background: rgba(255,255,255,0.42);
      font-size: 11px;
      line-height: 1.45;
      opacity: 0.84;
    }

    .hint {
      position: fixed;
      right: 14px;
      bottom: 12px;
      max-width: min(560px, calc(100vw - 28px));
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(247, 239, 223, 0.72);
      border: 1px solid rgba(30, 24, 18, 0.14);
      backdrop-filter: blur(10px);
      font-size: 12px;
      line-height: 1.5;
      opacity: 0.82;
      user-select: none;
      z-index: 10;
    }

    @media (max-width: 680px) {
      .ui { left: 10px; top: 10px; width: calc(100vw - 20px); }
      .hint { left: 10px; right: 10px; bottom: 10px; }
      .buttons { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <video id="fallbackVideo" playsinline muted autoplay></video>
  <canvas id="cameraFx"></canvas>

  <section class="ui" id="ui">
    <h1>Ink Breath AR</h1>
    <p class="sub">핸드폰 카메라/AR 공간 위에 먹선 입자를 3D로 남기는 라이브 드로잉 테스트.</p>

    <div class="row">
      <label for="brushSize">붓 크기</label>
      <input id="brushSize" type="range" min="0.01" max="0.18" step="0.005" value="0.055" />
      <span class="value" id="brushSizeVal">.055</span>
    </div>

    <div class="row">
      <label for="inkPower">먹 농도</label>
      <input id="inkPower" type="range" min="0.15" max="1" step="0.01" value="0.76" />
      <span class="value" id="inkPowerVal">.76</span>
    </div>

    <div class="row">
      <label for="bleedPower">번짐</label>
      <input id="bleedPower" type="range" min="0" max="1" step="0.01" value="0.42" />
      <span class="value" id="bleedPowerVal">.42</span>
    </div>

    <div class="row">
      <label for="depthPower">공간 깊이</label>
      <input id="depthPower" type="range" min="0.3" max="4" step="0.01" value="1.55" />
      <span class="value" id="depthPowerVal">1.55</span>
    </div>

    <div class="row">
      <label for="windPower">기류</label>
      <input id="windPower" type="range" min="0" max="2" step="0.01" value="0.7" />
      <span class="value" id="windPowerVal">.70</span>
    </div>

    <div class="row">
      <label for="fxMode">카메라 효과</label>
      <select id="fxMode" style="width:100%;border-radius:10px;border:1px solid rgba(30,24,18,.2);background:rgba(255,252,243,.72);padding:7px;font-family:inherit;font-size:12px;">
        <option value="ink">먹화/흑백</option>
        <option value="game">애니메이션 게임공간</option>
        <option value="edge">윤곽선 공간</option>
      </select>
      <span class="value">FX</span>
    </div>

    <div class="buttons">
      <button id="startBtn" class="primary">AR 시작</button>
      <button id="fallbackBtn">카메라 모드</button>
      <button id="clearBtn">비우기</button>
      <button id="cloudBtn">먹구름</button>
      <button id="saveBtn">캡처</button>
      <button id="hideBtn">UI 숨김</button>
    </div>

    <div class="status" id="status">HTTPS 환경에서 실행하세요. GitHub Pages는 가능. Android Chrome은 WebXR AR, iPhone은 카메라 모드로 테스트하세요.</div>
  </section>

  <div class="hint">AR 시작 후 화면을 터치/드래그하면 카메라 앞 공간에 먹선이 생깁니다. 핸드폰을 움직이면 선들이 공간에 떠 있는 것처럼 보입니다.</div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { ARButton } from 'https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js';

    const ui = document.getElementById('ui');
    const statusEl = document.getElementById('status');
    const fallbackVideo = document.getElementById('fallbackVideo');
    const cameraFx = document.getElementById('cameraFx');
    const fxCtx = cameraFx.getContext('2d', { willReadFrequently: true });
    const fxMode = document.getElementById('fxMode');

    const controls = {
      brushSize: document.getElementById('brushSize'),
      inkPower: document.getElementById('inkPower'),
      bleedPower: document.getElementById('bleedPower'),
      depthPower: document.getElementById('depthPower'),
      windPower: document.getElementById('windPower')
    };

    const values = {
      brushSize: document.getElementById('brushSizeVal'),
      inkPower: document.getElementById('inkPowerVal'),
      bleedPower: document.getElementById('bleedPowerVal'),
      depthPower: document.getElementById('depthPowerVal'),
      windPower: document.getElementById('windPowerVal')
    };

    const val = (name) => parseFloat(controls[name].value);
    const rand = (min, max) => min + Math.random() * (max - min);
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    function syncLabels() {
      values.brushSize.textContent = val('brushSize').toFixed(3).replace('0.', '.');
      values.inkPower.textContent = val('inkPower').toFixed(2).replace('0.', '.');
      values.bleedPower.textContent = val('bleedPower').toFixed(2).replace('0.', '.');
      values.depthPower.textContent = val('depthPower').toFixed(2);
      values.windPower.textContent = val('windPower').toFixed(2).replace('0.', '.');
    }
    Object.values(controls).forEach(input => input.addEventListener('input', syncLabels));
    syncLabels();

    let scene, camera, renderer, raycaster;
    let reticle;
    let inkGroup;
    let particles = [];
    let strokes = [];
    let pointerDown = false;
    let lastPoint = null;
    let fallbackMode = false;
    let fallbackStream = null;
    let fxFrame = 0;
    let clock = new THREE.Clock();
    let lastSpawnTime = 0;

    initThree();
    animate();

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function initThree() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 40);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.domElement.style.zIndex = 2;
      document.body.appendChild(renderer.domElement);

      const hemi = new THREE.HemisphereLight(0xfff3dd, 0x1a1714, 2.0);
      scene.add(hemi);

      const dir = new THREE.DirectionalLight(0xfff3dd, 1.6);
      dir.position.set(1.4, 2.2, 1.1);
      scene.add(dir);

      inkGroup = new THREE.Group();
      scene.add(inkGroup);

      raycaster = new THREE.Raycaster();

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.045, 0.052, 48).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x111111, transparent: true, opacity: 0.48 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      makePaperGhosts();
      bindEvents();
      window.addEventListener('resize', onResize);
    }

    function makePaperGhosts() {
      const geo = new THREE.BufferGeometry();
      const count = 800;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        positions[i * 3 + 0] = rand(-4, 4);
        positions[i * 3 + 1] = rand(-2, 2.2);
        positions[i * 3 + 2] = rand(-4, -0.2);
        const c = rand(0.72, 0.96);
        colors[i * 3 + 0] = c;
        colors[i * 3 + 1] = c * 0.9;
        colors[i * 3 + 2] = c * 0.72;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 0.006, vertexColors: true, transparent: true, opacity: 0.18, depthWrite: false });
      const dust = new THREE.Points(geo, mat);
      scene.add(dust);
    }

    function bindEvents() {
      const el = renderer.domElement;
      el.addEventListener('pointerdown', onPointerDown);
      el.addEventListener('pointermove', onPointerMove);
      window.addEventListener('pointerup', onPointerUp);

      document.getElementById('startBtn').addEventListener('click', startAR);
      document.getElementById('fallbackBtn').addEventListener('click', startFallbackCamera);
      document.getElementById('clearBtn').addEventListener('click', clearInk);
      document.getElementById('cloudBtn').addEventListener('click', makeInkCloud);
      document.getElementById('saveBtn').addEventListener('click', saveCapture);
      document.getElementById('hideBtn').addEventListener('click', () => ui.classList.toggle('hidden'));

      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if (k === 'h') ui.classList.toggle('hidden');
        if (k === 'c') clearInk();
        if (k === 'g') makeInkCloud();
      });
    }

    async function startAR() {
      if (!navigator.xr) {
        setStatus('이 브라우저는 WebXR AR을 지원하지 않습니다. 카메라 모드로 전환하세요. Android Chrome 권장.');
        return;
      }

      const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
      if (!supported) {
        setStatus('immersive-ar가 지원되지 않습니다. Android Chrome 또는 카메라 모드를 사용하세요.');
        return;
      }

      const button = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'local-floor'],
        domOverlay: { root: document.body }
      });

      button.style.display = 'none';
      document.body.appendChild(button);
      button.click();

      fallbackMode = false;
      document.body.classList.remove('fallback-on');
      setStatus('AR 세션 진입 중. 바닥/벽을 비추고 화면을 드래그해 공간에 먹선을 남기세요.');
    }

    async function startFallbackCamera() {
      try {
        fallbackStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        fallbackVideo.srcObject = fallbackStream;
        await fallbackVideo.play().catch(() => {});
        resizeFxCanvas();
        document.body.classList.add('fallback-on');
        fallbackMode = true;
        camera.position.set(0, 0, 0);
        setStatus('카메라 모드입니다. 실제 AR 고정은 아니지만, 카메라 화면 위에 3D 먹선이 생성됩니다. iPhone 테스트용.');
      } catch (err) {
        setStatus('카메라 접근 실패. HTTPS 또는 브라우저 권한을 확인하세요.');
      }
    }

    function screenToWorld(x, y) {
      const ndc = new THREE.Vector2(
        (x / window.innerWidth) * 2 - 1,
        -(y / window.innerHeight) * 2 + 1
      );

      raycaster.setFromCamera(ndc, camera);

      if (renderer.xr.isPresenting && reticle.visible) {
        const base = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
        const dir = raycaster.ray.direction.clone();
        return base.clone().add(dir.multiplyScalar(rand(0.02, 0.34) * val('depthPower')));
      }

      const distance = 1.1 + val('depthPower') * 0.45;
      return raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(distance));
    }

    function onPointerDown(e) {
      pointerDown = true;
      lastPoint = screenToWorld(e.clientX, e.clientY);
      spawnInkAt(lastPoint, 1.0);
      e.preventDefault();
    }

    function onPointerMove(e) {
      if (!pointerDown) return;
      const now = performance.now();
      if (now - lastSpawnTime < 14) return;
      lastSpawnTime = now;

      const p = screenToWorld(e.clientX, e.clientY);
      if (lastPoint) drawSpatialSegment(lastPoint, p);
      lastPoint = p;
      e.preventDefault();
    }

    function onPointerUp() {
      pointerDown = false;
      lastPoint = null;
    }

    function drawSpatialSegment(a, b) {
      const d = a.distanceTo(b);
      const steps = Math.max(2, Math.ceil(d / 0.018));
      const curvePoints = [];
      const mid = a.clone().lerp(b, 0.5);
      mid.x += rand(-0.025, 0.025) * val('depthPower');
      mid.y += rand(-0.025, 0.025) * val('depthPower');
      mid.z += rand(-0.025, 0.025) * val('depthPower');

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const p = new THREE.Vector3()
          .copy(a).multiplyScalar((1 - t) * (1 - t))
          .add(mid.clone().multiplyScalar(2 * (1 - t) * t))
          .add(b.clone().multiplyScalar(t * t));
        curvePoints.push(p);
        spawnInkAt(p, clamp(1.2 - d * 2.5, 0.42, 1.25));
      }

      const geo = new THREE.BufferGeometry().setFromPoints(curvePoints);
      const mat = new THREE.LineBasicMaterial({
        color: 0x050403,
        transparent: true,
        opacity: val('inkPower') * 0.62,
        depthWrite: false
      });
      const line = new THREE.Line(geo, mat);
      line.userData = { age: 0, maxAge: 1000 + Math.random() * 1400 };
      inkGroup.add(line);
      strokes.push(line);
      if (strokes.length > 900) {
        const old = strokes.shift();
        inkGroup.remove(old);
        old.geometry.dispose();
        old.material.dispose();
      }
    }

    function createInkSpriteTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const g = c.getContext('2d');
      const grd = g.createRadialGradient(64, 64, 2, 64, 64, 62);
      grd.addColorStop(0, 'rgba(0,0,0,0.95)');
      grd.addColorStop(0.28, 'rgba(5,4,3,0.42)');
      grd.addColorStop(0.62, 'rgba(30,24,18,0.13)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, 128, 128);

      for (let i = 0; i < 130; i++) {
        const x = rand(12, 116);
        const y = rand(12, 116);
        const r = rand(0.5, 4.5);
        g.fillStyle = `rgba(0,0,0,${rand(0.02, 0.15)})`;
        g.beginPath();
        g.ellipse(x, y, r * rand(0.5, 1.8), r, rand(0, Math.PI), 0, Math.PI * 2);
        g.fill();
      }

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const inkTexture = createInkSpriteTexture();

    function spawnInkAt(pos, pressure = 1) {
      const count = Math.floor(5 + val('bleedPower') * 18);
      const brush = val('brushSize');
      for (let i = 0; i < count; i++) {
        const material = new THREE.SpriteMaterial({
          map: inkTexture,
          color: new THREE.Color(rand(0.02, 0.12), rand(0.018, 0.1), rand(0.012, 0.075)),
          transparent: true,
          opacity: rand(0.08, 0.48) * val('inkPower') * pressure,
          depthWrite: false
        });
        const sprite = new THREE.Sprite(material);
        const spread = brush * rand(0.08, 1.3) * (1 + val('bleedPower'));
        sprite.position.copy(pos).add(new THREE.Vector3(rand(-spread, spread), rand(-spread, spread), rand(-spread, spread)));
        const s = brush * rand(0.28, 1.8) * pressure;
        sprite.scale.set(s, s * rand(0.62, 1.48), 1);
        sprite.material.rotation = rand(0, Math.PI * 2);
        sprite.userData = {
          age: 0,
          maxAge: rand(380, 1600),
          vx: rand(-0.0008, 0.0008) * val('windPower'),
          vy: rand(-0.00035, 0.0012) * val('windPower'),
          vz: rand(-0.0008, 0.0008) * val('windPower'),
          breathe: rand(0.3, 1.9),
          baseScale: sprite.scale.clone(),
          baseOpacity: sprite.material.opacity
        };
        inkGroup.add(sprite);
        particles.push(sprite);
      }

      if (particles.length > 4800) {
        const removeCount = particles.length - 4800;
        for (let i = 0; i < removeCount; i++) removeParticle(particles.shift());
      }
    }

    function makeInkCloud() {
      const center = screenToWorld(window.innerWidth * 0.5, window.innerHeight * 0.52);
      for (let i = 0; i < 260; i++) {
        const p = center.clone().add(new THREE.Vector3(rand(-0.8, 0.8), rand(-0.45, 0.45), rand(-0.8, 0.8)));
        spawnInkAt(p, rand(0.25, 0.9));
      }
      setStatus('공간 중앙에 먹구름을 생성했습니다. 핸드폰을 움직여 입자 깊이를 확인하세요.');
    }

    function updateInk(dt, elapsed) {
      const wind = val('windPower');
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const u = p.userData;
        u.age++;
        const life = 1 - u.age / u.maxAge;
        const flow = Math.sin(p.position.x * 3.1 + elapsed * 0.7 * u.breathe) + Math.cos(p.position.z * 4.2 - elapsed * 0.5);

        p.position.x += u.vx + Math.cos(flow) * 0.00035 * wind;
        p.position.y += u.vy + Math.sin(flow * 0.7) * 0.00022 * wind;
        p.position.z += u.vz + Math.sin(flow) * 0.00035 * wind;

        const pulse = 1 + Math.sin(elapsed * u.breathe + p.position.x * 3) * 0.08;
        const bleed = 1 + (1 - life) * val('bleedPower') * 1.7;
        p.scale.copy(u.baseScale).multiplyScalar(pulse * bleed);
        p.material.opacity = Math.max(0, u.baseOpacity * Math.pow(life, 0.55));
        p.material.rotation += 0.0015 * u.breathe;

        if (u.age > u.maxAge) {
          removeParticle(p);
          particles.splice(i, 1);
        }
      }

      for (let i = strokes.length - 1; i >= 0; i--) {
        const s = strokes[i];
        s.userData.age++;
        const life = 1 - s.userData.age / s.userData.maxAge;
        s.material.opacity = Math.max(0, val('inkPower') * 0.5 * life);
        if (s.userData.age > s.userData.maxAge) {
          inkGroup.remove(s);
          s.geometry.dispose();
          s.material.dispose();
          strokes.splice(i, 1);
        }
      }
    }

    function removeParticle(p) {
      inkGroup.remove(p);
      p.material.dispose();
    }

    function clearInk() {
      for (const p of particles) removeParticle(p);
      for (const s of strokes) {
        inkGroup.remove(s);
        s.geometry.dispose();
        s.material.dispose();
      }
      particles = [];
      strokes = [];
      setStatus('공간의 먹선을 비웠습니다.');
    }

    function saveCapture() {
      const a = document.createElement('a');
      a.download = `ink-breath-ar-${Date.now()}.png`;
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      resizeFxCanvas();
    }

    function resizeFxCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cameraFx.width = Math.floor(window.innerWidth * dpr);
      cameraFx.height = Math.floor(window.innerHeight * dpr);
      fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function drawCameraFx() {
      if (!fallbackMode || fallbackVideo.readyState < 2) return;

      const w = window.innerWidth;
      const h = window.innerHeight;
      const mode = fxMode.value;
      fxFrame++;

      fxCtx.save();
      fxCtx.clearRect(0, 0, w, h);
      fxCtx.translate(w, 0);
      fxCtx.scale(-1, 1);
      fxCtx.drawImage(fallbackVideo, 0, 0, w, h);
      fxCtx.restore();

      const img = fxCtx.getImageData(0, 0, w, h);
      const d = img.data;

      if (mode === 'ink') {
        for (let i = 0; i < d.length; i += 4) {
          const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
          const paper = 236 + Math.sin((i / 4) * 0.013 + fxFrame * 0.03) * 7;
          const ink = gray < 88 ? 20 : gray < 145 ? 76 : gray < 205 ? 174 : paper;
          d[i] = ink;
          d[i + 1] = ink * 0.94;
          d[i + 2] = ink * 0.82;
        }
      }

      if (mode === 'game') {
        for (let i = 0; i < d.length; i += 4) {
          const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
          const level = Math.floor(gray / 42) * 42;
          const pulse = Math.sin(fxFrame * 0.04 + i * 0.00003) * 10;
          d[i] = Math.min(255, level * 0.65 + 20 + pulse);
          d[i + 1] = Math.min(255, level * 0.78 + 28 + pulse);
          d[i + 2] = Math.min(255, level * 1.05 + 55 + pulse);
        }
      }

      if (mode === 'edge') {
        const copy = new Uint8ClampedArray(d);
        const stride = w * 4;
        for (let y = 1; y < h - 1; y += 1) {
          for (let x = 1; x < w - 1; x += 1) {
            const i = (y * w + x) * 4;
            const gx = Math.abs(copy[i - 4] - copy[i + 4]) + Math.abs(copy[i - 3] - copy[i + 5]) + Math.abs(copy[i - 2] - copy[i + 6]);
            const gy = Math.abs(copy[i - stride] - copy[i + stride]) + Math.abs(copy[i - stride + 1] - copy[i + stride + 1]) + Math.abs(copy[i - stride + 2] - copy[i + stride + 2]);
            const edge = Math.min(255, (gx + gy) * 1.4);
            const bg = 18 + Math.sin((x + y + fxFrame) * 0.025) * 8;
            d[i] = bg + edge * 0.15;
            d[i + 1] = bg + edge * 0.38;
            d[i + 2] = bg + edge * 0.7;
          }
        }
      }

      fxCtx.putImageData(img, 0, 0);

      if (mode === 'game' || mode === 'edge') {
        fxCtx.save();
        fxCtx.globalAlpha = mode === 'game' ? 0.16 : 0.2;
        fxCtx.strokeStyle = mode === 'game' ? '#ffffff' : '#8fd3ff';
        fxCtx.lineWidth = 1;
        const grid = mode === 'game' ? 54 : 38;
        const offset = (fxFrame * 0.45) % grid;
        for (let x = -grid + offset; x < w + grid; x += grid) {
          fxCtx.beginPath();
          fxCtx.moveTo(x, 0);
          fxCtx.lineTo(x + Math.sin(fxFrame * 0.02 + x) * 18, h);
          fxCtx.stroke();
        }
        for (let y = -grid + offset; y < h + grid; y += grid) {
          fxCtx.beginPath();
          fxCtx.moveTo(0, y);
          fxCtx.lineTo(w, y + Math.cos(fxFrame * 0.02 + y) * 18);
          fxCtx.stroke();
        }
        fxCtx.restore();
      }

      if (mode === 'ink') {
        fxCtx.save();
        fxCtx.globalCompositeOperation = 'multiply';
        fxCtx.globalAlpha = 0.12;
        for (let i = 0; i < 42; i++) {
          fxCtx.beginPath();
          fxCtx.ellipse(Math.random() * w, Math.random() * h, Math.random() * 70, Math.random() * 18, Math.random() * Math.PI, 0, Math.PI * 2);
          fxCtx.fillStyle = '#1a1209';
          fxCtx.fill();
        }
        fxCtx.restore();
      }
    }

    function updateReticle(frame) {
      if (!renderer.xr.isPresenting) {
        reticle.visible = false;
        return;
      }

      const session = renderer.xr.getSession();
      if (!session) return;

      // 간단 테스트용: hit-test 초기화가 브라우저별로 달라서,
      // 여기서는 카메라 앞 1m 지점에 가상 reticle을 둔다.
      // 실제 바닥 고정 hit-test는 후속 버전에서 확장 가능.
      const cam = renderer.xr.getCamera(camera);
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(cam.quaternion);
      const pos = cam.position.clone().add(dir.multiplyScalar(1.0));
      reticle.position.copy(pos);
      reticle.quaternion.copy(cam.quaternion);
      reticle.updateMatrix();
      reticle.visible = true;
    }

    function animate() {
      renderer.setAnimationLoop((time, frame) => {
        const dt = clock.getDelta();
        const elapsed = clock.elapsedTime;
        updateReticle(frame);
        drawCameraFx();
        updateInk(dt, elapsed);

        if (fallbackMode) {
          camera.position.x = Math.sin(elapsed * 0.18) * 0.025;
          camera.position.y = Math.sin(elapsed * 0.13) * 0.015;
          camera.lookAt(0, 0, -1);
        }

        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
