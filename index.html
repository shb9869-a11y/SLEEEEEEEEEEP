<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Liquid Spark Camera</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  canvas{display:block;width:100vw;height:100vh}
  #ui{
    position:fixed;left:14px;top:14px;z-index:10;
    color:#fff;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:rgba(0,0,0,.38);backdrop-filter:blur(8px);
    padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12)
  }
  #ui b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<div id="ui">
  <b>LIQUID SPARK CAMERA</b>
  webcam → ~180k GPU particles → liquid wobble
</div>
<canvas id="c"></canvas>
<video id="v" autoplay playsinline muted style="display:none"></video>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', {
  antialias:false, alpha:false, premultipliedAlpha:false
});
if (!gl) { alert('WebGL not supported'); throw new Error('WebGL'); }

const DPR = Math.min(devicePixelRatio || 1, 2);
function resize(){
  canvas.width = innerWidth * DPR;
  canvas.height = innerHeight * DPR;
  gl.viewport(0,0,canvas.width,canvas.height);
}
addEventListener('resize', resize); resize();

const vert = `
attribute vec2 a_pos;
uniform float u_time;
uniform vec2 u_res;
uniform sampler2D u_cam;
varying float v_a;

float hash(vec2 p){
  return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123);
}
float noise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  float a = hash(i);
  float b = hash(i + vec2(1.,0.));
  float c = hash(i + vec2(0.,1.));
  float d = hash(i + vec2(1.,1.));
  vec2 u = f*f*(3.-2.*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.-u.x) + (d-b)*u.x*u.y;
}
vec2 flow(vec2 p){
  float t = u_time * 0.12;
  float n1 = noise(p*2.2 + vec2(t, -t));
  float n2 = noise(p*2.2 + vec2(-t, t));
  float a = (n1 - 0.5) * 6.28318;
  return vec2(cos(a), sin(a)) * (0.02 + n2*0.03);
}

void main(){
  vec2 uv = a_pos * 0.5 + 0.5;

  // 카메라 밝기
  vec4 cam = texture2D(u_cam, vec2(uv.x, 1.0-uv.y));
  float lum = dot(cam.rgb, vec3(0.299,0.587,0.114));

  // 액체 같은 꿀렁임
  vec2 p = a_pos;
  vec2 f = flow(p + flow(p*1.7));
  p += f * (0.8 + lum*1.6);

  // 미세 떨림
  float j = noise(p*40.0 + u_time*1.8) - 0.5;
  p += vec2(j, -j) * 0.006;

  // 사람 형상 유지(밝을수록 안쪽으로 수축)
  p *= mix(1.18, 0.86, smoothstep(0.08, 0.9, lum));

  gl_Position = vec4(p, 0.0, 1.0);

  float size = mix(0.8, 2.6, lum);
  size *= (u_res.y / 900.0);
  gl_PointSize = size;

  v_a = smoothstep(0.04, 0.9, lum);
}`;

const frag = `
precision mediump float;
varying float v_a;

void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = dot(c,c);
  float m = exp(-18.0*d);      // 부드러운 스파클
  float a = m * v_a;
  gl_FragColor = vec4(vec3(1.0), a);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    throw new Error(gl.getShaderInfoLog(s));
  }
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// 입자 생성 (~180k)
const GRID = 424; // 179,776 particles
const data = new Float32Array(GRID*GRID*2);
let k=0;
for(let y=0;y<GRID;y++){
  for(let x=0;x<GRID;x++){
    data[k++] = x/(GRID-1)*2-1;
    data[k++] = y/(GRID-1)*2-1;
  }
}

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

const loc = gl.getAttribLocation(prog, 'a_pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uTime = gl.getUniformLocation(prog, 'u_time');
const uRes  = gl.getUniformLocation(prog, 'u_res');
const uCam  = gl.getUniformLocation(prog, 'u_cam');

// 카메라 텍스처
const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,2,2,0,gl.RGBA,gl.UNSIGNED_BYTE,
  new Uint8Array([0,0,0,255, 0,0,0,255, 0,0,0,255, 0,0,0,255]));

const video = document.getElementById('v');

(async()=>{
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        facingMode:'user',
        width:{ideal:1280},
        height:{ideal:720}
      },
      audio:false
    });
    video.srcObject = stream;
    await video.play();
  }catch(err){
    document.getElementById('ui').innerHTML =
      '<b>Camera permission denied</b><br>' + err.message;
  }
})();

gl.enable(gl.BLEND);
gl.blendFunc(gl.ONE, gl.ONE); // additive bloom-like glow
gl.clearColor(0,0,0,1);

function frame(t){
  t *= 0.001;

  if(video.readyState >= 2){
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    gl.uniform1i(uCam, 0);
  }

  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform1f(uTime, t);
  gl.uniform2f(uRes, canvas.width, canvas.height);

  gl.drawArrays(gl.POINTS, 0, GRID*GRID);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
