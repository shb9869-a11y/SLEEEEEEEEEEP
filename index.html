<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SCREEN PUSH — CULTUREHUB</title>
<meta name="theme-color" content="#000000">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>

<script>
  // ✅ 룸 아이디 고정
  const ROOM_ID = "CULTUREHUB";

  // ✅ VDO.Ninja가 "카메라" 대신 "화면공유"를 바로 요청하게 하는 핵심: &screenshare
  // clean/autostart/noaudio 등은 취향 옵션
  const SRC =
    `https://vdo.ninja/?push=${encodeURIComponent(ROOM_ID)}` +
    `&screenshare&clean&autostart&noaudio&codec=vp8`;

  const f = document.createElement('iframe');
  f.allow = "display-capture; autoplay; camera; microphone; fullscreen";
  f.referrerPolicy = "no-referrer";
  f.src = SRC;
  document.body.appendChild(f);
</script>

</body>
</html>
