<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary Human Detector</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }

    #wrap {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
    }

    video {
      display: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #binaryCanvas {
      z-index: 1;
      image-rendering: pixelated;
    }

    #boxCanvas {
      z-index: 2;
      pointer-events: none;
    }

    #ui {
      position: fixed;
      z-index: 10;
      left: 16px;
      top: 16px;
      color: #008cff;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(0, 140, 255, 0.7);
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      text-shadow: 0 0 8px #008cff;
      max-width: calc(100vw - 32px);
    }

    #startBtn {
      position: fixed;
      z-index: 20;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #000;
      color: #008cff;
      border: 1px solid #008cff;
      padding: 18px 26px;
      font-size: 16px;
      font-family: monospace;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(0, 140, 255, 0.55);
    }

    #startBtn:hover {
      background: #001522;
    }
  </style>
</head>

<body>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="binaryCanvas"></canvas>
    <canvas id="boxCanvas"></canvas>
  </div>

  <div id="ui">
    STATUS: READY<br>
    반드시 https:// 또는 localhost에서 실행
  </div>

  <button id="startBtn">START CAMERA</button>

  <script>
    const video = document.getElementById("video");
    const binaryCanvas = document.getElementById("binaryCanvas");
    const binaryCtx = binaryCanvas.getContext("2d", { willReadFrequently: true });

    const boxCanvas = document.getElementById("boxCanvas");
    const boxCtx = boxCanvas.getContext("2d");

    const ui = document.getElementById("ui");
    const startBtn = document.getElementById("startBtn");

    let model = null;
    let isRunning = false;

    const binaryCols = 115;
    const brightnessThreshold = 115;
    const detectionInterval = 140;

    function setStatus(text) {
      ui.innerHTML = text;
    }

    function resize() {
      binaryCanvas.width = window.innerWidth;
      binaryCanvas.height = window.innerHeight;
      boxCanvas.width = window.innerWidth;
      boxCanvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resize);
    resize();

    async function start() {
      try {
        startBtn.style.display = "none";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("이 주소에서는 카메라 API를 사용할 수 없음. https:// 또는 localhost로 열어야 함.");
        }

        setStatus("STATUS: LOADING AI MODEL...");

        model = await cocoSsd.load();

        setStatus("STATUS: REQUESTING CAMERA PERMISSION...");

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        await video.play();

        isRunning = true;

        setStatus("STATUS: RUNNING<br>PERSON: 0");

        drawBinary();
        detectLoop();

      } catch (err) {
        console.error(err);

        startBtn.style.display = "block";
        startBtn.innerText = "RETRY CAMERA";

        setStatus(
          "STATUS: CAMERA ERROR<br><br>" +
          String(err.name || "Error") + "<br>" +
          String(err.message || err) + "<br><br>" +
          "해결: https:// 주소 또는 http://localhost 에서 열기"
        );
      }
    }

    startBtn.addEventListener("click", start);

    function drawBinary() {
      if (!isRunning) return;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      if (!vw || !vh) {
        requestAnimationFrame(drawBinary);
        return;
      }

      const smallW = binaryCols;
      const smallH = Math.floor(binaryCols * (vh / vw));

      const tempCanvas = document.createElement("canvas");
      const tempCtx = tempCanvas.getContext("2d", { willReadFrequently: true });

      tempCanvas.width = smallW;
      tempCanvas.height = smallH;

      tempCtx.drawImage(video, 0, 0, smallW, smallH);

      const img = tempCtx.getImageData(0, 0, smallW, smallH);
      const data = img.data;

      binaryCtx.clearRect(0, 0, binaryCanvas.width, binaryCanvas.height);
      binaryCtx.fillStyle = "#000";
      binaryCtx.fillRect(0, 0, binaryCanvas.width, binaryCanvas.height);

      const cellW = binaryCanvas.width / smallW;
      const cellH = binaryCanvas.height / smallH;

      binaryCtx.font = `${Math.ceil(cellH * 1.25)}px monospace`;
      binaryCtx.textAlign = "center";
      binaryCtx.textBaseline = "middle";

      for (let y = 0; y < smallH; y++) {
        for (let x = 0; x < smallW; x++) {
          const i = (y * smallW + x) * 4;

          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];

          const brightness = (r + g + b) / 3;
          const bit = brightness > brightnessThreshold ? "1" : "0";

          const alpha = brightness / 255;

          if (bit === "1") {
            binaryCtx.fillStyle = `rgba(0, 255, 190, ${0.25 + alpha * 0.75})`;
          } else {
            binaryCtx.fillStyle = `rgba(0, 70, 255, ${0.18 + alpha * 0.5})`;
          }

          binaryCtx.fillText(
            bit,
            x * cellW + cellW / 2,
            y * cellH + cellH / 2
          );
        }
      }

      requestAnimationFrame(drawBinary);
    }

    async function detectLoop() {
      if (!isRunning || !model) return;

      try {
        const predictions = await model.detect(video);

        boxCtx.clearRect(0, 0, boxCanvas.width, boxCanvas.height);

        const scaleX = boxCanvas.width / video.videoWidth;
        const scaleY = boxCanvas.height / video.videoHeight;

        let personCount = 0;

        predictions.forEach(pred => {
          if (pred.class !== "person") return;
          if (pred.score < 0.45) return;

          personCount++;

          let [x, y, w, h] = pred.bbox;

          x *= scaleX;
          y *= scaleY;
          w *= scaleX;
          h *= scaleY;

          boxCtx.save();

          boxCtx.strokeStyle = "#008cff";
          boxCtx.lineWidth = 4;
          boxCtx.shadowColor = "#008cff";
          boxCtx.shadowBlur = 18;
          boxCtx.strokeRect(x, y, w, h);

          boxCtx.shadowBlur = 0;
          boxCtx.fillStyle = "rgba(0, 140, 255, 0.16)";
          boxCtx.fillRect(x, y, w, h);

          boxCtx.fillStyle = "#008cff";
          boxCtx.font = "16px monospace";
          boxCtx.fillText(
            "PERSON " + Math.round(pred.score * 100) + "%",
            x,
            Math.max(y - 8, 18)
          );

          boxCtx.restore();
        });

        setStatus(
          "STATUS: RUNNING<br>" +
          "BINARY CAMERA DATA<br>" +
          "PERSON: " + personCount
        );

      } catch (err) {
        console.error(err);
        setStatus("STATUS: DETECTION ERROR<br>" + String(err.message || err));
      }

      setTimeout(detectLoop, detectionInterval);
    }
  </script>
</body>
</html>
