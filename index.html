<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>PRESENCE → SOUND</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    background: #050505;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

main {
    width: min(1200px, 94vw);
    margin: auto;
    padding: 45px 0 100px;
}

h1 {
    margin: 0;

    font-size: clamp(
        52px,
        9vw,
        115px
    );

    line-height: .82;
    letter-spacing: -.07em;
}

.subtitle {
    margin-top: 25px;
    margin-bottom: 40px;

    color: #666;

    font-size: 12px;
    font-family: monospace;
}


/* ========================================
   BUTTONS
======================================== */

.buttons {
    display: flex;
    flex-wrap: wrap;

    gap: 8px;

    border-top: 1px solid #292929;

    padding-top: 20px;
}

button,
.fileButton {

    position: relative;

    min-height: 50px;

    padding: 15px 22px;

    border: 1px solid #555;
    border-radius: 0;

    background: transparent;
    color: white;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;

    overflow: hidden;

    appearance: none;
    -webkit-appearance: none;

    touch-action: manipulation;
}

button:hover,
.fileButton:hover {
    background: white;
    color: black;
}

button:disabled {
    opacity: .25;
}

#fileInput {

    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    opacity: 0;

    font-size: 100px;

    cursor: pointer;
}


/* ========================================
   MIXER
======================================== */

.mixer {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 25px;

    margin-top: 30px;

    padding: 22px;

    border: 1px solid #202020;
}

.control label {

    display: flex;

    justify-content: space-between;

    margin-bottom: 10px;

    color: #777;

    font-family: monospace;
    font-size: 10px;
}

input[type="range"] {
    width: 100%;
    accent-color: white;
}


/* ========================================
   STATUS
======================================== */

#status {

    margin-top: 17px;

    color: #888;

    font-size: 11px;
    font-family: monospace;
}

#filename {

    margin-top: 6px;

    color: #444;

    font-size: 10px;
    font-family: monospace;
}


/* ========================================
   VIDEO
======================================== */

.stage {

    display: none;

    position: relative;

    margin-top: 30px;

    width: 100%;

    background: black;

    overflow: hidden;
}


/*
   실제 video는 숨긴다.

   Canvas가 최종 영상을 그린다.
*/

#video {
    display: none;
}

#visualCanvas {

    display: block;

    width: 100%;
    height: auto;

    background: black;
}


/*
   detection 전용 canvas.
   화면에는 보이지 않는다.
*/

#analysisCanvas {
    display: none;
}


/* ========================================
   INFO
======================================== */

#objects {

    margin-top: 15px;

    min-height: 18px;

    color: #888;

    font-family: monospace;
    font-size: 10px;
}

.telemetry {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(120px, 1fr)
        );

    margin-top: 25px;

    gap: 1px;

    background: #222;
}

.telemetry div {

    background: #050505;

    padding: 14px;

    color: #444;

    font-family: monospace;
    font-size: 9px;
}

.telemetry strong {

    display: block;

    margin-top: 7px;

    color: #aaa;

    font-size: 16px;
    font-weight: normal;
}

#modelState {

    margin-top: 30px;

    color: #333;

    font-family: monospace;
    font-size: 9px;
}


@media(max-width:600px) {

    main {
        padding-top: 35px;
    }

    h1 {
        font-size: 58px;
    }

    button,
    .fileButton {
        flex: 1;
    }
}

</style>
</head>



<body>

<main>

<h1>
PRESENCE<br>
→ SOUND
</h1>

<div class="subtitle">
THE IMAGE REMAINS. PRESENCE DISTURBS THE FIELD.
</div>


<!-- ========================================
     BUTTONS
======================================== -->

<div class="buttons">

<div class="fileButton">

SELECT VIDEO

<input
    id="fileInput"
    type="file"
    accept="video/*"
>

</div>


<button
    id="playButton"
    disabled
>
GENERATE
</button>


<button
    id="stopButton"
    disabled
>
STOP
</button>

</div>



<!-- ========================================
     MIXER
======================================== -->

<div class="mixer">


<div class="control">

<label>
<span>VIDEO SOUND</span>
<span id="videoValue">50%</span>
</label>

<input
    id="videoVolume"
    type="range"
    min="0"
    max="1"
    step=".01"
    value=".5"
>

</div>



<div class="control">

<label>
<span>GENERATED</span>
<span id="generatedValue">75%</span>
</label>

<input
    id="generatedVolume"
    type="range"
    min="0"
    max="1"
    step=".01"
    value=".75"
>

</div>



<div class="control">

<label>
<span>DRONE</span>
<span id="droneValue">65%</span>
</label>

<input
    id="droneAmount"
    type="range"
    min="0"
    max="1"
    step=".01"
    value=".65"
>

</div>



<div class="control">

<label>
<span>CRACKLE</span>
<span id="crackleValue">45%</span>
</label>

<input
    id="crackleAmount"
    type="range"
    min="0"
    max="1"
    step=".01"
    value=".45"
>

</div>



<div class="control">

<label>
<span>REACTION</span>
<span id="reactionValue">100%</span>
</label>

<input
    id="reactionAmount"
    type="range"
    min="0"
    max="2"
    step=".01"
    value="1"
>

</div>



<div class="control">

<label>
<span>COLOR SATURATION</span>
<span id="saturationValue">180%</span>
</label>

<input
    id="saturationAmount"
    type="range"
    min="1"
    max="3"
    step=".05"
    value="1.8"
>

</div>

</div>



<div id="status">
LOADING DETECTION MODEL...
</div>

<div id="filename"></div>



<!-- ========================================
     OUTPUT VIDEO
======================================== -->

<div
    class="stage"
    id="stage"
>

<video
    id="video"
    playsinline
    preload="auto"
></video>

<canvas
    id="visualCanvas"
></canvas>

<canvas
    id="analysisCanvas"
></canvas>

</div>



<div id="objects"></div>



<div class="telemetry">

<div>
OBJECTS
<strong id="objectMeter">0</strong>
</div>

<div>
MOTION
<strong id="motionMeter">0.00</strong>
</div>

<div>
FIELD
<strong id="fieldMeter">0 Hz</strong>
</div>

<div>
DETECTION
<strong id="detectionMeter">0 Hz</strong>
</div>

</div>


<div id="modelState">
AI MODEL: LOADING
</div>


</main>



<script>

/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById("video");

const fileInput =
    document.getElementById("fileInput");

const playButton =
    document.getElementById("playButton");

const stopButton =
    document.getElementById("stopButton");

const stage =
    document.getElementById("stage");


const visualCanvas =
    document.getElementById("visualCanvas");

const visualCtx =
    visualCanvas.getContext("2d");


const analysisCanvas =
    document.getElementById("analysisCanvas");

const analysisCtx =
    analysisCanvas.getContext("2d");


const statusElement =
    document.getElementById("status");

const filenameElement =
    document.getElementById("filename");

const objectsElement =
    document.getElementById("objects");

const modelState =
    document.getElementById("modelState");


const videoVolume =
    document.getElementById("videoVolume");

const generatedVolume =
    document.getElementById("generatedVolume");

const droneAmount =
    document.getElementById("droneAmount");

const crackleAmount =
    document.getElementById("crackleAmount");

const reactionAmount =
    document.getElementById("reactionAmount");

const saturationAmount =
    document.getElementById("saturationAmount");


const videoValue =
    document.getElementById("videoValue");

const generatedValue =
    document.getElementById("generatedValue");

const droneValue =
    document.getElementById("droneValue");

const crackleValue =
    document.getElementById("crackleValue");

const reactionValue =
    document.getElementById("reactionValue");

const saturationValue =
    document.getElementById("saturationValue");


const objectMeter =
    document.getElementById("objectMeter");

const motionMeter =
    document.getElementById("motionMeter");

const fieldMeter =
    document.getElementById("fieldMeter");

const detectionMeter =
    document.getElementById("detectionMeter");



/* =========================================================
   STATE
========================================================= */

let model = null;

let modelReady = false;
let videoReady = false;

let running = false;
let objectURL = null;

let currentPredictions = [];

let previousObjects = [];

let detectionBusy = false;

let lastDetectionTime = 0;

let detectionCounter = 0;
let detectionCounterStart = performance.now();


/*
   빠른 detection 요청.

   모델 자체가 55ms보다 느리면
   가능한 최대 속도로 자동 동작한다.
*/

const DETECTION_INTERVAL = 55;



/* =========================================================
   AUDIO STATE
========================================================= */

let audioContext = null;

let masterGain = null;

let droneGain = null;
let droneFilter = null;
let dronePanner = null;

let noiseGain = null;
let noiseFilter = null;

let pulseGain = null;

let delayNode = null;
let feedbackGain = null;

let compressor = null;

let droneVoices = [];

let noiseSource = null;

let lastHitTime = 0;
let lastGlitchTime = 0;
let lastPulseTime = 0;


/*
   D 계열의 중심.

   개별 멜로디가 아니라
   하나의 tonal field를 만든다.
*/

const ROOT = 73.416;



/* =========================================================
   UI
========================================================= */

function percentage(value) {

    return (
        Math.round(
            Number(value) * 100
        )
        +
        "%"
    );

}


videoVolume.addEventListener(
    "input",
    updateVideoVolume
);


function updateVideoVolume() {

    const value =
        Number(
            videoVolume.value
        );


    videoValue.textContent =
        percentage(value);


    /*
       중요.

       0이면 muted 자체를 TRUE로 만든다.
       따라서 0에서 원본 소리가 남을 수 없다.
    */

    if(value <= 0.001) {

        video.muted = true;
        video.volume = 0;

    }

    else {

        video.muted = false;
        video.volume = value;

    }

}


generatedVolume.addEventListener(
    "input",
    () => {

        const value =
            Number(
                generatedVolume.value
            );


        generatedValue.textContent =
            percentage(value);


        if(
            audioContext &&
            masterGain
        ) {

            masterGain.gain
                .setTargetAtTime(

                    value,

                    audioContext.currentTime,

                    .05

                );

        }

    }
);


droneAmount.addEventListener(
    "input",
    () => {

        droneValue.textContent =
            percentage(
                droneAmount.value
            );

    }
);


crackleAmount.addEventListener(
    "input",
    () => {

        crackleValue.textContent =
            percentage(
                crackleAmount.value
            );

    }
);


reactionAmount.addEventListener(
    "input",
    () => {

        reactionValue.textContent =

            Math.round(
                Number(
                    reactionAmount.value
                )
                *
                100
            )
            +
            "%";

    }
);


saturationAmount.addEventListener(
    "input",
    () => {

        saturationValue.textContent =

            Math.round(
                Number(
                    saturationAmount.value
                )
                *
                100
            )
            +
            "%";

    }
);



/* =========================================================
   MODEL
========================================================= */

async function loadModel() {

    try {

        try {

            await tf.setBackend(
                "webgl"
            );

        }

        catch(error) {

            console.log(
                "WebGL fallback"
            );

        }


        await tf.ready();


        model =
            await cocoSsd.load({
                base:
                    "lite_mobilenet_v2"
            });


        modelReady = true;


        modelState.textContent =
            "AI MODEL: READY";


        statusElement.textContent =
            "SELECT VIDEO";


        updatePlayButton();

    }

    catch(error) {

        console.error(error);


        modelState.textContent =
            "AI MODEL: ERROR";


        statusElement.textContent =
            "MODEL LOAD ERROR";

    }

}


loadModel();



/* =========================================================
   VIDEO LOAD
========================================================= */

fileInput.addEventListener(
    "change",
    event => {

        const file =
            event.target.files[0];


        if(!file)
            return;


        if(objectURL) {

            URL.revokeObjectURL(
                objectURL
            );

        }


        objectURL =
            URL.createObjectURL(
                file
            );


        videoReady = false;


        video.src =
            objectURL;


        video.load();


        filenameElement.textContent =
            file.name;


        stage.style.display =
            "block";


        statusElement.textContent =
            "LOADING VIDEO...";


        video.onloadedmetadata =
            () => {

                /*
                   Canvas는 실제 영상 해상도.
                */

                visualCanvas.width =
                    video.videoWidth;

                visualCanvas.height =
                    video.videoHeight;


                /*
                   detection은 저해상도로 돌린다.

                   이것 때문에 Detection이
                   상당히 빨라진다.
                */

                const detectionWidth =
                    Math.min(
                        640,
                        video.videoWidth
                    );


                const ratio =
                    video.videoHeight /
                    video.videoWidth;


                analysisCanvas.width =
                    detectionWidth;

                analysisCanvas.height =
                    Math.round(
                        detectionWidth *
                        ratio
                    );


                videoReady = true;


                updateVideoVolume();


                statusElement.textContent =
                    modelReady
                    ?
                    "READY"
                    :
                    "WAITING FOR AI";


                updatePlayButton();

            };

    }
);



function updatePlayButton() {

    playButton.disabled =
        !(
            modelReady &&
            videoReady
        );

}



/* =========================================================
   AUDIO ENGINE
========================================================= */

function createAudioEngine() {

    if(audioContext)
        return;


    const AC =

        window.AudioContext ||
        window.webkitAudioContext;


    audioContext =
        new AC();



    /* MASTER */

    masterGain =
        audioContext.createGain();


    masterGain.gain.value =
        Number(
            generatedVolume.value
        );



    /* COMPRESSOR */

    compressor =
        audioContext.createDynamicsCompressor();


    compressor.threshold.value =
        -20;

    compressor.knee.value =
        15;

    compressor.ratio.value =
        5;

    compressor.attack.value =
        .02;

    compressor.release.value =
        .7;



    /* DELAY */

    delayNode =
        audioContext.createDelay(
            4
        );


    delayNode.delayTime.value =
        .58;


    feedbackGain =
        audioContext.createGain();


    feedbackGain.gain.value =
        .38;


    delayNode.connect(
        feedbackGain
    );


    feedbackGain.connect(
        delayNode
    );


    delayNode.connect(
        compressor
    );


    masterGain.connect(
        compressor
    );


    masterGain.connect(
        delayNode
    );


    compressor.connect(
        audioContext.destination
    );


    createDrone();

    createNoiseField();

}



/* =========================================================
   DRONE
========================================================= */

function createDrone() {

    droneGain =
        audioContext.createGain();


    droneGain.gain.value =
        0;


    droneFilter =
        audioContext.createBiquadFilter();


    droneFilter.type =
        "lowpass";


    droneFilter.frequency.value =
        420;


    droneFilter.Q.value =
        .8;


    dronePanner =
        audioContext.createStereoPanner();


    /*
       일부러 완벽한 화음이 아닌
       살짝 흐린 frequency cluster.
    */

    const voices = [

        {
            ratio: .5,
            type: "sine",
            gain: .55,
            detune: -5
        },

        {
            ratio: 1,
            type: "sawtooth",
            gain: .11,
            detune: -8
        },

        {
            ratio: 1.5,
            type: "triangle",
            gain: .10,
            detune: 6
        },

        {
            ratio: 2.02,
            type: "sawtooth",
            gain: .035,
            detune: 11
        },

        {
            ratio: 3.01,
            type: "triangle",
            gain: .025,
            detune: -13
        }

    ];


    voices.forEach(
        voice => {

            const oscillator =
                audioContext
                    .createOscillator();


            oscillator.type =
                voice.type;


            oscillator.frequency.value =
                ROOT *
                voice.ratio;


            oscillator.detune.value =
                voice.detune;


            const gain =
                audioContext
                    .createGain();


            gain.gain.value =
                voice.gain;


            oscillator.connect(
                gain
            );


            gain.connect(
                droneFilter
            );


            oscillator.start();


            droneVoices.push({

                oscillator,
                gain,
                baseDetune:
                    voice.detune

            });

        }
    );


    droneFilter.connect(
        dronePanner
    );


    dronePanner.connect(
        droneGain
    );


    droneGain.connect(
        masterGain
    );

}



/* =========================================================
   CRACKLE / NOISE FIELD
========================================================= */

function createNoiseField() {

    const seconds =
        3;


    const length =
        audioContext.sampleRate *
        seconds;


    const buffer =
        audioContext.createBuffer(

            1,

            length,

            audioContext.sampleRate

        );


    const data =
        buffer.getChannelData(0);


    let previous =
        0;


    /*
       단순 white noise보다
       거칠고 불규칙한 texture.
    */

    for(
        let i = 0;
        i < length;
        i++
    ) {

        const white =
            Math.random() *
            2 -
            1;


        previous =
            previous *
            .94
            +
            white *
            .06;


        let value =
            previous *
            .5;


        /*
           드문 crack.
        */

        if(
            Math.random()
            <
            .002
        ) {

            value +=
                (
                    Math.random() *
                    2 -
                    1
                )
                *
                .9;

        }


        data[i] =
            value;

    }


    noiseSource =
        audioContext
            .createBufferSource();


    noiseSource.buffer =
        buffer;


    noiseSource.loop =
        true;


    noiseFilter =
        audioContext
            .createBiquadFilter();


    noiseFilter.type =
        "bandpass";


    noiseFilter.frequency.value =
        1800;


    noiseFilter.Q.value =
        1.7;


    noiseGain =
        audioContext
            .createGain();


    noiseGain.gain.value =
        0;


    noiseSource.connect(
        noiseFilter
    );


    noiseFilter.connect(
        noiseGain
    );


    noiseGain.connect(
        masterGain
    );


    noiseGain.connect(
        delayNode
    );


    noiseSource.start();

}



/* =========================================================
   ELECTRONIC HIT
========================================================= */

/*
   객체가 튀어나올 때의

   "툭 / 둑"

   피아노처럼 명확한 음높이 대신
   짧은 filtered electronic impulse.
*/

function electronicHit(
    x,
    strength = .5
) {

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    /*
       너무 연속으로 난사되는 것 방지.
    */

    if(
        now -
        lastHitTime
        <
        .11
    ) {

        return;

    }


    lastHitTime =
        now;


    const oscillator =
        audioContext
            .createOscillator();


    oscillator.type =
        "triangle";


    const frequency =

        85 +

        x *
        230;


    oscillator.frequency
        .setValueAtTime(

            frequency *
            2.5,

            now

        );


    oscillator.frequency
        .exponentialRampToValueAtTime(

            frequency,

            now +
            .08

        );


    const filter =
        audioContext
            .createBiquadFilter();


    filter.type =
        "lowpass";


    filter.frequency.value =
        1100 +
        strength *
        3500;


    filter.Q.value =
        4;


    const gain =
        audioContext
            .createGain();


    gain.gain.setValueAtTime(

        .025 +
        strength *
        .07,

        now

    );


    gain.gain
        .exponentialRampToValueAtTime(

            .0001,

            now +
            .18

        );


    const panner =
        audioContext
            .createStereoPanner();


    panner.pan.value =
        x * 2 - 1;


    oscillator.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        panner
    );


    panner.connect(
        masterGain
    );


    panner.connect(
        delayNode
    );


    oscillator.start(now);


    oscillator.stop(
        now +
        .2
    );

}



/* =========================================================
   DIGITAL TICK
========================================================= */

/*
   작은 움직임에 가끔

   틱 / 찌직 / 지글
*/

function digitalTick(
    x,
    strength
) {

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    if(
        now -
        lastGlitchTime
        <
        .08
    ) {

        return;

    }


    lastGlitchTime =
        now;


    const oscillator =
        audioContext
            .createOscillator();


    /*
       sine 대신 square/sawtooth 계열.
    */

    oscillator.type =

        Math.random() >
        .5

        ?

        "square"

        :

        "sawtooth";


    oscillator.frequency.value =

        350 +

        Math.random() *
        3500;


    const filter =
        audioContext
            .createBiquadFilter();


    filter.type =
        "bandpass";


    filter.frequency.value =

        800 +

        Math.random() *
        6000;


    filter.Q.value =
        7 +
        Math.random() *
        10;


    const gain =
        audioContext
            .createGain();


    const volume =

        .002 +

        strength *
        .022;


    gain.gain.setValueAtTime(

        volume,

        now

    );


    gain.gain
        .exponentialRampToValueAtTime(

            .0001,

            now +
            .025 +
            Math.random() *
            .08

        );


    const panner =
        audioContext
            .createStereoPanner();


    panner.pan.value =
        x * 2 - 1;


    oscillator.connect(
        filter
    );


    filter.connect(
        gain
    );


    gain.connect(
        panner
    );


    panner.connect(
        masterGain
    );


    oscillator.start(now);


    oscillator.stop(
        now +
        .12
    );

}



/* =========================================================
   SUB PULSE
========================================================= */

function subPulse(
    strength
) {

    if(!audioContext)
        return;


    const now =
        audioContext.currentTime;


    if(
        now -
        lastPulseTime
        <
        .7
    ) {

        return;

    }


    lastPulseTime =
        now;


    const oscillator =
        audioContext
            .createOscillator();


    oscillator.type =
        "sine";


    oscillator.frequency
        .setValueAtTime(

            58,

            now

        );


    oscillator.frequency
        .exponentialRampToValueAtTime(

            42,

            now +
            .45

        );


    const gain =
        audioContext
            .createGain();


    gain.gain.setValueAtTime(

        .025 +
        strength *
        .045,

        now

    );


    gain.gain
        .exponentialRampToValueAtTime(

            .0001,

            now +
            .7

        );


    oscillator.connect(
        gain
    );


    gain.connect(
        masterGain
    );


    oscillator.start(now);


    oscillator.stop(
        now +
        .75
    );

}



/* =========================================================
   OBJECT MATCHING
========================================================= */

/*
   이전 버전의 class_index보다 조금 낫다.

   같은 종류의 객체 중
   가장 가까운 이전 중심점을 찾는다.
*/

function findPreviousObject(
    object,
    usedIndexes
) {

    let bestIndex =
        -1;


    let bestDistance =
        Infinity;


    previousObjects.forEach(
        (previous, index) => {

            if(
                usedIndexes.has(index)
            )
                return;


            if(
                previous.className
                !==
                object.className
            )
                return;


            const dx =
                previous.x -
                object.x;


            const dy =
                previous.y -
                object.y;


            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(
                distance <
                bestDistance
            ) {

                bestDistance =
                    distance;


                bestIndex =
                    index;

            }

        }
    );


    return {

        index:
            bestIndex,

        distance:
            bestDistance

    };

}



/* =========================================================
   ANALYSE OBJECTS
========================================================= */

function analysePredictions(
    predictions
) {

    const objects =

        predictions.map(
            prediction => {

                const [
                    x,
                    y,
                    width,
                    height
                ] =
                prediction.bbox;


                return {

                    className:
                        prediction.class,

                    x:
                        (
                            x +
                            width / 2
                        )
                        /
                        analysisCanvas.width,

                    y:
                        (
                            y +
                            height / 2
                        )
                        /
                        analysisCanvas.height,

                    area:
                        (
                            width *
                            height
                        )
                        /
                        (
                            analysisCanvas.width *
                            analysisCanvas.height
                        ),

                    prediction

                };

            }
        );


    const usedIndexes =
        new Set();


    let totalMotion =
        0;


    let strongestMotion =
        0;


    let strongestX =
        .5;


    let totalX =
        0;


    let totalArea =
        0;


    let newObjectCount =
        0;


    objects.forEach(
        object => {

            const match =
                findPreviousObject(

                    object,

                    usedIndexes

                );


            let motion =
                0;


            let isNew =
                false;


            if(
                match.index
                >=
                0
                &&
                match.distance
                <
                .30
            ) {

                usedIndexes.add(
                    match.index
                );


                motion =
                    match.distance;

            }

            else {

                isNew =
                    true;

                newObjectCount++;

            }


            /*
               sensitivity
            */

            motion *=

                7 *

                Number(
                    reactionAmount.value
                );


            motion =
                Math.min(
                    1,
                    motion
                );


            object.motion =
                motion;


            object.isNew =
                isNew;


            totalMotion +=
                motion;


            totalX +=
                object.x;


            totalArea +=
                object.area;


            if(
                motion >
                strongestMotion
            ) {

                strongestMotion =
                    motion;

                strongestX =
                    object.x;

            }


            /*
               새 객체 등장.

               확실하게 "툭".
            */

            if(
                isNew
                &&
                running
            ) {

                electronicHit(

                    object.x,

                    .45 +
                    object.area *
                    2

                );

            }


            /*
               중간 정도 움직임.

               확률적으로 digital tick.
            */

            if(
                motion >
                .08
                &&
                Math.random()
                <
                .30
            ) {

                digitalTick(

                    object.x,

                    motion

                );

            }


            /*
               큰 움직임.

               저역 pulse.
            */

            if(
                motion >
                .30
            ) {

                subPulse(
                    motion
                );

            }

        }
    );


    previousObjects =
        objects.map(
            object => ({

                className:
                    object.className,

                x:
                    object.x,

                y:
                    object.y

            })
        );


    const divisor =
        Math.max(
            1,
            objects.length
        );


    return {

        count:
            objects.length,

        motion:
            totalMotion /
            divisor,

        strongestMotion,

        strongestX,

        averageX:
            objects.length
            ?
            totalX /
            objects.length
            :
            .5,

        area:
            totalArea,

        newObjects:
            newObjectCount

    };

}



/* =========================================================
   SOUND FIELD UPDATE
========================================================= */

function updateSoundField(
    analysis
) {

    if(
        !audioContext ||
        !droneGain
    )
        return;


    const now =
        audioContext.currentTime;


    const drone =
        Number(
            droneAmount.value
        );


    const crackle =
        Number(
            crackleAmount.value
        );


    /*
       지속적인 Drone.

       객체가 없어도 존재.
    */

    const droneLevel =

        .045 *

        drone *

        (
            .8 +
            Math.min(
                .5,
                analysis.count *
                .06
            )
        );


    droneGain.gain
        .setTargetAtTime(

            droneLevel,

            now,

            1.3

        );



    /*
       움직임은 음을 새로 치기보다
       장 전체를 연다.
    */

    const filterFrequency =

        260 +

        analysis.motion *
        3500 +

        Math.min(
            1500,
            analysis.area *
            2500
        );


    droneFilter.frequency
        .setTargetAtTime(

            filterFrequency,

            now,

            .7

        );



    /*
       객체의 무게중심에 따라
       Drone 전체가 아주 천천히 이동.
    */

    dronePanner.pan
        .setTargetAtTime(

            (
                analysis.averageX *
                2 -
                1
            )
            *
            .45,

            now,

            1.5

        );



    /*
       Crackle은 완전히 사라지지 않는다.

       움직임이 많으면 표면으로 올라온다.
    */

    const noiseLevel =

        crackle *

        (
            .0015 +
            analysis.motion *
            .027
        );


    noiseGain.gain
        .setTargetAtTime(

            noiseLevel,

            now,

            .18

        );


    noiseFilter.frequency
        .setTargetAtTime(

            1200 +
            analysis.motion *
            5000,

            now,

            .35

        );



    /*
       Drone 자체도 움직임 때문에
       아주 조금 불안정해짐.
    */

    droneVoices.forEach(
        (voice, index) => {

            const wobble =

                analysis.motion *

                (
                    8 +
                    index *
                    5
                );


            const direction =

                index % 2
                ?
                1
                :
                -1;


            voice.oscillator.detune
                .setTargetAtTime(

                    voice.baseDetune
                    +
                    wobble *
                    direction,

                    now,

                    1

                );

        }
    );


    objectMeter.textContent =
        analysis.count;


    motionMeter.textContent =
        analysis.motion
            .toFixed(2);


    fieldMeter.textContent =

        Math.round(
            filterFrequency
        )
        +
        " Hz";

}



/* =========================================================
   VISUAL RENDERING
========================================================= */

function renderVideo() {

    if(
        !running ||
        video.paused ||
        video.ended
    ) {

        return;

    }


    const width =
        visualCanvas.width;


    const height =
        visualCanvas.height;


    /*
       1.
       전체 영상 = 흑백.
    */

    visualCtx.save();


    visualCtx.filter =
        "grayscale(1) contrast(1.08)";


    visualCtx.drawImage(

        video,

        0,
        0,

        width,
        height

    );


    visualCtx.restore();



    /*
       2.
       Detection 영역만
       원본 색상 + saturation.
    */

    const scaleX =

        width /
        analysisCanvas.width;


    const scaleY =

        height /
        analysisCanvas.height;


    const saturation =

        Number(
            saturationAmount.value
        );


    currentPredictions.forEach(
        prediction => {

            const [
                x,
                y,
                boxWidth,
                boxHeight
            ] =
            prediction.bbox;


            /*
               박스 주변에 약간의 margin.

               너무 딱 잘린 사각형 느낌을
               조금 완화한다.
            */

            const margin =
                4;


            const sx =
                Math.max(
                    0,
                    x -
                    margin
                );


            const sy =
                Math.max(
                    0,
                    y -
                    margin
                );


            const sw =
                Math.min(

                    analysisCanvas.width -
                    sx,

                    boxWidth +
                    margin * 2

                );


            const sh =
                Math.min(

                    analysisCanvas.height -
                    sy,

                    boxHeight +
                    margin * 2

                );


            const dx =
                sx *
                scaleX;


            const dy =
                sy *
                scaleY;


            const dw =
                sw *
                scaleX;


            const dh =
                sh *
                scaleY;


            /*
               원본 VIDEO의 좌표로 변환.
            */

            const videoScaleX =

                video.videoWidth /
                analysisCanvas.width;


            const videoScaleY =

                video.videoHeight /
                analysisCanvas.height;


            visualCtx.save();


            visualCtx.filter =

                `saturate(${saturation}) contrast(1.08)`;


            visualCtx.drawImage(

                video,

                sx *
                videoScaleX,

                sy *
                videoScaleY,

                sw *
                videoScaleX,

                sh *
                videoScaleY,

                dx,
                dy,
                dw,
                dh

            );


            visualCtx.restore();



            /*
               BOX
            */

            visualCtx.strokeStyle =
                "rgba(255,255,255,.88)";


            visualCtx.lineWidth =

                Math.max(
                    1.5,
                    width /
                    800
                );


            visualCtx.strokeRect(

                dx,
                dy,
                dw,
                dh

            );



            /*
               LABEL
            */

            const fontSize =

                Math.max(
                    11,
                    width /
                    90
                );


            visualCtx.font =

                `${fontSize}px monospace`;


            const label =

                prediction.class
                +
                " "
                +
                Math.round(
                    prediction.score *
                    100
                )
                +
                "%";


            const labelWidth =

                visualCtx
                .measureText(
                    label
                )
                .width;


            visualCtx.fillStyle =
                "rgba(0,0,0,.8)";


            visualCtx.fillRect(

                dx,

                Math.max(
                    0,
                    dy -
                    fontSize -
                    7
                ),

                labelWidth +
                10,

                fontSize +
                7

            );


            visualCtx.fillStyle =
                "white";


            visualCtx.fillText(

                label,

                dx + 5,

                Math.max(
                    fontSize,
                    dy - 5
                )

            );

        }
    );


    requestAnimationFrame(
        renderVideo
    );

}



/* =========================================================
   DETECTION LOOP
========================================================= */

async function detectionLoop(
    timestamp
) {

    if(!running)
        return;


    if(
        video.paused ||
        video.ended
    )
        return;


    if(
        !detectionBusy
        &&
        timestamp -
        lastDetectionTime
        >=
        DETECTION_INTERVAL
    ) {

        detectionBusy =
            true;


        lastDetectionTime =
            timestamp;


        try {

            /*
               먼저 작은 Canvas에 영상 복사.

               Detection을 작은 이미지로 돌려
               속도를 높인다.
            */

            analysisCtx.drawImage(

                video,

                0,
                0,

                analysisCanvas.width,
                analysisCanvas.height

            );


            let predictions =

                await model.detect(
                    analysisCanvas,
                    10,
                    .32
                );


            predictions =

                predictions

                .filter(
                    prediction =>
                        prediction.score
                        >=
                        .32
                )

                .sort(
                    (a,b) => {

                        const areaA =
                            a.bbox[2] *
                            a.bbox[3];


                        const areaB =
                            b.bbox[2] *
                            b.bbox[3];


                        return (
                            areaB -
                            areaA
                        );

                    }
                )

                .slice(
                    0,
                    10
                );


            currentPredictions =
                predictions;


            const analysis =

                analysePredictions(
                    predictions
                );


            updateSoundField(
                analysis
            );


            objectsElement.textContent =

                predictions.length

                ?

                predictions
                .map(
                    prediction =>

                        prediction.class
                        +
                        " "
                        +
                        Math.round(
                            prediction.score *
                            100
                        )
                        +
                        "%"

                )
                .join(
                    "  ·  "
                )

                :

                "NO DETECTED PRESENCE";



            /* Detection Hz */

            detectionCounter++;


            const now =
                performance.now();


            if(
                now -
                detectionCounterStart
                >=
                1000
            ) {

                const elapsed =

                    (
                        now -
                        detectionCounterStart
                    )
                    /
                    1000;


                const hz =

                    detectionCounter /
                    elapsed;


                detectionMeter.textContent =

                    hz.toFixed(1)
                    +
                    " Hz";


                detectionCounter =
                    0;


                detectionCounterStart =
                    now;

            }

        }

        catch(error) {

            console.error(
                "Detection:",
                error
            );

        }


        detectionBusy =
            false;

    }


    requestAnimationFrame(
        detectionLoop
    );

}



/* =========================================================
   PLAY
========================================================= */

playButton.addEventListener(
    "click",
    async () => {

        if(
            !modelReady ||
            !videoReady
        )
            return;


        /*
           iPhone Safari 때문에
           클릭 안에서 AudioContext 시작.
        */

        createAudioEngine();


        if(
            audioContext.state
            ===
            "suspended"
        ) {

            await audioContext.resume();

        }


        updateVideoVolume();


        /*
           처음부터.
        */

        video.currentTime =
            0;


        currentPredictions =
            [];


        previousObjects =
            [];


        lastDetectionTime =
            0;


        detectionCounter =
            0;


        detectionCounterStart =
            performance.now();


        try {

            await video.play();

        }

        catch(error) {

            console.error(error);


            statusElement.textContent =
                "VIDEO PLAYBACK ERROR";


            return;

        }


        running =
            true;


        playButton.disabled =
            true;


        stopButton.disabled =
            false;


        statusElement.textContent =
            "GENERATING";


        /*
           Drone fade in.
        */

        droneGain.gain
            .setTargetAtTime(

                .035 *
                Number(
                    droneAmount.value
                ),

                audioContext.currentTime,

                1.5

            );


        requestAnimationFrame(
            renderVideo
        );


        requestAnimationFrame(
            detectionLoop
        );

    }
);



/* =========================================================
   STOP
========================================================= */

function stopEverything() {

    running =
        false;


    video.pause();


    if(audioContext) {

        if(droneGain) {

            droneGain.gain
                .setTargetAtTime(

                    0,

                    audioContext.currentTime,

                    .2

                );

        }


        if(noiseGain) {

            noiseGain.gain
                .setTargetAtTime(

                    0,

                    audioContext.currentTime,

                    .1

                );

        }

    }


    stopButton.disabled =
        true;


    updatePlayButton();


    statusElement.textContent =
        "STOPPED";

}


stopButton.addEventListener(
    "click",
    stopEverything
);



/* =========================================================
   END
========================================================= */

video.addEventListener(
    "ended",
    () => {

        running =
            false;


        if(audioContext) {

            droneGain.gain
                .setTargetAtTime(

                    0,

                    audioContext.currentTime,

                    1

                );


            noiseGain.gain
                .setTargetAtTime(

                    0,

                    audioContext.currentTime,

                    .5

                );

        }


        stopButton.disabled =
            true;


        updatePlayButton();


        statusElement.textContent =
            "FINISHED";

    }
);



/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(objectURL) {

            URL.revokeObjectURL(
                objectURL
            );

        }

    }
);
