<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Ripple System</title>

<style>
body{margin:0;background:#000;color:#fff;overflow:hidden;}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
#menu{position:absolute;top:10px;left:10px;z-index:10;}
button{margin:2px;padding:10px;border-radius:8px;background:#111;color:#fff;border:1px solid #333;}
.active{background:#fff;color:#000;}
</style>
</head>
<body>

<div id="menu">
<button id="modeBtn" class="active">Detect</button>
<button id="viewBtn">2D</button>
<button id="mockBtn">Mock</button>
</div>

<video id="video" autoplay playsinline style="display:none;"></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let model;
let tracks = [];
let nextID = 1;
let mode = "detect";
let view = "2d";

let grid = Array.from({length:10},()=>Array(10).fill(0));
let vel = Array.from({length:10},()=>Array(10).fill(0));

const motionThreshold = 0.01;

function resize(){
 canvas.width = innerWidth;
 canvas.height = innerHeight;
}
window.onresize = resize;
resize();

async function initCamera(){
 const stream = await navigator.mediaDevices.getUserMedia({
  video:{facingMode:"environment"}
 });
 video.srcObject = stream;
}
initCamera();

async function loadModel(){
 model = await cocoSsd.load();
}
loadModel();

function trackPeople(detections){
 const newTracks=[];
 detections.forEach(d=>{
  if(d.class!=="person") return;

  const cx = d.bbox[0]+d.bbox[2]/2;
  const cy = d.bbox[1]+d.bbox[3]/2;

  let best=null, bestDist=9999;

  tracks.forEach(t=>{
   const dist = Math.hypot(t.x-cx, t.y-cy);
   if(dist<bestDist && dist<80) {best=t; bestDist=dist;}
  });

  if(best){
   const motion = Math.hypot(cx-best.x, cy-best.y)/Math.min(canvas.width,canvas.height);
   best.motion = best.motion*0.7 + motion*0.3;
   best.x=cx; best.y=cy;
   best.w=d.bbox[2]; best.h=d.bbox[3];
   best.life=0;
   newTracks.push(best);
  }else{
   newTracks.push({
    id:nextID++,
    x:cx,y:cy,
    w:d.bbox[2],h:d.bbox[3],
    motion:0,
    life:0
   });
  }
 });

 tracks.forEach(t=>t.life++);
 tracks = [...newTracks, ...tracks.filter(t=>t.life<10)];
}

function injectRipple(){
 tracks.forEach(t=>{
  if(t.motion < motionThreshold) return;

  const gx = Math.floor((t.x/canvas.width)*9);
  const gy = Math.floor((t.y/canvas.height)*9);

  vel[gy][gx] += 1 + t.motion*10;
 });
}

function updateWave(){
 injectRipple();

 const next = grid.map(r=>r.slice());

 for(let y=0;y<10;y++){
  for(let x=0;x<10;x++){
   const c=grid[y][x];
   const sum =
    (grid[y-1]?.[x]||0)+
    (grid[y+1]?.[x]||0)+
    (grid[y][x-1]||0)+
    (grid[y][x+1]||0);

   vel[y][x]+= (sum-4*c)*0.2;
   vel[y][x]*=0.97;
   next[y][x]=c+vel[y][x];
  }
 }

 grid=next;
}

function drawDetect(){
 tracks.forEach(t=>{
  ctx.strokeStyle="#0047FF";
  ctx.strokeRect(t.x-t.w/2, t.y-t.h/2, t.w, t.h);

  ctx.fillStyle="#0047FF";
  ctx.fillText("ID "+t.id, t.x-20, t.y-20);
 });
}

function drawRipple(){
 const cw = canvas.width/10;
 const ch = canvas.height/10;

 for(let y=0;y<10;y++){
  for(let x=0;x<10;x++){
   const v = Math.abs(grid[y][x]);
   const c = Math.min(255, v*120);
   ctx.fillStyle=`rgb(${c},${c},${c})`;
   ctx.fillRect(x*cw, y*ch, cw, ch);
  }
 }

 tracks.forEach(t=>{
  ctx.fillStyle="#0047FF";
  ctx.beginPath();
  ctx.arc(t.x,t.y,5,0,Math.PI*2);
  ctx.fill();
 });
}

async function loop(){
 ctx.clearRect(0,0,canvas.width,canvas.height);

 if(model && video.readyState>=2){
  const preds = await model.detect(video);
  trackPeople(preds);
 }

 updateWave();

 if(mode==="detect") drawDetect();
 else drawRipple();

 requestAnimationFrame(loop);
}
loop();

document.getElementById("modeBtn").onclick=()=>{
 mode = mode==="detect"?"ripple":"detect";
};

document.getElementById("viewBtn").onclick=()=>{
 view = view==="2d"?"3d":"2d";
};

document.getElementById("mockBtn").onclick=()=>{
 tracks=[{id:1,x:200,y:300,w:100,h:200,motion:0.05}];
};
</script>

</body>
</html>
