<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ripple Live</title>

<style>
body { margin:0; background:#000; overflow:hidden; }
canvas { position:absolute; width:100%; height:100%; }
video { display:none; }
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let detector;
let tracks = [];
let nextID = 1;

let grid = Array.from({length:10},()=>Array(10).fill(0));
let vel = Array.from({length:10},()=>Array(10).fill(0));

async function init(){

  // 카메라
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode:"environment" },
    audio: false
  });
  video.srcObject = stream;

  await video.play();

  // MoveNet (🔥 핵심 수정)
  detector = await poseDetection.createDetector(
    poseDetection.SupportedModels.MoveNet,
    {
      modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING
    }
  );

  resize();
  requestAnimationFrame(loop);
}

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.onresize = resize;

function getBox(keypoints){
  const pts = keypoints.filter(k=>k.score>0.3);
  if(pts.length < 4) return null;

  const xs = pts.map(p=>p.x);
  const ys = pts.map(p=>p.y);

  const minX = Math.min(...xs);
  const maxX = Math.max(...xs);
  const minY = Math.min(...ys);
  const maxY = Math.max(...ys);

  return {
    cx:(minX+maxX)/2,
    cy:(minY+maxY)/2,
    w:(maxX-minX)*1.4,
    h:(maxY-minY)*1.6
  };
}

function track(boxes){
  let newTracks = [];

  boxes.forEach(b=>{
    let best=null, bestDist=999;

    tracks.forEach(t=>{
      let d = Math.hypot(t.cx-b.cx, t.cy-b.cy);
      if(d<bestDist && d<120){
        best=t;
        bestDist=d;
      }
    });

    if(best){
      let motion = Math.hypot(b.cx-best.cx, b.cy-best.cy)/300;

      best.motion = best.motion*0.7 + motion*0.3;
      best.cx=b.cx;
      best.cy=b.cy;
      best.w=b.w;
      best.h=b.h;
      best.life=0;

      newTracks.push(best);
    }else{
      newTracks.push({
        id:nextID++,
        ...b,
        motion:0,
        life:0
      });
    }
  });

  tracks.forEach(t=>t.life++);
  tracks = [...newTracks, ...tracks.filter(t=>t.life<40)];
}

function inject(){
  tracks.forEach(t=>{
    if(t.motion < 0.02) return;

    let gx = Math.floor((t.cx/canvas.width)*10);
    let gy = Math.floor((t.cy/canvas.height)*10);

    if(gx>=0 && gx<10 && gy>=0 && gy<10){
      vel[gy][gx] += 0.6 + t.motion*2;
    }
  });
}

function updateWave(){
  inject();

  let next = Array.from({length:10},()=>Array(10).fill(0));

  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){

      let c = grid[y][x];
      let l = x>0?grid[y][x-1]:0;
      let r = x<9?grid[y][x+1]:0;
      let u = y>0?grid[y-1][x]:0;
      let d = y<9?grid[y+1][x]:0;

      let lap = (l+r+u+d - 4*c);

      vel[y][x] += lap * 0.25;
      vel[y][x] *= 0.96;

      next[y][x] = c + vel[y][x];
    }
  }

  grid = next;
}

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let cw = canvas.width/10;
  let ch = canvas.height/10;

  // ripple
  for(let y=0;y<10;y++){
    for(let x=0;x<10;x++){
      let v = Math.abs(grid[y][x]);
      let c = Math.floor(20 + v*200);

      ctx.fillStyle = `rgb(${c},${c},${c})`;
      ctx.fillRect(x*cw+2, y*ch+2, cw-4, ch-4);
    }
  }

  // people
  tracks.forEach(t=>{
    ctx.strokeStyle="#0047FF";
    ctx.lineWidth=2;
    ctx.strokeRect(t.cx-t.w/2, t.cy-t.h/2, t.w, t.h);

    ctx.fillStyle="#0047FF";
    ctx.fillText("ID "+t.id, t.cx-20, t.cy-20);
  });
}

async function loop(){

  const poses = await detector.estimatePoses(video);

  let boxes = poses.map(p=>getBox(p.keypoints)).filter(Boolean);

  track(boxes);
  updateWave();
  draw();

  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
