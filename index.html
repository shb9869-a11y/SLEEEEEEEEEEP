<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,interactive-widget=resizes-content">
<title>LIMENWALKER — Upload + View</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIMEN">
<meta name="theme-color" content="#000000">

<style>
:root{
  /* Upload UI look */
  --frame: clamp(16px, 4vmin, 40px);
  --ui-gap: 10px;
  --fs-strong: clamp(14px, 2.8vmin, 18px);
  --fs-small: clamp(11px, 1.8vmin, 13px);
  --pad-btn-y: clamp(10px, 1.2vmin, 14px);
  --pad-btn-x: clamp(14px, 2.0vmin, 22px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --paper: #e7e2c9;
  --paper-dim: rgba(231,226,201,.72);

  /* Ninja overlay control */
  --vwpx:100vw; --vhpx:100vh;
}

html,body{
  margin:0; padding:0; width:100%; height:100%;
  background:#000; overflow:hidden;
  touch-action:manipulation;
}
body{
  font-family: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", Times, serif;
  color:var(--paper);
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
textarea, input, button {
  -webkit-user-select: text; user-select: text;
  -webkit-touch-callout: default;
  pointer-events: auto;
}
textarea{ touch-action:auto; -webkit-user-modify: read-write-plaintext-only; }

/* Background canvas */
#bg{ position:fixed; inset:0; width:100vw; height:100vh; display:block; z-index:0; background:#000; }

/* VDO.Ninja overlay (Resolume) */
#ninjaOverlay{
  position:fixed; left:50%; top:50%;
  width:var(--vwpx); height:var(--vhpx);
  transform:translate(-50%,-50%) scale(1);
  transform-origin:50% 50%;
  border:0; background:transparent;
  z-index:20;
  pointer-events:none;

  /* ✅ 기본: 보이게. 원하면 JS에서 단계별로 조절 가능 */
  opacity:1;
  transition:opacity .25s ease;

  /* ✅ 합성: 필요없으면 normal 로 바꿔도 됨 */
  mix-blend-mode: screen;
  will-change:opacity, transform;
}

/* Frame + panels */
.frameBox{
  position:fixed;
  left:calc(var(--frame) + var(--safe-l));
  top:calc(var(--frame) + var(--safe-t));
  right:calc(var(--frame) + var(--safe-r));
  bottom:calc(var(--frame) + var(--safe-b));
  border:1.5px solid rgba(231,226,201,.68);
  pointer-events:none;
  z-index:50;
}
.panel{
  position:fixed;
  left:calc(var(--frame) + var(--ui-gap) + var(--safe-l));
  right:calc(var(--frame) + var(--ui-gap) + var(--safe-r));
  top:calc(var(--frame) + var(--ui-gap) + var(--safe-t));
  bottom:calc(var(--frame) + var(--ui-gap) + var(--safe-b));
  z-index:200;
  display:flex;
  flex-direction:column;
  gap:12px;
  justify-content:flex-end;
}
.card{
  background:rgba(0,0,0,.42);
  border:1px solid rgba(231,226,201,.12);
  border-radius:18px;
  padding:14px;
  backdrop-filter: blur(10px);
}
.row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.uiBtn{
  background:rgba(255,255,255,.06);
  color:var(--paper);
  border:1px solid rgba(231,226,201,.16);
  font-size:var(--fs-strong);
  padding:var(--pad-btn-y) var(--pad-btn-x);
  font-family: inherit;
  letter-spacing: .10em;
  white-space:nowrap;
  cursor:pointer;
  opacity:.95;
  border-radius:14px;
}
.uiBtn:active{opacity:.78; transform:translateY(1px);}
.small{ font-size:var(--fs-small); letter-spacing:.08em; opacity:.9; color:var(--paper-dim); }

#previewWrap{ display:flex; gap:12px; align-items:stretch; }
#preview{
  width:min(42vw, 360px);
  aspect-ratio: 4 / 3;
  border-radius:14px;
  border:1px solid rgba(231,226,201,.12);
  background:rgba(255,255,255,.03);
  object-fit:cover;
}
#rightPane{
  flex:1; min-width:220px;
  display:flex; flex-direction:column; gap:10px;
}
#status{
  white-space:pre-wrap;
  line-height:1.4;
  font-size:var(--fs-small);
  color:rgba(231,226,201,.78);
}
#textBox{
  border-radius:14px;
  border:1px solid rgba(231,226,201,.16);
  background:rgba(0,0,0,.25);
  padding:10px;
}
#textBox .hint{
  font-size:var(--fs-small);
  color:rgba(231,226,201,.55);
  letter-spacing:.06em;
  margin-bottom:8px;
}
#textPreviewInput{
  width:100%;
  min-height:92px;
  max-height:220px;
  resize:vertical;
  border-radius:12px;
  border:1px solid rgba(231,226,201,.14);
  background:rgba(0,0,0,.35);
  color:rgba(231,226,201,.92);
  padding:10px;
  outline:none;
  font-size:clamp(13px, 2.0vmin, 16px);
  line-height:1.5;
}
#textPreviewInput::placeholder{ color: rgba(231,226,201,.45); }

/* Optional tiny top hint */
#topHint{
  position:fixed;
  left:calc(var(--frame) + var(--ui-gap) + var(--safe-l));
  top:calc(var(--frame) + var(--ui-gap) + var(--safe-t));
  z-index:210;
  font-size:var(--fs-small);
  color:rgba(231,226,201,.62);
  letter-spacing:.10em;
  pointer-events:none;
  user-select:none;
}
</style>
</head>

<body>
  <!-- Background -->
  <canvas id="bg"></canvas>

  <!-- VDO.Ninja Resolume overlay -->
  <iframe id="ninjaOverlay"
    allow="autoplay; fullscreen; clipboard-read; clipboard-write"
    allowtransparency="true"
    referrerpolicy="no-referrer"
    src="about:blank"></iframe>

  <div class="frameBox" aria-hidden="true"></div>
  <div id="topHint">VIEW + UPLOAD</div>

  <!-- Upload UI -->
  <div class="panel">
    <div class="card">
      <div class="row">
        <div>
          <div style="letter-spacing:.12em; font-weight:700;">UPLOAD</div>
          <div class="small">Image 업로드 / Text 입력 후 Enter로 전송</div>
        </div>
        <div class="row">
          <button id="pickImage" class="uiBtn">Image</button>
          <button id="focusText" class="uiBtn">Text</button>
          <button id="sendText" class="uiBtn">Enter</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="previewWrap">
        <img id="preview" alt="preview"/>
        <div id="rightPane">
          <div id="status">Ready.</div>
          <div id="textBox">
            <div class="hint">텍스트를 입력하세요</div>
            <textarea id="textPreviewInput" placeholder="여기에 입력..."></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
(() => {
  /* =========================================================
     CONFIG
  ========================================================= */
  const CONFIG = {
    // ✅ Upload server: 현재 페이지가 열린 서버를 자동 사용 (file://이면 localhost fallback)
    SERVER: (location.origin && location.origin.startsWith('http')) ? location.origin : 'http://127.0.0.1:4000',
    UPLOAD_TIMEOUT_MS: 20000,
    UPLOAD_RETRY: 1,

    // ✅ VDO.Ninja (view) settings
    ROOM_ID: "YOURROOMID",
    REZ_SCALE: 0.65,
    NINJA_OPACITY: 1.0,       // ✅ 1.0 = 완전 불투명
    BLEND_MODE: "screen",     // "normal" 추천(원본), "screen"(밝게 합성)
    CODEC: "vp8",
    AUTO_REFRESH_MS: 60000
  };

  /* =========================================================
     ELEMENTS
  ========================================================= */
  const bg = document.querySelector('#bg');
  const bctx = bg.getContext('2d', { alpha:false });

  const ninja = document.querySelector('#ninjaOverlay');

  const pickImageBtn = document.querySelector('#pickImage');
  const focusTextBtn = document.querySelector('#focusText');
  const sendTextBtn  = document.querySelector('#sendText');

  const preview = document.querySelector('#preview');
  const statusEl = document.querySelector('#status');
  const textPreviewInput = document.querySelector('#textPreviewInput');

  function setStatus(msg){ statusEl.textContent = msg || ''; }

  /* =========================================================
     VIEWPORT VARS (for ninja sizing)
  ========================================================= */
  function setViewportVars(){
    const vv = window.visualViewport;
    const w = Math.round((vv?.width || innerWidth));
    const h = Math.round((vv?.height || innerHeight));
    document.documentElement.style.setProperty('--vwpx', w + 'px');
    document.documentElement.style.setProperty('--vhpx', h + 'px');
  }
  setViewportVars();
  addEventListener('resize', setViewportVars);
  if (visualViewport){
    visualViewport.addEventListener('resize', setViewportVars);
    visualViewport.addEventListener('scroll', setViewportVars);
  }
  addEventListener('orientationchange', ()=> setTimeout(setViewportVars,120));

  /* =========================================================
     BG (light particles)
  ========================================================= */
  function resizeCanvas(){
    const dpr = window.devicePixelRatio || 1;
    bg.width = Math.round(innerWidth * dpr);
    bg.height = Math.round(innerHeight * dpr);
    bctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas, {passive:true});
  resizeCanvas();

  const pts=[];
  for(let i=0;i<90;i++){
    pts.push({
      x:Math.random()*innerWidth,
      y:Math.random()*innerHeight,
      vx:(Math.random()-0.5)*0.18,
      vy:(Math.random()-0.5)*0.18
    });
  }
  (function loop(){
    bctx.fillStyle='#000';
    bctx.fillRect(0,0,innerWidth,innerHeight);
    bctx.globalCompositeOperation='lighter';
    for(const p of pts){
      p.x+=p.vx; p.y+=p.vy;
      if(p.x<-20)p.x=innerWidth+20; if(p.x>innerWidth+20)p.x=-20;
      if(p.y<-20)p.y=innerHeight+20; if(p.y>innerHeight+20)p.y=-20;
      bctx.fillStyle='rgba(231,226,201,0.09)';
      bctx.beginPath(); bctx.arc(p.x,p.y,1.2,0,Math.PI*2); bctx.fill();
    }
    bctx.globalCompositeOperation='source-over';
    requestAnimationFrame(loop);
  })();

  /* =========================================================
     VDO.NINJA VIEW (iframe overlay)
  ========================================================= */
  // iOS Safari blend fallback
  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function applyNinjaStyle(){
    ninja.style.opacity = String(Math.max(0, Math.min(1, CONFIG.NINJA_OPACITY)));
    ninja.style.mixBlendMode = (isiOS && CONFIG.BLEND_MODE === "screen") ? "lighten" : CONFIG.BLEND_MODE;
  }

  function applyRezScale(){
    const s = Math.max(0.2, Math.min(1, Number(CONFIG.REZ_SCALE)||1));
    ninja.style.width  = `calc(var(--vwpx) * ${s})`;
    ninja.style.height = `calc(var(--vhpx) * ${s})`;
    ninja.style.left = '50%';
    ninja.style.top  = '50%';
    ninja.style.transform = `translate(-50%,-50%) scale(${1/s})`;
  }

  const injectedCss = encodeURIComponent(`
    html,body{background:transparent!important;margin:0!important;overflow:hidden!important;}
    #container,.container{background:transparent!important;}
    video,canvas{position:fixed!important; inset:0!important; width:100vw!important; height:100vh!important; object-fit:cover!important; background:transparent!important;}
  `);

  const ninjaBase = () => (
    `https://vdo.ninja/?view=${encodeURIComponent(CONFIG.ROOM_ID)}`
    + `&clean&autostart&noaudio`
    + `&codec=${encodeURIComponent(CONFIG.CODEC)}`
    + `&solo&transparent=1`
    + `&css=${injectedCss}`
  );

  const ninjaUrl = () => `${ninjaBase()}&ts=${Date.now()}`;

  function loadNinja(){
    applyNinjaStyle();
    applyRezScale();
    if(!ninja.src || ninja.src === 'about:blank'){
      ninja.src = ninjaUrl();
    }
  }

  loadNinja();

  setInterval(()=>{
    // 연결/투명 깨짐 대비 재로딩
    if (parseFloat(getComputedStyle(ninja).opacity) > 0.001){
      ninja.src = ninjaUrl();
    }
  }, CONFIG.AUTO_REFRESH_MS);

  addEventListener('pageshow', ()=> setTimeout(()=>{ setViewportVars(); applyRezScale(); }, 60));

  /* =========================================================
     UPLOAD HELPERS
  ========================================================= */
  async function fetchWithTimeout(url, options={}, timeoutMs=CONFIG.UPLOAD_TIMEOUT_MS){
    const controller = new AbortController();
    const id = setTimeout(()=>controller.abort(new Error("timeout")), timeoutMs);
    try{
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(id);
    }
  }

  async function postForm(url, formData){
    let res = await fetchWithTimeout(url, { method:'POST', body: formData });
    if((!res.ok && res.status >= 500) && CONFIG.UPLOAD_RETRY > 0){
      await new Promise(r=>setTimeout(r, 400));
      res = await fetchWithTimeout(url, { method:'POST', body: formData });
    }
    return res;
  }

  /* =========================================================
     IMAGE UPLOAD
  ========================================================= */
  const imgInput = document.createElement('input');
  imgInput.type='file';
  imgInput.accept='image/*';
  imgInput.style.position='fixed';
  imgInput.style.left='-9999px';
  document.body.appendChild(imgInput);

  function showPreview(file){
    const url = URL.createObjectURL(file);
    preview.onload=()=>URL.revokeObjectURL(url);
    preview.onerror=()=>URL.revokeObjectURL(url);
    preview.src=url;
  }

  async function uploadImage(file){
    const form = new FormData();
    form.append('image', file, `image_${Date.now()}.jpg`);
    setStatus('Image: uploading...');
    const res = await postForm(CONFIG.SERVER + '/upload', form);
    if(!res.ok){
      const txt = await res.text().catch(()=> '');
      setStatus(`Image: upload failed (${res.status}) ${txt ? '\n'+txt.slice(0,120) : ''}`);
      return;
    }
    const data = await res.json().catch(()=> ({}));
    setStatus(`Image: uploaded ✅\n${data.savedAs ? 'savedAs: ' + data.savedAs : ''}`);
  }

  imgInput.addEventListener('change', async ()=>{
    const file = imgInput.files && imgInput.files[0];
    if(!file) return;
    showPreview(file);
    await uploadImage(file);
    imgInput.value='';
  });

  pickImageBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    setStatus('Select an image...');
    imgInput.click();
  });

  /* =========================================================
     TEXT UPLOAD
  ========================================================= */
  function focusPreviewText(){
    setTimeout(()=>textPreviewInput.focus({preventScroll:false}), 20);
  }
  focusTextBtn.addEventListener('click', (e)=>{
    e.preventDefault();
    setStatus('Text: 입력하세요');
    focusPreviewText();
  });

  async function uploadText(){
    const clean = (textPreviewInput.value ?? '').trim();
    if(!clean){
      setStatus('Text: 비어있음');
      focusPreviewText();
      return;
    }

    setStatus('Text: uploading...');
    const payload = { text: clean, clientTime: new Date().toISOString() };

    let res;
    try{
      res = await fetchWithTimeout(CONFIG.SERVER + '/upload-text', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload)
      });
    }catch(err){
      setStatus(`Text: upload error\n(${String(err && err.message ? err.message : err)})\nURL: ${CONFIG.SERVER}/upload-text`);
      return;
    }

    if(!res.ok){
      const txt = await res.text().catch(()=> '');
      setStatus(`Text: upload failed (${res.status}) ${txt ? '\n'+txt.slice(0,120) : ''}`);
      return;
    }

    const data = await res.json().catch(()=> ({}));
    setStatus(`Text: uploaded ✅\n${data.savedAs ? 'savedAs: ' + data.savedAs : ''}`);
  }

  sendTextBtn.addEventListener('click', async (e)=>{
    e.preventDefault();
    await uploadText();
  });

  // Optional: textarea에서 Cmd/Ctrl+Enter로 전송
  textPreviewInput.addEventListener('keydown', (e)=>{
    const isEnter = (e.key === 'Enter');
    const isCmd = e.metaKey || e.ctrlKey;
    if(isEnter && isCmd){
      e.preventDefault();
      uploadText();
    }
  });

})();
</script>
</body>
</html>
